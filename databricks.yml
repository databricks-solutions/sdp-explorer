bundle:
  name: sdp-explorer

# The app only needs app.py, app.yaml, requirements.txt and static/.
# Keep docs / dev-only / VCS files out of the packaged app source.
sync:
  exclude:
    - "CONTEXT.md"
    - "README.md"
    - "dev_server.py"
    - ".gitignore"

resources:
  apps:
    sdp-explorer:
      name: sdp-explorer
      description: "SDP Explorer — interactive Lakeflow Spark Declarative Pipelines feature demonstrations"
      source_code_path: .
      config:
        command:
          - python
          - app.py

variables:
  prod_service_principal:
    description: "Application ID (client ID) of the service principal that prod resources run as."
    # Replace with your prod service principal's application ID, or override at deploy time:
    #   databricks bundle deploy -t prod --var="prod_service_principal=<app-id>"
    default: "REPLACE_WITH_PROD_SP_APPLICATION_ID"

targets:
  # dev: runs as the user deploying the bundle.
  dev:
    mode: development
    default: true
    run_as:
      user_name: ${workspace.current_user.userName}

  # prod: runs as a service principal.
  prod:
    mode: production
    run_as:
      service_principal_name: ${var.prod_service_principal}
