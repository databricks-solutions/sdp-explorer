    const ok = await runPipeline(my, "prod", "📦 v1.4.0", "v1.4.0", "prod", false);
    if (!ok || !live(my)) return;
    banner.className = "recon diff show";
    bannerTxt.innerHTML = "Deployed <b>v1.4.0</b> to prod through the pipeline, behind a validate gate, as a service principal. Prod now matches the <code class='kw'>release/1.4.0</code> commit exactly.";
    prodNarr.innerHTML = "Now suppose v1.4.0 has a bad change — roll it back.";
    rollback.disabled = false;
  }

  async function doRollback() {
    run++; const my = run;
    rollback.disabled = true; prodRun.disabled = true;
    // flag prod as bad
    prodVer.className = "cc-vbadge bad"; prodVer.textContent = "v1.4.0 ⚠";
    nProdWs.classList.remove("done"); nProdWs.classList.add("lit");
    banner.className = "recon fail show";
    bannerTxt.innerHTML = "<b>v1.4.0 is bad in prod.</b> Don't hotfix the workspace — <code class='kw'>git revert</code> and let the same pipeline redeploy the last good commit.";
    await wait(1100); if (!live(my)) return;
    nProdWs.classList.remove("lit");
    // reset pipeline visuals for the redeploy
    steps.forEach((s, i) => setStep(i, ""));
    nPipe.classList.remove("done");
    prodNarr.innerHTML = "Reverted to <code class='kw'>v1.3.0</code> — the same pipeline redeploys it…";
    prodTok.className = "cc-token good"; prodTok.textContent = "↺ revert v1.3.0";
    const ok = await runPipeline(my, "good", "↺ v1.3.0", "v1.3.0", "good", true);
    if (!ok || !live(my)) return;
    banner.className = "recon diff show";
    bannerTxt.innerHTML = "<b>Rolled back.</b> The revert re-pointed the release at the last good commit and the <em>same</em> pipeline redeployed <b>v1.3.0</b> — no manual prod changes, no drift, fully auditable.";
    prodNarr.innerHTML = "Prod is back on v1.3.0. Rollback = one Git operation + a redeploy.";
  }

  prodRun.addEventListener("click", prodDeploy);
  rollback.addEventListener("click", doRollback);
  prodReset.addEventListener("click", prodResetFn);

  /* ===== scene toggle ===== */
  const toggle = document.getElementById("ccToggle");
  const fanScene = document.getElementById("ccFan");
  const devScene = document.getElementById("ccDev");
  const prodScene = document.getElementById("ccProd");
  function showScene(mode) {
    run++;   // cancel any in-flight animation on the outgoing scene
    fanScene.hidden = mode !== "fan";
    devScene.hidden = mode !== "dev";
    prodScene.hidden = mode !== "prod";
    [...toggle.children].forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    // build edges lazily once the scene's layout is measurable
    if (mode !== "dev") stopDevFlows();
    if (mode === "fan")  { if (!fanBuilt)  buildFanEdges();  fanResetFn(); }
    if (mode === "dev")  { if (!devBuilt)  buildDevEdges();  startDevFlows(); }
    if (mode === "prod") { if (!prodBuilt) buildProdEdges(); prodResetFn(); }
  }
  toggle.querySelectorAll("button").forEach(b => b.addEventListener("click", () => showScene(b.dataset.mode)));

  // boot: fan-out scene is visible, so its layout is measurable now
  buildFanEdges();
  fanResetFn();
}

/* ---------- REAL-TIME MODE wiring (latency race) ---------- */
function wireRealTimeMode() {
  const ARR = [100, 350, 600, 900, 1300, 1650, 2100, 2400];   // conceptual arrival times (ms)
  const INTERVAL = 1000;                                       // micro-batch trigger interval (ms)
  const RT_LAT = [7, 6, 8, 5, 7, 9, 6, 8];                     // real-time per-record latency (ms)
  const tickOf = a => { let t = Math.ceil(a / INTERVAL) * INTERVAL; return t === a ? a : t; };
  const mbLat = ARR.map(a => tickOf(a) - a);
  const groups = {};   // tick -> [event indices]
  ARR.forEach((a, i) => { const t = tickOf(a); (groups[t] = groups[t] || []).push(i); });

  const mbTrack = document.getElementById("rtMBTrack");
  const rtTrack = document.getElementById("rtRTTrack");
  const gate = document.getElementById("rtGate");
  const mbLatEl = document.getElementById("rtMBLat");
  const rtLatEl = document.getElementById("rtRTLat");
  const mbNEl = document.getElementById("rtMBN");
  const rtNEl = document.getElementById("rtRTN");
  const startBtn = document.getElementById("rtStart");
  const resetBtn = document.getElementById("rtReset");
  const speedSel = document.getElementById("rtSpeed");
  const narr = document.getElementById("rtNarr");
  const verdict = document.getElementById("rtVerdict");
  const verdictTxt = document.getElementById("rtVerdictTxt");

  let run = 0, tl = null;
  let mbDots = [], rtDots = [];
  let mbDone = [], rtDone = [];
  const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0) / a.length) : 0;

  function clearDots() {
    [...mbTrack.querySelectorAll(".rt-dot"), ...rtTrack.querySelectorAll(".rt-dot")].forEach(d => d.remove());
    mbDots = []; rtDots = [];
  }

  function mkDot(track) {
    const d = document.createElement("div"); d.className = "rt-dot";
    gsap.set(d, { left: 10, top: 31, opacity: 0 });
    track.appendChild(d); return d;
  }

  function updateVerdict(final) {
    const rAvg = avg(rtDone), mAvg = avg(mbDone);
    if (!rtDone.length && !mbDone.length) { verdict.classList.remove("show"); return; }
    verdict.classList.add("show");
    const factor = rAvg ? Math.round(mAvg / rAvg) : 0;
    const lead = final ? "<b>Same events, same order.</b> " : "";
    verdictTxt.innerHTML = `${lead}Real-time committed each record in <b>~${rAvg} ms</b>; micro-batch averaged <b>~${mAvg} ms</b> because records waited for the next tick — about <b>${factor}× lower latency</b> for the real-time lane.`;
  }

  function reset() {
    run++;
    if (tl) { tl.kill(); tl = null; }
    clearDots();
    mbDone = []; rtDone = [];
    gate.classList.remove("flush");
    mbNEl.textContent = "0"; rtNEl.textContent = "0";
    mbLatEl.textContent = "avg —"; rtLatEl.textContent = "avg —";
    verdict.classList.remove("show");
    startBtn.disabled = false; startBtn.textContent = "▶ Start stream";
    narr.innerHTML = "The same 8 events enter both lanes at the same instants. Start the stream and compare when each record actually commits.";
  }

  function start() {
    reset();
    const my = run;
    startBtn.disabled = true;
    const K = parseFloat(speedSel.value);       // anim seconds per conceptual second
    const s = ms => (ms / 1000) * K;             // conceptual ms → timeline position (s)
    const trackW = mbTrack.clientWidth / PAGE_ZOOM;
    const gateX = trackW * 0.60, outX = trackW - 39, mid = 31;

    // build the dots
    ARR.forEach(() => { mbDots.push(mkDot(mbTrack)); rtDots.push(mkDot(rtTrack)); });

    tl = gsap.timeline({ onComplete: () => { if (live()) { narr.innerHTML = "Done — real-time removes the batch-boundary wait entirely."; updateVerdict(true); startBtn.disabled = false; startBtn.textContent = "▶ Replay"; } } });
    const live = () => my === run;

    ARR.forEach((a, i) => {
      const grp = groups[tickOf(a)]; const idx = grp.indexOf(i);
      const stackTop = mid + (idx - (grp.length - 1) / 2) * 11;
      // both appear
      tl.to([mbDots[i], rtDots[i]], { opacity: 1, duration: 0.14 }, s(a));
      // real-time: straight to committed zone, near-instant
      tl.to(rtDots[i], { left: outX, duration: 0.42, ease: "power2.in" }, s(a));
      tl.call(() => { if (!live()) return; rtDots[i].classList.add("done"); rtDone.push(RT_LAT[i]); rtNEl.textContent = rtDone.length; rtLatEl.textContent = `avg ${avg(rtDone)} ms`; updateVerdict(false); }, null, s(a) + 0.42);
      // micro-batch: to the gate, then wait (stacked)
      tl.to(mbDots[i], { left: gateX, top: stackTop, duration: 0.5, ease: "power2.out" }, s(a));
    });

    // batch ticks flush everything waiting
    Object.keys(groups).map(Number).sort((x,y)=>x-y).forEach(t => {
      const dots = groups[t].map(i => mbDots[i]);
      tl.call(() => { if (!live()) return; gate.classList.add("flush"); gsap.fromTo(gate, { scaleX: 1 }, { scaleX: 1, duration: .01 }); narr.innerHTML = `Batch tick at ${t} ms fires — <b>${dots.length}</b> record${dots.length>1?"s":""} commit at once, each having waited up to <b>${Math.max(...groups[t].map(i=>mbLat[i]))} ms</b>.`; }, null, s(t));
      tl.to(dots, { left: outX, top: mid, duration: 0.46, ease: "power2.inOut" }, s(t));
      tl.call(() => { if (!live()) return; gate.classList.remove("flush"); groups[t].forEach(i => { mbDots[i].classList.add("done"); mbDone.push(mbLat[i]); }); mbNEl.textContent = mbDone.length; mbLatEl.textContent = `avg ${avg(mbDone)} ms`; updateVerdict(false); }, null, s(t) + 0.46);
    });
  }

  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", reset);
  reset();
}

function wireSinks() {
  const POOL = [
    { id: "e-101", label: "signup" }, { id: "e-102", label: "purchase" },
    { id: "e-103", label: "purchase" }, { id: "e-104", label: "refund" },
    { id: "e-105", label: "signup" }, { id: "e-106", label: "purchase" },
  ];
  const FORMATS = {
    kafka:     { name: "orders_topic",   badge: "kafka",     fmt: "kafka",     opts: `{ <span class="c-str">"kafka.bootstrap.servers"</span>: <span class="c-str">"..."</span>, <span class="c-str">"topic"</span>: <span class="c-str">"orders"</span> }` },
    eventhubs: { name: "telemetry-hub",  badge: "eventhubs", fmt: "eventhubs", opts: `{ <span class="c-str">"eventhubs.connectionString"</span>: <span class="c-str">"..."</span> }` },
    delta:     { name: "audit.events_out", badge: "delta · UC", fmt: "delta",  opts: `{ <span class="c-str">"tableName"</span>: <span class="c-str">"main.audit.events_out"</span> }` },
  };

  const srcEl = document.getElementById("skSrc");
  const sinkEl = document.getElementById("skSink");
  const srcSub = document.getElementById("skSrcSub");
  const sinkName = document.getElementById("skSinkName");
  const sinkBadge = document.getElementById("skSinkBadge");
  const fmtStr = document.getElementById("skFmtStr");
  const optsEl = document.getElementById("skOpts");
  const arrow = document.getElementById("skArrow");
  const banner = document.getElementById("skBanner");
  const bannerTxt = document.getElementById("skBannerTxt");
  const nextBtn = document.getElementById("skNext");
  const refreshBtn = document.getElementById("skRefresh");
  const resetBtn = document.getElementById("skReset");
  const narr = document.getElementById("skNarr");
  const toggle = document.getElementById("skToggle");

  let fmt = "kafka";
  let srcRows = [], sink = [], offset = 0, batch = 0;
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  let run = 0; const live = my => my === run;

  function applyFormat() {
    const f = FORMATS[fmt];
    sinkName.textContent = f.name; sinkBadge.textContent = f.badge;
    fmtStr.textContent = `"${f.fmt}"`; optsEl.innerHTML = f.opts;
    [...toggle.children].forEach(b => b.classList.toggle("active", b.dataset.fmt === fmt));
  }

  function renderSrc() {
    if (!srcRows.length) { srcEl.innerHTML = `<div class="enz-empty" style="padding:30px 10px;color:var(--muted);text-align:center;">Empty — run a micro-batch.</div>`; return; }
    srcEl.innerHTML = srcRows.map((r,i) => `<div class="row ${r._new?"appended":""}" data-id="${r.id}">
      <span class="part">${r.id}</span>
      <span class="label">${r.label} ${i < offset ? '<span class="tag keep">sent</span>' : '<span class="tag src">pending</span>'}</span>
    </div>`).join("");
  }
  function renderSink() {
    if (!sink.length) { sinkEl.innerHTML = `<div class="sink-empty">no messages yet</div>`; return; }
    sinkEl.innerHTML = sink.map(m => `<div class="smsg ${m.dup?"dup":""}" data-mid="${m.mid}">
      <span class="skey">${m.id}</span><span>${m.label}${m.dup?" · dup":""}</span><span class="soff">off ${m.off}</span>
    </div>`).join("");
  }

  async function flySome(newMsgs, my) {
    renderSink();
    const els = newMsgs.map(m => sinkEl.querySelector(`[data-mid="${m.mid}"]`));
    els.forEach(el => gsap.set(el, { opacity: 0 }));
    await Promise.all(newMsgs.map(async (m, i) => {
      await wait(i * 120); if (!live(my)) return;
      const from = srcEl.querySelector(`[data-id="${m.id}"]`) || arrow;
      await flyRow(from, els[i], { cloneOf: "to" }); if (!live(my)) return;
      gsap.from(els[i], { scale: .96, duration: .25, ease: EASE.pop });
    }));
  }

  function reset() {
    run++;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    srcRows = []; sink = []; offset = 0; batch = 0;
    arrow.classList.remove("live");
    banner.className = "recon";
    applyFormat(); renderSrc(); renderSink();
    srcSub.textContent = "pipeline streaming table · offset 0";
    nextBtn.disabled = false; nextBtn.textContent = "▶ Next micro-batch"; refreshBtn.disabled = true;
    narr.innerHTML = "The <code class='kw'>events</code> table feeds an <b>append flow</b> into an external sink. Run a micro-batch and watch records leave the lakehouse.";
  }

  async function next() {
    if (offset >= POOL.length) return;
    const my = run;
    nextBtn.disabled = true; refreshBtn.disabled = true;
    srcRows.forEach(r => r._new = false);
    const add = POOL.slice(srcRows.length, srcRows.length + 2);
    add.forEach(r => srcRows.push({ ...r, _new: true }));
    batch++;
    renderSrc();
    arrow.classList.add("live");
    narr.innerHTML = `Micro-batch ${batch}: ${add.length} new records land in <code class='kw'>events</code>…`;
    await wait(700); if (!live(my)) return;
    // append flow reads rows past the checkpoint offset and emits them
    const toSend = srcRows.slice(offset);
    const newMsgs = toSend.map(r => { const m = { id: r.id, label: r.label, off: sink.length, mid: "m" + Math.random() }; sink.push(m); return m; });
    await flySome(newMsgs, my); if (!live(my)) return;
    offset = srcRows.length;
    renderSrc();
    srcSub.textContent = `pipeline streaming table · offset ${offset}`;
    arrow.classList.remove("live");
    banner.className = "recon diff show";
    bannerTxt.innerHTML = `Batch ${batch}: the append flow emitted <b>${newMsgs.length}</b> record${newMsgs.length>1?"s":""} to <code class='kw'>${FORMATS[fmt].name}</code>. Checkpoint offset advanced to <b>${offset}</b> — already-sent rows are never re-emitted in normal operation.`;
    narr.innerHTML = "Each record leaves exactly once while the pipeline runs normally.";
    if (offset >= POOL.length) { nextBtn.disabled = true; nextBtn.textContent = "stream drained"; }
    else nextBtn.disabled = false;
    if (batch >= 2) refreshBtn.disabled = false;
  }

  async function refresh() {
    const my = run;
    nextBtn.disabled = true; refreshBtn.disabled = true;
    arrow.classList.add("live");
    banner.className = "recon show";
    bannerTxt.innerHTML = `<b>Full refresh:</b> <code class='kw'>events</code> is rebuilt and the append flow replays from <b>offset 0</b> — but the sink is <b>not</b> truncated…`;
    narr.innerHTML = "Rebuilding the pipeline table and replaying the flow…";
    // rebuild source (recomputed, same data)
    srcRows.forEach(r => r._new = false);
    offset = 0; renderSrc(); srcSub.textContent = "pipeline streaming table · offset 0 (rebuilt)";
    gsap.fromTo([...srcEl.children], { opacity: .4 }, { opacity: 1, duration: .5, stagger: .04 });
    await wait(800); if (!live(my)) return;
    // re-emit ALL rows → duplicates in the un-truncated sink
    const dupMsgs = srcRows.map(r => ({ id: r.id, label: r.label, off: 0, mid: "d" + Math.random(), dup: true }));
    dupMsgs.forEach(m => { m.off = sink.length; sink.push(m); });
    await flySome(dupMsgs, my); if (!live(my)) return;
    offset = srcRows.length; renderSrc();
    srcSub.textContent = `pipeline streaming table · offset ${offset}`;
    arrow.classList.remove("live");
    banner.className = "recon show";
    bannerTxt.innerHTML = `The sink kept its old messages and the replay <b>re-emitted all ${dupMsgs.length}</b> rows on top (amber). Downstream now sees <b>duplicates</b> — sinks are at-least-once and are never reset by a full refresh.`;
    narr.innerHTML = "That's the gotcha: make consumers idempotent, or rotate the sink yourself before a full refresh.";
    refreshBtn.disabled = true;
  }

  toggle.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (b.dataset.fmt === fmt) return; fmt = b.dataset.fmt; applyFormat(); }));
  nextBtn.addEventListener("click", next);
  refreshBtn.addEventListener("click", refresh);
  resetBtn.addEventListener("click", reset);
  reset();
}
function wireLiquidClustering() {
  const CA = "CA";
  const LAYOUTS = {
    none: Array.from({ length: 8 }, () => ["CA", "US", "UK", "FR"]),
    by:   [["CA","CA","CA","CA"],["CA","CA","CA","CA"],["US","US","US","US"],["US","US","US","US"],["UK","UK","UK","UK"],["UK","UK","UK","UK"],["FR","FR","FR","FR"],["FR","FR","FR","FR"]],
  };
  LAYOUTS.auto = LAYOUTS.by;
  const N = 8, ROWS = 4;

  const grid = document.getElementById("lcGrid");
  const toggle = document.getElementById("lcToggle");
  const sScanned = document.getElementById("lcScanned");
  const sSkipped = document.getElementById("lcSkipped");
  const sRows = document.getElementById("lcRows");
  const runBtn = document.getElementById("lcRun");
  const resetBtn = document.getElementById("lcReset");
  const narr = document.getElementById("lcNarr");

  let mode = "none";
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  let run = 0; const live = my => my === run;

  function layout() { return LAYOUTS[mode]; }

  function renderGrid() {
    grid.innerHTML = layout().map((regs, i) => `<div class="lc-file" data-i="${i}">
      <div class="fh"><span>part-${String(i+1).padStart(4,"0")}</span><span class="fst" data-st>${ROWS} rows</span></div>
      <div class="lc-chips">${regs.map(r => `<span class="lc-rg ${r}">${r}</span>`).join("")}</div>
    </div>`).join("");
  }

  function reset() {
    run++;
    mode && [...toggle.children].forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    renderGrid();
    sScanned.textContent = `— / ${N}`; sSkipped.textContent = "—"; sRows.textContent = `— / ${N*ROWS}`;
    runBtn.disabled = false;
    narr.innerHTML = mode === "none"
      ? "Rows are spread across every file, so <code class='kw'>region = 'CA'</code> could be anywhere. Run the query."
      : mode === "auto"
        ? "Databricks chose <code class='kw'>region</code> as the clustering key from query patterns. Run the query."
        : "Rows are clustered by <code class='kw'>region</code>, so each file holds one region. Run the query.";
  }

  async function runQuery() {
    const my = run;
    runBtn.disabled = true;
    const L = layout();
    let scanned = 0;
    for (let i = 0; i < N; i++) {
      await wait(150); if (!live(my)) return;
      const el = grid.querySelector(`[data-i="${i}"]`);
      const st = el.querySelector("[data-st]");
      const hit = L[i].includes(CA);   // file min/max can't rule CA out
      if (hit) { el.classList.add("scanned"); st.textContent = "scan"; scanned++; gsap.fromTo(el, { scale: .97 }, { scale: 1, duration: .3, ease: EASE.pop }); }
      else { el.classList.add("skipped"); st.textContent = "pruned"; }
      sScanned.textContent = `${scanned} / ${N}`;
      sRows.textContent = `${scanned*ROWS} / ${N*ROWS}`;
      sSkipped.textContent = Math.round((i+1 - scanned) / (i+1) * 100) + "%";
    }
    if (!live(my)) return;
    const skippedPct = Math.round((N - scanned) / N * 100);
    sSkipped.textContent = skippedPct + "%";
    narr.innerHTML = mode === "none"
      ? `<b>${scanned} of ${N} files</b> scanned — nothing could be pruned, so the query read every row. This is the cost of no clustering.`
      : `Only <b>${scanned} of ${N} files</b> scanned — the other ${N-scanned} were pruned by their min/max stats. <b>${skippedPct}% of the data skipped</b> for the same query.`;
  }

  toggle.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (b.dataset.mode === mode) return; mode = b.dataset.mode; reset(); }));
  runBtn.addEventListener("click", runQuery);
  resetBtn.addEventListener("click", reset);
  reset();
}

function wireWatermarks() {
  const WIN = 10, DELAY = 5, TMAX = 30, NW = 3;
  const SEQ = [4, 8, 12, 16, 3, 22, 26, 9];   // event times in arrival order (3 & 9 arrive late)
  const axis = document.getElementById("wmAxis");
  const chips = document.getElementById("wmChips");
  const insight = document.getElementById("wmInsight");
  const nextBtn = document.getElementById("wmNext");
  const resetBtn = document.getElementById("wmReset");
  const narr = document.getElementById("wmNarr");

  let i = 0, counts = [0,0,0], closed = [false,false,false], maxSeen = null, dropped = 0;
  const wait = ms => gsap.to({}, { duration: ms * 1.4 / 1000 });
  let run = 0; const live = my => my === run;
  const axW = () => axis.clientWidth / PAGE_ZOOM;
  const xpx = t => (t / TMAX) * axW();

  function buildAxis() {
    let html = "";
    for (let w = 0; w < NW; w++) {
      const left = (w * WIN / TMAX) * 100, width = (WIN / TMAX) * 100;
      html += `<div class="wm-band" data-w="${w}" style="left:${left}%;width:${width}%;">
        <div class="bl">W${w+1} [${w*WIN},${(w+1)*WIN})</div>
        <div class="bc" data-bc>0</div>
        <div class="bs" data-bs>open</div>
      </div>`;
    }
    html += `<div class="wm-baseline"></div>`;
    for (let t = 0; t <= TMAX; t += WIN) html += `<div class="wm-tick" style="left:${(t/TMAX)*100}%;">${t}m</div>`;
    html += `<div class="wm-mark" id="wmMark"><span>watermark</span></div>`;
    axis.innerHTML = html;
  }

  function updateBands() {
    for (let w = 0; w < NW; w++) {
      const band = axis.querySelector(`.wm-band[data-w="${w}"]`);
      band.querySelector("[data-bc]").textContent = counts[w];
      band.classList.toggle("active", counts[w] > 0 && !closed[w]);
      band.classList.toggle("closed", closed[w]);
      band.querySelector("[data-bs]").textContent = closed[w] ? `emitted ${counts[w]} · state freed` : (counts[w] > 0 ? "open · in state" : "open");
    }
  }
  function updateChips() {
    const open = counts.filter((c, w) => c > 0 && !closed[w]).length;
    const touched = counts.filter(c => c > 0).length;
    chips.innerHTML = `<span class="chip ok">windows in state: ${open}</span><span class="chip warn">dropped (late): ${dropped}</span><span class="chip">without a watermark: ${touched} still open</span>`;
  }

  function reset() {
    run++;
    i = 0; counts = [0,0,0]; closed = [false,false,false]; maxSeen = null; dropped = 0;
    buildAxis(); updateBands(); updateChips();
    nextBtn.disabled = false; nextBtn.textContent = "▶ Next event";
    insight.innerHTML = "Each event is stamped with its <b>event time</b>. Accepted events count into their window; the watermark advances with the latest event time seen.";
    narr.innerHTML = "Step events in. The watermark bar advances as event time moves forward.";
  }

  async function step() {
    if (i >= SEQ.length) return;
    const my = run;
    nextBtn.disabled = true;
    const et = SEQ[i]; i++;
    const w = Math.floor(et / WIN);
    const wmPrev = maxSeen == null ? -Infinity : maxSeen - DELAY;
    const isDrop = et < wmPrev;

    const dot = document.createElement("div");
    dot.className = "wm-dot " + (isDrop ? "drop" : "acc");
    dot.innerHTML = `<span class="dl">${et}m${isDrop ? " · dropped" : ""}</span>`;
    axis.appendChild(dot);

    if (isDrop) {
      dropped++;
      gsap.set(dot, { left: xpx(et), top: 34, opacity: 0, scale: .6 });
      await gsap.to(dot, { opacity: 1, scale: 1, duration: .25, ease: EASE.pop }); if (!live(my)) return;
      await gsap.to(dot, { top: 128, opacity: .5, duration: .55, ease: EASE.in }); if (!live(my)) return;
      narr.innerHTML = `Event at <b>${et}m</b> is older than the watermark (${wmPrev}m) — its window already closed, so it's <b>dropped</b>.`;
    } else {
      counts[w]++; maxSeen = Math.max(maxSeen ?? et, et);
      const top = 34 + (counts[w] - 1) * 20;
      gsap.set(dot, { left: xpx(et), top, opacity: 0, scale: .6 });
      updateBands();
      const band = axis.querySelector(`.wm-band[data-w="${w}"]`);
      gsap.fromTo(band, { scale: 1 }, { scale: 1.01, duration: .2, yoyo: true, repeat: 1 });
      await gsap.to(dot, { opacity: 1, scale: 1, duration: .3, ease: EASE.pop }); if (!live(my)) return;
      narr.innerHTML = `Event at <b>${et}m</b> lands in <b>W${w+1}</b> (count ${counts[w]}). Latest event time is now ${maxSeen}m.`;
    }

    // advance the watermark
    const wm = (maxSeen ?? 0) - DELAY;
    const mark = document.getElementById("wmMark");
    if (wm < 0) gsap.to(mark, { opacity: 0, duration: .3 });
    else { gsap.set(mark, { left: xpx(wm) }); gsap.to(mark, { opacity: 1, duration: .3 });
      await gsap.fromTo(mark, { left: mark._last ?? xpx(wm) }, { left: xpx(wm), duration: .5, ease: EASE.inOut }); mark._last = xpx(wm); }
    if (!live(my)) return;

    // close any window the watermark has passed
    let closedNow = null;
    for (let ww = 0; ww < NW; ww++) {
      if (!closed[ww] && counts[ww] > 0 && (ww + 1) * WIN <= wm) { closed[ww] = true; closedNow = ww; }
    }
    updateBands(); updateChips();
    if (closedNow != null) {
      const band = axis.querySelector(`.wm-band[data-w="${closedNow}"]`);
      gsap.fromTo(band, { backgroundColor: "#fff3cd" }, { backgroundColor: "rgba(47,138,91,.10)", duration: .6 });
      insight.innerHTML = `Watermark passed <b>${(closedNow+1)*WIN}m</b>, so <b>W${closedNow+1}</b> is finalized and its state is <b>freed</b>. That's the bound — closed windows don't stay in memory.`;
    }

    if (i >= SEQ.length) {
      nextBtn.disabled = true; nextBtn.textContent = "stream caught up";
      narr.innerHTML = `Done — <b>${dropped}</b> late events dropped, at most <b>2</b> windows ever held in state. Without a watermark all <b>3</b> would still be open.`;
    } else nextBtn.disabled = false;
  }

  nextBtn.addEventListener("click", step);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- boot ---------- */
routeFromHash();
</script>
</body>
</html>
