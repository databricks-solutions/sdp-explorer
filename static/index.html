<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>SDP Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&family=Martian+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>
<script src="gsap-flip.min.js"></script>
<style>
  :root {
    --bg: #e7edef;          /* cool blueprint stage the white instrument cards sit on */
    --rail: #fbfcfc;        /* header + sidebar rails */
    --ink: #0e1b21;         /* deeper, more confident than docs ink */
    --ink-2: #3d4f57;
    --muted: #6b7c85;
    --line: #d2dbdf;        /* blueprint hairline (a touch cooler/stronger) */
    --line-2: #e3e9eb;
    --panel: #eef2f3;
    --display: "Martian Mono", "DM Mono", ui-monospace, monospace;
    --live: #ff3621;        /* single decisive accent: the "changed / live / act" colour */
    --live-soft: #ff36211f;
    --blue: #2272b4;
    --blue-bg: #eaf3fa;
    --red: #ff3621;
    --red-soft: #ff36211a;
    --keep: #2f8a5b;
    --keep-soft: #eaf6ef;
    --keep-line: #bfe3cf;
    --target: #c2410c;
    --target-soft: #fff1e9;
    --target-line: #f6caac;
    --src: #2272b4;
    --src-soft: #eaf3fa;
    --src-line: #bcd8ee;
    --sidebar-w: 300px;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    zoom: 1.1;   /* bake in the ~110% baseline the layout reads best at */
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- HEADER ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    height: var(--header-h);
    display: flex; align-items: center; gap: 26px;
    padding: 0 26px;
    background: var(--rail); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 22px; width: auto; display: block; }
  .brand .sep { color: var(--line); font-weight: 300; font-size: 22px; margin: 0 2px; }
  .brand .product { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  /* live-status eyebrow that names the subject, console-style */
  .brand .status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--display);
    font-size: 10px; font-weight: 500; letter-spacing: .04em; color: var(--muted); text-transform: lowercase; }
  .brand .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live);
    box-shadow: 0 0 0 3px var(--live-soft); animation: livepulse 2.4s ease-in-out infinite; }
  @keyframes livepulse { 0%,100%{ opacity: 1; } 50%{ opacity: .35; } }
  header nav { display: flex; gap: 20px; margin-left: 6px; }
  header nav a { color: var(--ink-2); font-size: 12px; font-family: var(--display); font-weight: 500; letter-spacing: .02em; }
  header nav a.active { color: var(--ink); }
  header nav a:hover { text-decoration: none; color: var(--live); }
  .header-spacer { flex: 1; }

  /* ---------- LAYOUT ---------- */
  .shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; align-items: start; }

  /* ---------- SIDEBAR ---------- */
  aside {
    position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 20px 0 60px;
    background: var(--rail);
  }
  .side-title { padding: 0 20px 14px; font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); text-transform: lowercase; border-bottom: 1px solid var(--line-2); margin-bottom: 8px; }
  .nav-group { margin-top: 16px; }
  .nav-group > .grp-label {
    padding: 6px 20px; font-family: var(--display); font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 20px 7px 20px; font-size: 14px; color: var(--ink-2); cursor: pointer;
    border-left: 2px solid transparent; transition: color .12s, background .12s, border-color .12s;
  }
  .nav-item:hover { background: #fff; color: var(--ink); border-left-color: var(--line); }
  .nav-item.active { color: var(--ink); border-left-color: var(--live); background: #fff; font-weight: 600; }
  .nav-item.soon { color: #aab6bd; cursor: default; }
  .nav-item.soon:hover { background: transparent; border-left-color: transparent; }
  .pill { font-family: var(--display); font-size: 8.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--rail); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }

  /* ---------- MAIN ---------- */
  main { padding: 38px 48px 100px; max-width: 1240px; }
  /* breadcrumb reframed as a console eyebrow — mono, tracked, with a live tick */
  .crumb { font-family: var(--display); color: var(--muted); font-size: 10.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .1em; margin-bottom: 18px; display: flex; align-items: center; gap: 9px; }
  .crumb::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; }
  .crumb b { color: var(--ink-2); font-weight: 600; }
  .crumb .sep { margin: 0 2px; color: var(--line); }
  /* feature names ARE sql keywords — so set the H1 like code */
  h1 { font-family: var(--display); font-size: 33px; font-weight: 600; letter-spacing: -0.01em;
    margin: 0 0 14px; line-height: 1.08; text-transform: uppercase; color: var(--ink); }
  h1 .verb { color: var(--live); }        /* highlight the sql verb, syntax-style */
  .oneliner { color: var(--ink-2); font-size: 17.5px; margin: 0 0 34px; max-width: 70ch; line-height: 1.6; }
  .oneliner em { font-style: normal; color: var(--ink); background: linear-gradient(transparent 62%, var(--live-soft) 62%); padding: 0 1px; }
  code.kw { font-family: "DM Mono", ui-monospace, Menlo, monospace; color: var(--live); font-size: .9em; background: var(--red-soft); padding: 1px 5px; border-radius: 4px; }

  section { margin-bottom: 44px; }
  section > h2 {
    font-family: var(--display); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-2); margin: 0 0 18px; padding: 0 0 0 15px; border: none; position: relative;
  }
  /* short leading rule instead of a full underline — a blueprint annotation, not a docs divider */
  section > h2::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 7px; height: 2px; background: var(--live); }

  /* ---- code block ---- */
  .code-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0 0 24px; }
  .code-card .bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 7px 14px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .sql { background: #fff; padding: 16px 18px; font-family: "DM Mono", ui-monospace, Menlo, monospace; font-size: 13.5px; line-height: 1.75; overflow-x: auto; color: var(--ink); white-space: pre; }
  .sql .c-key { color: var(--blue); font-weight: 500; }
  .sql .c-tbl { color: var(--ink); }
  .sql .c-str { color: var(--keep); }
  .sql .c-num { color: var(--target); }
  .sql .c-dim { color: var(--muted); }
  .sql .hl { background: #fff3cd; border-radius: 3px; box-shadow: 0 0 0 1px #f3e2a6; }

  /* ---- flow ---- */
  .flow { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: stretch; }
  .tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .tbl-head { padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tbl-head .name { font-family: "DM Mono", monospace; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .tbl-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tbl-body { padding: 8px; min-height: 232px; }
  .src-panel .tbl-head { background: var(--src-soft); border-bottom-color: var(--src-line); }
  .src-panel .name { color: var(--src); }

  .row {
    display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 8px;
    padding: 9px 11px; margin: 6px 0; border-radius: 7px;
    background: #fff; border: 1px solid var(--line); font-size: 13.5px;
    transition: opacity .45s ease, transform .5s cubic-bezier(.4,0,.2,1), background .4s, border-color .4s,
                max-height .45s ease, padding .45s, margin .45s;
    max-height: 56px; overflow: hidden;
  }
  .row .part { font-family: "DM Mono", monospace; color: var(--ink-2); font-size: 12.5px; }
  .row .label { color: var(--ink); }
  .row .amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .row.keep   { background: var(--keep-soft);   border-color: var(--keep-line); }
  .row.target { background: var(--target-soft); border-color: var(--target-line); }
  .row.src    { background: var(--src-soft);    border-color: var(--src-line); }
  .row.removing { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; transform: translateX(40px) scale(.96); }
  .row.entering { opacity: 0; transform: translateX(-46px); }
  .row.consumed { opacity: .3; filter: saturate(.4); }
  /* GSAP-driven rows: motion belongs to GSAP alone — CSS keeps only the color crossfades.
     (A CSS transition on transform/opacity would re-interpolate GSAP's per-frame styles.) */
  .gsap-rows .row { transition: background .4s, border-color .4s; max-height: none; }
  .gsap-rows .enz-row, .gsap-rows .ev { transition: background .4s, border-color .4s; }
  .fly-clone { pointer-events: none; box-shadow: 0 6px 24px rgba(27,49,57,.18); transition: none !important; max-height: none !important; }

  .tag { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .tag.keep   { background: #fff; color: var(--keep);   border: 1px solid var(--keep-line); }
  .tag.target { background: #fff; color: var(--target); border: 1px solid var(--target-line); }
  .tag.src    { background: #fff; color: var(--src);    border: 1px solid var(--src-line); }

  /* flow spine: the two panels read as endpoints of a pipeline, not just boxes with an arrow */
  .arrow { position: relative; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
  .arrow::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 2px;
    background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 9px); transform: translateY(-50%); }
  .arrow svg { position: relative; width: 24px; height: 24px; background: var(--bg); padding: 3px 0; z-index: 1; }
  .arrow .flow-tag { position: absolute; top: calc(50% - 26px); left: 50%; transform: translateX(-50%);
    font-family: var(--display); font-size: 8px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); background: var(--bg); padding: 0 4px; white-space: nowrap; }
  .arrow.live { color: var(--live); }
  .arrow.live::before { background: repeating-linear-gradient(90deg, var(--live) 0 5px, transparent 5px 9px);
    animation: flowdash .6s linear infinite; }
  @keyframes flowdash { to { background-position: 14px 0; } }
  .arrow.live svg { color: var(--live); animation: nudge .8s ease-in-out infinite; }
  .arrow.live .flow-tag { color: var(--live); }
  @keyframes nudge { 0%,100%{ transform: translateX(0);} 50%{ transform: translateX(4px);} }

  .controls { display: flex; gap: 12px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
  button {
    font-family: inherit; background: var(--red); color: #fff; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .narr { color: var(--ink-2); font-size: 14px; min-height: 22px; flex: 1; min-width: 240px; }
  .narr b { color: var(--ink); }

  .note { display: flex; gap: 12px; background: var(--blue-bg); border: 1px solid var(--src-line); border-left: 4px solid var(--blue); border-radius: 8px; padding: 14px 16px; margin-top: 20px; }
  .note .ic { color: var(--blue); font-weight: 700; }
  .note p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .note b { color: var(--ink); }

  /* clickable cross-reference banner (navigate to a related card) */
  a.xref { display: flex; align-items: center; gap: 14px; text-decoration: none;
    background: var(--blue-bg); border: 1px solid var(--src-line); border-left: 4px solid var(--blue);
    border-radius: 8px; padding: 13px 18px; margin: 0 0 34px; transition: box-shadow .15s, transform .05s; }
  a.xref:hover { text-decoration: none; box-shadow: 0 2px 12px rgba(34,114,180,.16); }
  a.xref:active { transform: translateY(1px); }
  a.xref .ic { color: var(--blue); font-size: 20px; line-height: 1; }
  a.xref .tx { flex: 1; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
  a.xref .tx b { color: var(--ink); }
  a.xref .go { flex: none; font-size: 13.5px; font-weight: 600; color: var(--blue); white-space: nowrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; background: #fff; }
  .box h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .box.bad h3  { color: var(--target); }
  .box.good h3 { color: var(--keep); }
  .box p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; }

  .col-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  ul.clean { margin: 8px 0 0; padding-left: 20px; }
  ul.clean li { margin: 9px 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
  ul.watch li::marker { color: var(--red); }

  /* placeholder for unbuilt demos */
  .placeholder { text-align: center; padding: 90px 20px; color: var(--muted); }
  .placeholder h1 { font-size: 28px; color: var(--ink-2); }

  /* ---- preview marking ---- */
  .pill.preview { color: #9a5b00; background: #fff6e6; border-color: #f2d399; }
  .badge-preview {
    display: inline-flex; align-items: center; gap: 6px; vertical-align: middle;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: #9a5b00; background: #fff6e6; border: 1px solid #f2d399; border-radius: 99px; padding: 3px 10px; margin-left: 14px;
  }
  .preview-banner {
    display: flex; gap: 12px; align-items: flex-start;
    background: #fff8ec; border: 1px solid #f2d399; border-left: 4px solid #e8920a; border-radius: 8px;
    padding: 13px 16px; margin: 0 0 30px;
  }
  .preview-banner .ic { color: #e8920a; font-size: 16px; line-height: 1.4; }
  .preview-banner p { margin: 0; font-size: 13.5px; color: #6b5320; line-height: 1.5; }
  .preview-banner b { color: #5a4410; }
  .preview-banner code { font-family: "DM Mono", monospace; font-size: .92em; background: #fff0d4; padding: 1px 5px; border-radius: 4px; color: #7a4d00; }

  /* ---- JSON highlighting ---- */
  .sql .c-jkey { color: var(--blue); }

  /* ---- rewind timeline stage ---- */
  .stage { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px 22px; background: linear-gradient(180deg,#fff, #fcfdfd); --lane-label: 132px; }
  .tdiv { position: absolute; top: 14px; bottom: 14px; left: calc(50% + 66px); width: 0; border-left: 2px dashed #e8920a; z-index: 3; }
  .tdiv span { position: absolute; top: -2px; left: 6px; font-size: 10.5px; font-weight: 700; color: #b9760a; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
  .lane { display: grid; grid-template-columns: var(--lane-label) 1fr; align-items: center; margin: 9px 0; }
  .lane-label { font-size: 13px; font-weight: 600; color: var(--ink); padding-right: 14px; display: flex; flex-direction: column; gap: 1px; }
  .lane-label .sub2 { font-size: 11px; font-weight: 400; color: var(--muted); }
  .lane-label .code-badge { margin-top: 5px; align-self: flex-start; font-family: "DM Mono", monospace; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); transition: all .4s; }
  .code-badge.good  { color: var(--keep);   background: var(--keep-soft);   border-color: var(--keep-line); }
  .code-badge.bad   { color: var(--target); background: var(--target-soft); border-color: var(--target-line); }
  .code-badge.fixed { color: var(--blue);   background: var(--blue-bg);     border-color: var(--src-line); }
  .track { display: grid; grid-template-columns: repeat(var(--cols, 8), 1fr); gap: 4px; position: relative; }
  .axis-track { margin-bottom: 2px; }
  .axis-track .tick { text-align: center; font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .cell {
    height: 38px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    font-family: "DM Mono", monospace; font-size: 10.5px; border: 1px solid var(--line); background: #fff;
    transition: background .5s, border-color .5s, color .5s, opacity .5s, transform .5s;
  }
  .src-cell.consumed  { opacity: .4; }
  .src-cell.available { border-color: var(--src-line); background: var(--src-soft); color: var(--src); border-style: dashed; }
  .src-cell.replaying { border-color: var(--src); background: var(--src-soft); color: var(--src); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 #2272b400; } 50%{ box-shadow: 0 0 0 3px #2272b433; } }
  .tgt-cell.good  { background: var(--keep-soft);   border-color: var(--keep-line); color: var(--keep); }
  .tgt-cell.bad   { background: var(--target-soft); border-color: var(--target-line); color: var(--target); }
  .tgt-cell.empty { border-style: dashed; color: #c4ccd1; }
  .pipe-track { height: 34px; }
  .ckpt-rail { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); }
  .ckpt-ptr { position: absolute; top: 50%; transform: translate(-50%, -50%); transition: left .8s cubic-bezier(.4,0,.2,1); z-index: 2; }
  .ckpt-ptr .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--ink); margin: 0 auto; }
  .ckpt-ptr span { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }

  .steps { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
  .step { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px; background: #fff; transition: all .35s; opacity: .55; }
  .step .num { font-weight: 700; color: var(--muted); margin-right: 6px; }
  .step .t { font-size: 13px; font-weight: 600; color: var(--ink); }
  .step .d { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .step.active { opacity: 1; border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .step.active .num { color: var(--red); }
  .step.done { opacity: 1; border-color: var(--keep-line); background: var(--keep-soft); }
  .step.done .num { color: var(--keep); }

  /* ---- interactive rewind ---- */
  .rr-grid { position: relative; --lane-label: 132px; --cols: 15; }
  .rr-band { position: absolute; top: 36px; bottom: 6px; right: 0; background: rgba(232,146,10,.07); border-left: 2px dashed #e8920a; z-index: 1; pointer-events: none; border-radius: 0 6px 6px 0; transition: left .15s; }
  .rr-band .flag { position: absolute; top: -22px; left: -1px; transform: translateX(-50%); background: #e8920a; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; letter-spacing: .04em; }
  .rr-bug { position: absolute; top: 36px; z-index: 2; pointer-events: none; transform: translateX(-50%); }
  .rr-bug .bm { width: 0; border-left: 2px dotted var(--target); height: calc(100% - 42px); position: absolute; top: 0; transition: border-color .5s; }
  .rr-bug .bl { position: absolute; top: -22px; transform: translateX(-50%); background: var(--target-soft); color: var(--target); border: 1px solid var(--target-line); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; transition: background .5s, color .5s, border-color .5s; }
  .rr-bug.patched .bm { border-left-color: var(--keep); }
  .rr-bug.patched .bl { background: var(--keep-soft); color: var(--keep); border-color: var(--keep-line); }

  .rr-ruler { position: relative; height: 30px; cursor: pointer; touch-action: none; }
  .rr-ruler .rail { position: absolute; left: 0; right: 0; top: 50%; height: 5px; background: var(--line); border-radius: 3px; transform: translateY(-50%); }
  .rr-ruler .fillpast { position: absolute; left: 0; top: 50%; height: 5px; background: var(--keep-line); border-radius: 3px; transform: translateY(-50%); transition: width .15s; }
  .rr-handle { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 4px solid #e8920a; box-shadow: 0 1px 5px #0003; transform: translate(-50%,-50%); z-index: 3; cursor: grab; transition: left .15s; }
  .rr-handle:active { cursor: grabbing; }
  .rr-handle::after { content: "‹ ›"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #e8920a; letter-spacing: -1px; }

  .tgt-cell { flex-direction: column; gap: 0; font-size: 10px; line-height: 1.12; }
  .tgt-cell .bn { font-size: 8.5px; color: var(--muted); }
  .tgt-cell.kept { color: var(--ink-2); }
  .tgt-cell.replayed { animation: flashgood .8s ease; }
  @keyframes flashgood {
    0%{ transform: scale(.86); box-shadow: 0 0 0 0 rgba(47,138,91,0); }
    45%{ transform: scale(1.08); box-shadow: 0 0 0 5px rgba(47,138,91,.45); }
    100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(47,138,91,0); }
  }
  .tgt-cell.erasing { animation: flasherase .7s ease; }
  @keyframes flasherase {
    0%{ box-shadow: 0 0 0 0 rgba(194,65,12,0); }
    45%{ box-shadow: 0 0 0 5px rgba(194,65,12,.5); transform: scale(1.06); }
    100%{ box-shadow: 0 0 0 0 rgba(194,65,12,0); transform: scale(1); }
  }
  .tgt-cell.targeting { box-shadow: 0 0 0 2px rgba(232,146,10,.55); }

  .insight { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 15px; background: var(--blue-bg); border: 1px solid var(--src-line); border-radius: 8px; }
  .insight .ic { color: var(--blue); font-size: 15px; }
  .insight p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .insight b { color: var(--ink); }

  /* ---- AUTO CDC ---- */
  .cdc-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cdc-toggle button { background: #fff; color: var(--ink-2); border: none; padding: 8px 18px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .cdc-toggle button + button { border-left: 1px solid var(--line); }
  .cdc-toggle button.active { background: var(--ink); color: #fff; }
  .cdc-mode-desc { font-size: 13.5px; color: var(--ink-2); margin: 10px 0 18px; }
  .cdc-mode-desc b { color: var(--ink); }

  .cdc-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px){ .cdc-wrap { grid-template-columns: 1fr; } }

  .ev-head { display: grid; grid-template-columns: 72px 64px 52px 1fr; gap: 9px; padding: 2px 11px 9px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .ev { display: grid; grid-template-columns: 72px 64px 52px 1fr; align-items: center; gap: 9px; padding: 8px 11px; margin: 6px 0; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 12.5px; transition: opacity .35s, border-color .35s, box-shadow .35s, background .35s; }
  .ev.pending { opacity: .38; }
  .ev.applied { opacity: .68; }
  .ev.current { opacity: 1; border-color: var(--ink); box-shadow: 0 0 0 2px rgba(27,49,57,.14); }
  .ev .k { font-family: "DM Mono", monospace; color: var(--ink-2); font-size: 11.5px; }
  .ev .seq { font-family: "DM Mono", monospace; color: var(--muted); text-align: center; }
  .ev .dat { color: var(--ink); }
  .op { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 0; border-radius: 4px; text-align: center; }
  .op.ins { background: var(--keep-soft); color: var(--keep); border: 1px solid var(--keep-line); }
  .op.upd { background: var(--src-soft); color: var(--src); border: 1px solid var(--src-line); }
  .op.del { background: var(--target-soft); color: var(--target); border: 1px solid var(--target-line); }
  .late-tag { font-size: 8.5px; font-weight: 700; color: #9a5b00; background: #fff6e6; border: 1px solid #f2d399; border-radius: 99px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }

  table.cdc-out { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cdc-out th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 7px 9px; border-bottom: 1px solid var(--line); }
  .cdc-out td { padding: 8px 9px; border-bottom: 1px solid var(--line-2); font-family: "DM Mono", monospace; font-size: 12px; color: var(--ink); }
  .cdc-out tr.flash td { animation: flashrow .9s ease; }
  @keyframes flashrow { 0%{ background: rgba(34,114,180,0); } 35%{ background: rgba(34,114,180,.16); } 100%{ background: rgba(34,114,180,0); } }
  /* persistent highlight: rows changed by the latest snapshot stay lit until the next one */
  .cdc-out tr.snfresh td { background: var(--blue-bg); }
  .cdc-out tr.snfresh td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
  .cdc-out tr.closed td { color: var(--muted); }
  .cdc-out .seqcell { color: var(--ink-2); }
  .cdc-out .open { color: var(--keep); font-weight: 600; }
  .badge-cur { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--keep); background: var(--keep-soft); border: 1px solid var(--keep-line); border-radius: 99px; padding: 1px 6px; margin-left: 6px; }
  .cdc-empty { color: var(--muted); font-size: 13px; padding: 24px 10px; text-align: center; }
  .recon { display: none; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 13px 16px; border-radius: 8px; background: #fff8ec; border: 1px solid #f2d399; border-left: 4px solid #e8920a; }
  .recon.show { display: flex; }
  .recon .ic { color: #e8920a; font-size: 15px; }
  .recon p { margin: 0; font-size: 13.5px; color: #6b5320; line-height: 1.5; }
  .recon b { color: #5a4410; }
  /* informational diff banner (snapshot card) — consistent for every snapshot */
  .recon.diff { background: var(--blue-bg); border-color: var(--src-line); border-left-color: var(--blue); }
  .recon.diff .ic { color: var(--blue); }
  .recon.diff p { color: var(--ink-2); }
  .recon.diff b { color: var(--ink); }
  .op.same { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
  /* snapshot diff annotations (engine-derived, not columns in the data) */
  .cdc-out tr.newrow td { background: var(--keep-soft); }
  .cdc-out tr.newrow td:first-child { border-left: 3px solid var(--keep); }
  .cdc-out tr.chgrow td:first-child { border-left: 3px solid var(--src); }
  .cdc-out td.chgcell { background: var(--src-soft); color: var(--src); font-weight: 600; }
  .cdc-out tr.delrow td { color: var(--muted); }
  .cdc-out tr.delrow td:first-child { border-left: 3px solid var(--target-line); }
  .cdc-out tr.delrow td.cityx { text-decoration: line-through; }
  .gonetag { font-size: 9px; font-weight: 700; color: var(--target); background: var(--target-soft); border: 1px solid var(--target-line); border-radius: 99px; padding: 1px 6px; margin-left: 6px; text-decoration: none; display: inline-block; }
  .snlegend { font-size: 11.5px; color: var(--muted); margin: 10px 2px 0; line-height: 1.45; }
  .snlegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: middle; margin: 0 3px 0 8px; }
  .snlegend i.n { background: var(--keep-soft); border: 1px solid var(--keep); }
  .snlegend i.c { background: var(--src-soft); border: 1px solid var(--src); }
  .snlegend i.d { background: var(--target-soft); border: 1px solid var(--target-line); }

  /* bitemporal two-axis table */
  .cdc-out th.grp { text-align: center; font-size: 9px; letter-spacing: .05em; color: var(--ink-2); font-weight: 700; padding-bottom: 4px; }
  .cdc-out .bt-sep { border-left: 2px solid var(--line); }
  .cdc-out tr.superseded td { color: var(--muted); background: #fbfcfd; }
  .bt-cur { color: var(--keep); font-weight: 600; }
  .cdc-out tr.btfeed-pend td { color: #b6c0c6; }
  .cdc-out tr.btfeed-cur td { background: var(--blue-bg); }

  /* bitemporal as-of-knowledge grid */
  /* bitemporal "ask it a question" payoff */
  .btq { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .btq button { background: #fff; color: var(--ink); border: 1px solid var(--line); text-align: left; font-weight: 500; font-size: 13.5px; }
  .btq button b { font-weight: 700; }
  .btq button:hover { border-color: var(--src-line); background: var(--blue-bg); filter: none; }
  .btq button.active { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
  .bt-answer { font-size: 14.5px; color: var(--ink-2); line-height: 1.55; min-height: 22px; border-left: 3px solid var(--blue); padding: 2px 0 2px 14px; }
  .bt-answer b { color: var(--ink); }
  .cdc-out tr.bt-hit td { background: var(--blue-bg) !important; box-shadow: inset 0 2px 0 -1px var(--src-line), inset 0 -2px 0 -1px var(--src-line); }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .chip { font-size: 12.5px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .chip.warn { background: var(--target-soft); border-color: var(--target-line); color: var(--target); }
  .chip.ok { background: var(--keep-soft); border-color: var(--keep-line); color: var(--keep); }

  .vmeter { border: 1px solid var(--line); border-radius: 10px; padding: 15px 17px; margin-top: 18px; background: #fff; }
  .vmeter .vh { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }
  .vrow { display: grid; grid-template-columns: 130px 1fr 168px; align-items: center; gap: 12px; margin: 8px 0; }
  .vrow .vlabel { font-size: 13px; color: var(--ink-2); }
  .vtrack { height: 14px; background: var(--line-2); border-radius: 7px; overflow: hidden; }
  .vfill { height: 100%; border-radius: 7px; transition: width .25s; }
  .vfill.full { background: var(--target); width: 100%; }
  .vfill.rewind { background: var(--keep); }
  .vrow .vnum { font-size: 13px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .vrow .vnum b { color: var(--ink); }
  .vrow .vnum .vcost { color: var(--keep); font-weight: 700; }
  .vsave { margin-top: 10px; font-size: 14px; color: var(--keep); font-weight: 600; }
  .vnote { margin-top: 8px; font-size: 11.5px; color: var(--muted); font-style: italic; }

  /* ---- Enzyme (incremental MV refresh) ---- */
  .enz-stream { display: flex; flex-direction: column; gap: 6px; }
  .enz-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
             padding: 9px 12px; border: 1px solid var(--src-line); background: var(--src-soft);
             border-radius: 8px; transition: opacity .5s, transform .5s; }
  .enz-row.entering { opacity: 0; transform: translateY(-14px); }
  .enz-row.leaving { opacity: 0; transform: translateX(38px); }
  .enz-row .oid { font-family: "DM Mono", monospace; font-size: 12px; color: var(--src); }
  .enz-row .amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-family: "DM Mono", monospace; font-size: 12.5px; }
  .enz-tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
             padding: 2px 8px; border-radius: 99px; background: #fff; border: 1px solid var(--src-line); color: var(--src); justify-self: start; }
  .enz-empty { color: var(--muted); font-size: 13px; padding: 30px 10px; text-align: center; }

  table.enz-mv { width: 100%; border-collapse: collapse; font-size: 13px; }
  .enz-mv th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .enz-mv th.r, .enz-mv td.r { text-align: right; }
  .enz-mv td { padding: 10px; border-bottom: 1px solid var(--line-2); font-family: "DM Mono", monospace; font-size: 12.5px; color: var(--ink); transition: opacity .4s; }
  .enz-mv td.grp { font-family: "DM Sans", sans-serif; font-weight: 600; }
  .enz-mv td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .enz-mv tr.recompute td { animation: flashrow .9s ease; }
  .enz-mv tr.recompute td:first-child { border-left: 3px solid var(--blue); }
  .enz-mv tr.recompute td.num { color: var(--blue); font-weight: 600; }
  .enz-mv tr.skipped td { opacity: .4; }
  .enz-mv tr.new td { animation: enzflashgreen .9s ease; }
  .enz-mv tr.new td:first-child { border-left: 3px solid var(--keep); }
  .enz-mv tr.new td.num { color: var(--keep); font-weight: 600; }
  @keyframes enzflashgreen { 0%{ background: rgba(47,138,91,0); } 35%{ background: rgba(47,138,91,.18); } 100%{ background: rgba(47,138,91,0); } }
  .enz-st { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .enz-st.re { color: var(--blue); }
  .enz-st.sk { color: var(--muted); }
  .enz-st.nw { color: var(--keep); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
  .legend i.kept { background: #fff; }
  .legend i.bad { background: var(--target-soft); border-color: var(--target-line); }
  .legend i.good { background: var(--keep-soft); border-color: var(--keep-line); }

  /* ---- streaming table: checkpoint ---- */
  .ck-badges { display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 16px; }
  .ck-badge { display: inline-flex; align-items: baseline; gap: 7px; font-size: 12.5px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .ck-badge b { font-family: "DM Mono", monospace; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ck-badge.ok { background: var(--keep-soft); border-color: var(--keep-line); color: var(--keep); }
  .ck-badge.ok b { color: var(--keep); }
  .row.committed { opacity: .42; filter: saturate(.5); }
  .row.newev { background: var(--src-soft); border-color: var(--src-line); }
  .row.appended { animation: enzflashgreen .9s ease; }
  .ck-divider { display: flex; align-items: center; gap: 10px; margin: 12px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #b9760a; }
  .ck-divider::before, .ck-divider::after { content: ""; flex: 1; height: 0; border-top: 2px dashed #e8b06a; }

  /* ---- multi-source flow (append flow) ---- */
  .flow-multi { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: center; gap: 0; }
  .src-stack { display: flex; flex-direction: column; gap: 12px; }
  .src-mini { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .src-mini .mh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .src-mini .mh .nm { font-family: "DM Mono", monospace; font-size: 12.5px; font-weight: 500; }
  .src-mini.s-us   { --tint: var(--src);    --tint-soft: var(--src-soft);    --tint-line: var(--src-line); }
  .src-mini.s-eu   { --tint: var(--target); --tint-soft: var(--target-soft); --tint-line: var(--target-line); }
  .src-mini.s-back { --tint: var(--keep);   --tint-soft: var(--keep-soft);   --tint-line: var(--keep-line); }
  .src-mini .mh { background: var(--tint-soft); border-bottom-color: var(--tint-line); }
  .src-mini .mh .nm { color: var(--tint); }
  .src-mini .mbody { padding: 9px 12px; font-size: 12px; color: var(--ink-2); min-height: 40px; }
  .src-mini .qcap { display: flex; align-items: center; justify-content: space-between; font-family: "DM Mono", monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  .src-mini .qcap b { color: var(--tint); font-weight: 700; }
  .af-q { display: flex; flex-direction: column; gap: 4px; }
  .af-qrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: "DM Mono", monospace; font-size: 11px; background: var(--tint-soft); border: 1px solid var(--tint-line); border-radius: 6px; padding: 3px 8px; }
  .af-qrow .qid { color: var(--tint); font-weight: 600; }
  .af-qrow .qcity { color: var(--ink-2); }
  .af-empty { font-size: 11.5px; font-style: italic; color: var(--muted); padding: 2px 0; }
  .flow-pill { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--tint-line); color: var(--tint); background: #fff; white-space: nowrap; }
  .src-mini.spent .mh { filter: saturate(.35); }
  .src-mini.spent .mbody { opacity: .6; }
  .row.prov-us   { background: var(--src-soft);    border-color: var(--src-line); }
  .row.prov-eu   { background: var(--target-soft); border-color: var(--target-line); }
  .row.prov-back { background: var(--keep-soft);   border-color: var(--keep-line); }

  /* ---- quality gate (expectations / quarantine) ---- */
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
  .gate .g-ring { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all .35s; background: #fff; }
  .gate .g-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .gate.warn  .g-ring { border-color: #f2d399; color: #e8920a; background: #fff8ec; }
  .gate.drop  .g-ring { border-color: var(--target-line); color: var(--target); background: var(--target-soft); }
  .gate.fail  .g-ring { border-color: var(--target); color: var(--target); background: var(--target-soft); animation: pulse 1s ease-in-out infinite; }
  .row.bad { background: var(--target-soft); border-color: var(--target-line); }
  .row.dropping { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; transform: translateX(20px) scale(.9); }
  .row.warned { background: #fff8ec; border-color: #f2d399; }
  .badge-bad { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--target); background: #fff; border: 1px solid var(--target-line); border-radius: 99px; padding: 1px 6px; }
  .badge-warn { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #9a5b00; background: #fff; border: 1px solid #f2d399; border-radius: 99px; padding: 1px 6px; }
  .recon.fail { background: var(--target-soft); border-color: var(--target-line); border-left-color: var(--red); }
  .recon.fail .ic { color: var(--red); }
  .recon.fail p { color: #7a2c14; } .recon.fail b { color: var(--red); }

  /* ---- quarantine split ---- */
  .q-split { display: flex; flex-direction: column; gap: 12px; }
  .tbl.q-clean .tbl-head { background: var(--keep-soft); border-bottom-color: var(--keep-line); }
  .tbl.q-clean .name { color: var(--keep); }
  .tbl.q-quar .tbl-head { background: var(--target-soft); border-bottom-color: var(--target-line); }
  .tbl.q-quar .name { color: var(--target); }
  .fork { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); }

  /* ---- CI/CD & Bundles ---- */
  .cc-map { position: relative; width: 100%; margin-top: 2px; }
  .cc-map.fan  { height: 366px; }
  .cc-map.dev  { height: 288px; }
  .cc-map.prod { height: 340px; }
  .cc-scene[hidden] { display: none; }
  .cc-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .cc-edge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  .cc-edge.dim { stroke: var(--line-2); }
  .cc-edge.route { stroke: var(--src-line); stroke-width: 2.5; }
  .cc-edge.blocked { stroke: var(--target-line); stroke-dasharray: 5 6; }
  .cc-flow { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; }
  .cc-flow.prod { stroke: var(--target); }
  .cc-flow.good { stroke: var(--keep); }
  .cc-node { position: absolute; transform: translate(-50%, -50%); background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; box-shadow: 0 1px 2px rgba(14,27,33,.05); min-width: 116px;
    z-index: 4; transition: box-shadow .3s, border-color .3s, background .3s; }
  .cc-node .nt { font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; line-height: 1.2; }
  .cc-node .ns { font-family: "DM Mono", monospace; font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .cc-node .ico { font-size: 14px; }
  .cc-node.env { border-color: var(--src-line); }

<script>
/* ============================================================
   ANIMATION PRIMITIVES (GSAP + Flip)
   Cards sequence steps with async/await; every wait is tied to a
   real tween finishing (gsap tweens are thenable), never a blind
   setTimeout. Three shared moves:
     await anim(targets, vars)          — thenable gsap.to
     await flipStep(container, mutate)  — FLIP: rows glide to their
       new layout after any DOM mutation (insert/remove/reorder)
     await flyRow(fromEl, toEl)         — clone travels from one
       table to another (the source→target money shot)
   ============================================================ */
gsap.registerPlugin(Flip);
const PAGE_ZOOM = 1.1;   // body { zoom } — divide client-rect coords by this for fixed-position clones

const EASE = { out: "power3.out", in: "power2.in", inOut: "power2.inOut", pop: "back.out(1.6)" };

const anim = (targets, vars) => gsap.to(targets, { ease: EASE.out, ...vars });

/* FLIP a container through a DOM mutation: capture layout, mutate, animate old→new.
   Entering elements slide in (staggered); the mutate fn removes/appends/reorders freely. */
function flipStep(container, mutate, opts = {}) {
  const state = Flip.getState(container.children);
  mutate();
  return Flip.from(state, {
    duration: opts.duration ?? .55,
    ease: opts.ease ?? EASE.out,
    onEnter: els => gsap.fromTo(els,
      { opacity: 0, x: opts.enterX ?? -46, scale: .97 },
      { opacity: 1, x: 0, scale: 1, duration: .5, stagger: .07, ease: EASE.out }),
    ...opts.flip,
  });
}

/* Animated re-render for table outputs. Rows carry data-flip-id; across a
   full innerHTML swap, leaving rows slide out, surviving rows FLIP to their
   new slot (so mid-table inserts push neighbours smoothly), entering rows
   drop in. Safe under rapid stepping via a per-container sequence token. */
async function renderTableAnimated(container, html) {
  const my = (container._seq = (container._seq || 0) + 1);
  const cur = () => [...container.querySelectorAll("tr[data-flip-id]")];
  const probe = document.createElement("div"); probe.innerHTML = html;
  const newSigs = new Set([...probe.querySelectorAll("tr[data-flip-id]")].map(t => t.dataset.flipId));
  const leaving = cur().filter(tr => !newSigs.has(tr.dataset.flipId));
  if (leaving.length && cur().length > leaving.length) {
    await gsap.to(leaving, { opacity: 0, x: 34, duration: .35, ease: EASE.in });
    if (my !== container._seq) return;
  }
  const state = Flip.getState(cur());
  container.innerHTML = html;
  Flip.from(state, {
    targets: cur(), duration: .45, ease: EASE.out,
    onEnter: els => gsap.fromTo(els, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .45, ease: EASE.out }),
  });
}

/* Fly a visual clone of fromEl onto toEl (across containers). toEl is hidden
   during flight and revealed on landing. Returns when the flight lands.
   NOTE: delta math is done by hand, not Flip.fit — body{zoom} makes client
   rects visual-px while transforms are layout-px, which breaks Flip across
   containers. Rect deltas divided by PAGE_ZOOM stay correct. */
async function flyRow(fromEl, toEl, opts = {}) {
  // opts.cloneOf: "from" (default) clones the departing row; "to" clones the
  //   landing row and launches it from fromEl's position (e.g. out of a source card).
  // opts.hideTarget: false → land ON an existing row instead of replacing it
  //   (pair with opts.fadeClone so the clone dissolves into the row it hit).
  const cloneSrc = opts.cloneOf === "to" ? toEl : fromEl;
  const clone = cloneSrc.cloneNode(true);
  const a = fromEl.getBoundingClientRect();
  const b = toEl.getBoundingClientRect();
  const h = cloneSrc.getBoundingClientRect().height || b.height;
  const startTop = a.top + (a.height - h) / 2;   // centre the clone over fromEl
  clone.className = cloneSrc.className + " fly-clone";
  Object.assign(clone.style, {
    position: "fixed", margin: "0", zIndex: 100,
    left: (a.left / PAGE_ZOOM) + "px", top: (startTop / PAGE_ZOOM) + "px",
    width: (a.width / PAGE_ZOOM) + "px",
  });
  document.body.appendChild(clone);
  const hide = opts.hideTarget !== false;
  if (hide) gsap.set(toEl, { opacity: 0 });
  await gsap.to(clone, {
    x: (b.left - a.left) / PAGE_ZOOM,
    y: (b.top - startTop) / PAGE_ZOOM,
    width: b.width / PAGE_ZOOM,
    duration: opts.duration ?? .65, ease: EASE.inOut,
  });
  if (hide) gsap.set(toEl, { opacity: 1 });
  if (opts.fadeClone) await gsap.to(clone, { opacity: 0, duration: .22 });
  clone.remove();
}

function replaceWhereDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Flows <span class="sep">›</span> <b>REPLACE WHERE</b></div>
  <h1><span class="verb">REPLACE</span> WHERE</h1>
  <p class="oneliner">In a streaming table, refresh just a <em>slice</em> of the target: on each update, rows matching the predicate are deleted, the source query is recomputed for that same range, and the fresh results are inserted — atomically. Everything outside the predicate is left untouched.</p>

  <section>
    <h2>See what it does</h2>
    <div class="flow">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">source query</div>
          <div class="sub">orders_fct ⨝ product_dim · recomputed for matched range</div>
        </div>
        <div class="tbl-body gsap-rows" id="srcBody"></div>
      </div>
      <div class="arrow" id="arrow">
        <span class="flow-tag">flow</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">orders_enriched</div>
          <div class="sub" id="rwToday">Streaming table</div>
        </div>
        <div class="tbl-body gsap-rows" id="tgtBody"></div>
      </div>
    </div>

    <div class="controls">
      <button id="play">Run Refresh</button>
      <button id="reset" class="ghost">Reset</button>
      <span class="narr" id="narr">Predicate <code class="kw">date >= date_add(current_date(), -7)</code> covers the last 7 days. Run the refresh to restate only that slice.</span>
    </div>

  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders_enriched</span>
<span class="c-key">SCHEDULE EVERY</span> <span class="c-num">1</span> <span class="c-key">DAY</span>
<span class="hl"><span class="c-key">FLOW REPLACE WHERE</span> date >= date_add(current_date(), <span class="c-num">-7</span>) <span class="c-key">BY NAME</span></span>
<span class="c-key">SELECT</span>
  o.order_id, o.date, o.region, p.product_name, o.qty, o.price
<span class="c-key">FROM</span> <span class="c-tbl">orders_fct</span> o
<span class="c-key">JOIN</span> <span class="c-tbl">product_dim</span> p <span class="c-key">ON</span> o.product_id = p.product_id;</div>
    </div>
    <div class="note">
      <span class="ic">ⓘ</span>
      <p><b>BY NAME is required</b> — columns are matched by name, not position. And you don't add the predicate to the <code class="kw">SELECT</code>: the pipeline engine applies it automatically when reading the source.</p>
    </div>
  </section>

  <section>
    <h2>Why not a full refresh?</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>Full refresh</h3>
        <p>Recomputes the <b>entire</b> streaming table every run — re-reading and rewriting years of history to update the last few days. Slow, expensive, and wasteful when only recent data changes.</p>
      </div>
      <div class="box good">
        <h3>REPLACE WHERE</h3>
        <p>Recomputes <b>only the predicate range</b>. Older partitions are never touched, so a daily refresh costs the last 7 days of compute — not the whole table — in one atomic commit.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Source data is restated within a recent window (late events, corrections, slowly-finalizing facts).</li>
          <li>You want a cheap, scheduled refresh of just the "hot" range instead of a full rebuild.</li>
          <li>Backfilling or reprocessing a bounded slice idempotently.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>The deleted slice is fully replaced by the recomputed query — rows the source no longer returns disappear.</li>
          <li>Predicate must be a partition/range filter the engine can push down, or you over-rewrite.</li>
          <li>Requires <code class="kw">BY NAME</code>; runs as a flow on a streaming table, not arbitrary DML.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

  <p class="oneliner"><b>Rewind and Replay</b> recovers a streaming pipeline after a bad commit corrupts recent output. Instead of reprocessing all of history with a full refresh, you rewind the pipeline to a consistent point and replay <em>only</em> the affected data. Drag the rewind point below and watch what it costs — and what it fixes.</p>

  <section>
    <h2>Try it — pick a rewind point</h2>

    <div class="chips" id="rrChips"></div>

    <div class="stage">
      <div class="rr-grid" id="rrGrid">
        <div class="rr-band" id="rrBand"><span class="flag">T · rewind point</span></div>

        <div class="lane">
          <div class="lane-label">Rewind point</div>
          <div class="track rr-ruler" id="rrRuler">
            <div class="rail"></div><div class="fillpast" id="rrFill"></div>
            <div class="rr-handle" id="rrHandle"></div>
          </div>
        </div>
        <div class="lane">
          <div class="lane-label" id="rrDateLabel" style="font-size:11px;color:var(--muted);font-weight:600;">Date</div>
          <div class="track axis-track" id="rrAxis"></div>
        </div>
        <div class="lane">
          <div class="lane-label">Source events<span class="sub2">records / day · Delta · Kafka</span></div>
          <div class="track" id="rrSrc"></div>
        </div>
        <div class="lane">
          <div class="lane-label">Pipeline<span class="sub2">checkpoint state</span><span class="code-badge bad" id="rrCode">code: buggy</span></div>
          <div class="track pipe-track" id="rrPipe">
            <div class="ckpt-rail"></div>
            <div class="ckpt-ptr" id="rrCkpt"><div class="dot"></div><span>checkpoint</span></div>
          </div>
        </div>
        <div class="lane">
          <div class="lane-label">Target table<span class="sub2">orders_enriched · revenue</span></div>
          <div class="track" id="rrTgt"></div>
        </div>
      </div>

      <div class="legend">
        <span><i class="kept"></i> untouched (before T)</span>
        <span><i class="bad"></i> corrupted by bad commit</span>
        <span><i class="good"></i> replayed &amp; corrected</span>
      </div>

      <div class="insight">
        <span class="ic">◔</span>
        <p id="rrInsight"></p>
      </div>
    </div>

    <div class="steps">
      <div class="step" id="rrStep1"><div class="t"><span class="num">①</span>Roll back checkpoint</div><div class="d">Source offsets + operator state reset to T.</div></div>
      <div class="step" id="rrStep2"><div class="t"><span class="num">②</span>Erase target after T</div><div class="d">Delta version restored; rewound rows removed.</div></div>
      <div class="step" id="rrStep3"><div class="t"><span class="num">③</span>Replay from T</div><div class="d">Re-ingest affected data through fixed code.</div></div>
    </div>

    <div class="controls">

  <section>
    <h2>What makes this hard to do by hand</h2>

    </div>

    <span class="c-jkey">"datasets"</span>: [{ <span class="c-jkey">"identifier"</span>: <span class="c-str">"main.sales.orders_enriched"</span> }]
  }
}'</div>
    </div>
    <div class="note">
      <span class="ic">ⓘ</span>
      <p>The timestamp is an <b>upper bound</b> — the engine snaps to the closest valid rewind point at or before it. Omit <code class="kw">datasets</code> to rewind the whole pipeline; naming one also cascades to all downstream datasets.</p>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>A bad commit, schema change, or bad input corrupted recent output and you want a targeted recovery.</li>
          <li>You need offsets, Delta versions, and state restored <em>consistently</em> — not a partial, manual fix.</li>
          <li>Reprocessing the full history would be prohibitively expensive.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li><b>Triggered pipelines only</b> — no continuous/real-time, no raw Structured Streaming.</li>
          <li>Sources: <b>Delta &amp; Kafka</b> only (no Auto Loader). Sinks: STs &amp; MVs.</li>
          <li><b>No stateful operators</b>; many stateful code changes break replay.</li>
          <li>Bounded by retention (default <b>7 days</b> / ~100 batches); <b>can't rewind past a FULL REFRESH</b>.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- AUTO CDC ---------- */
function autoCdcDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Flows <span class="sep">›</span> <b>AUTO CDC</b></div>
  <h1><span class="verb">AUTO</span> CDC</h1>
  <p class="oneliner"><b>AUTO CDC</b> (formerly <code class="kw">APPLY CHANGES</code>) turns a raw change feed — inserts, updates, deletes — into a clean, correct target table. You declare the key and a <code class="kw">SEQUENCE BY</code> column; AUTO CDC applies changes <em>in sequence order regardless of arrival order</em>, and maintains either current state (SCD 1) or full history (SCD 2). Watch how it reconciles a late event that arrives after a delete.</p>

  <section>
    <h2>Try it — stream a change feed</h2>

    <div class="cdc-toggle" id="cdcToggle">
      <button data-mode="scd1">SCD Type 1</button>
      <button data-mode="scd2">SCD Type 2</button>
    </div>
    <div class="cdc-mode-desc" id="cdcDesc"></div>

    <div class="cdc-wrap">
      <div class="tbl">
        <div class="tbl-head"><div class="name">Change feed</div><div class="sub">arrival order · key 101 (Ava), 102 (Ben)</div></div>
        <div class="tbl-body" id="cdcFeed" style="min-height:260px;"></div>
      </div>
      <div class="tbl">
        <div class="tbl-head"><div class="name" id="cdcOutName">Target — orders</div><div class="sub" id="cdcOutSub">applied by AUTO CDC</div></div>
        <div class="tbl-body" id="cdcOut" style="min-height:260px;"></div>
      </div>
    </div>

    <div class="recon" id="cdcRecon"><span class="ic">↺</span><p id="cdcReconText"></p></div>

    <div class="controls">
      <button id="cdcPrev" class="ghost">◀ Previous</button>
      <button id="cdcRun">▶ Send next change</button>
      <button id="cdcReset" class="ghost">Reset</button>
      <span class="narr" id="cdcNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders</span>;

<span class="c-key">CREATE FLOW</span> orders_cdc <span class="c-key">AS AUTO CDC INTO</span> <span class="c-tbl">orders</span>
<span class="c-key">FROM STREAM</span>(<span class="c-tbl">orders_changes</span>)
<span class="c-key">KEYS</span> (customer_id)
<span class="c-key">APPLY AS DELETE WHEN</span> op = <span class="c-str">'DELETE'</span>
<span class="c-key">SEQUENCE BY</span> event_ts           <span class="c-dim">-- event timestamp; out-of-order safe</span>
<span class="c-key">STORED AS</span> <span class="c-num">SCD TYPE 2</span>;          <span class="c-dim">-- or SCD TYPE 1</span></div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p><code class="kw">SEQUENCE BY</code> is what makes AUTO CDC out-of-order safe: changes are applied in sequence order, not arrival order. A late event with a lower sequence than what's already applied is treated as stale.</p></div>
  </section>

  <section>
    <h2>SCD 1 vs SCD 2</h2>
    <div class="grid2">
      <div class="box">
        <h3>SCD Type 1 — current state</h3>
        <p>One row per key, always the latest. Updates overwrite in place; a delete removes the row. Smallest, simplest — but no history.</p>
      </div>
      <div class="box">
        <h3>SCD Type 2 — full history</h3>
        <p>Every version is retained with <code class="kw">__START_AT</code> / <code class="kw">__END_AT</code>. The open row (no end) is current; a delete closes the current row. Answers "what did this look like on date X?"</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Ingesting a CDC stream (Debezium, Fivetran, DB change feeds) into a clean table.</li>
          <li>Source events can arrive out of order or late — let <code class="kw">SEQUENCE BY</code> reconcile.</li>
          <li>You need either current state (SCD 1) or auditable history (SCD 2) without hand-written MERGE logic.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>The target is owned by the flow — don't write to it manually.</li>
          <li>Pick the <code class="kw">SEQUENCE BY</code> column carefully; ties and nulls are reconciliation hazards.</li>
          <li>SCD 2 history grows over time — plan retention.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

function autoCdcSnapshotDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Flows <span class="sep">›</span> <b>AUTO CDC FROM SNAPSHOT</b></div>
  <h1><span class="verb">AUTO</span> CDC FROM SNAPSHOT</h1>
  <p class="oneliner">Some sources can't emit a change feed — they only hand you a <b>full snapshot</b> of the table each time. AUTO CDC FROM SNAPSHOT takes successive complete snapshots, <b>diffs each against the previous one</b> to derive inserts, updates, and deletes, and maintains SCD Type 2 history. Deletes are inferred from rows that simply <em>disappear</em>. Step through the snapshots and watch the history build.</p>

  <section>
    <h2>Try it — receive full snapshots</h2>

    <div class="cdc-wrap">
      <div class="tbl">
        <div class="tbl-head"><div class="name">Incoming snapshot</div><div class="sub" id="snHead">—</div></div>
        <div class="tbl-body" id="snLeft" style="min-height:248px;"></div>
      </div>
      <div class="tbl">
        <div class="tbl-head"><div class="name">Target — customers (SCD 2)</div><div class="sub">full history · __START_AT / __END_AT</div></div>
        <div class="tbl-body" id="snRight" style="min-height:248px;"></div>
      </div>
    </div>

    <div class="recon diff" id="snRecon"><span class="ic">≢</span><p id="snReconText"></p></div>

    <div class="controls">
      <button id="snPrev" class="ghost">◀ Previous</button>
      <button id="snRun">▶ Receive next snapshot</button>
      <button id="snReset" class="ghost">Reset</button>
      <span class="narr" id="snNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">Python</div>
<div class="sql"><span class="c-key">import</span> dlt

dlt.create_streaming_table(<span class="c-str">"customers"</span>)

dlt.create_auto_cdc_from_snapshot_flow(
    target=<span class="c-str">"customers"</span>,
    source=<span class="c-str">"customers_snapshots"</span>,   <span class="c-dim"># full snapshots (table or snapshot fn)</span>
    keys=[<span class="c-str">"customer_id"</span>],
    stored_as_scd_type=<span class="c-num">2</span>,            <span class="c-dim"># deletes inferred from absent rows</span>
)</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>Unlike <code class="kw">AUTO CDC</code> (which consumes a change feed via <code class="kw">FROM STREAM</code>), the snapshot variant takes the <b>whole table</b> each time and computes the diff for you — ideal when the source has no change log, only periodic full extracts.</p></div>
  </section>

  <section>
    <h2>How it works</h2>
    <div class="insight">
      <span class="ic">◔</span>
      <p>No change events here — each input is a <b>complete snapshot</b> of the table. The engine compares snapshot N to N−1: a new key is an <b>insert</b>, a changed value is an <b>update</b> (close the old version, open a new one), and a key that <b>vanished</b> is a <b>delete</b> (close the current version).</p>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>The source can only provide full table dumps / periodic extracts (no change log).</li>
          <li>You still need full SCD 2 history and correct delete handling.</li>
          <li>Snapshots arrive on a schedule and you want the diff computed automatically.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Deletes are inferred from <em>absence</em> — a partial or filtered snapshot looks like mass deletes.</li>
          <li>Each snapshot must be the <b>complete</b> table for the keys in scope.</li>
          <li>SCD 2 history grows over time — plan retention.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}
