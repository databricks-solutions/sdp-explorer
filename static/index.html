  const narr   = document.getElementById("cdcNarr");

  // seq_num → event timestamp (display). seq drives ordering; ts is what's shown.
  const TS = { 1:"09:00", 2:"09:05", 3:"09:10", 4:"09:15" };
  const tsOf = s => TS[s];

  let mode = "scd1";
  let applied = 0;       // number of feed events applied
  let prevSig = new Set();

  const opCls = o => o === "INSERT" ? "ins" : o === "UPDATE" ? "upd" : "del";

  const FEED_HEAD = `<div class="ev-head"><span>customer_id</span><span>op</span><span>event_ts</span><span>city</span></div>`;

  function renderFeed(curIdx) {
    feedEl.innerHTML = FEED_HEAD + EV.map((e,i) => {
      const cls = i === curIdx ? "current" : i < applied ? "applied" : "pending";
      const data = e.op === "DELETE" ? "—" : e.city;
      const late = e.late ? `<span class="late-tag">late · out of order</span>` : "";
      return `<div class="ev ${cls}">
        <span class="k">${e.key} ${e.name}</span>
        <span class="op ${opCls(e.op)}">${e.op}</span>
        <span class="seq">${tsOf(e.seq)}</span>
        <span class="dat">${data}${late}</span>
      </div>`;
    }).join("");
  }

  // current applied events
  const slice = () => EV.slice(0, applied);

  function computeSCD1(evs) {
    const byKey = {};
    evs.forEach(e => { if (!byKey[e.key] || e.seq > byKey[e.key].seq) byKey[e.key] = e; });
    return Object.values(byKey)
      .filter(e => e.op !== "DELETE")
      .sort((a,b) => a.key - b.key)
      .map(e => ({ sig: `${e.key}|${e.city}`, cells: [e.key, e.name, e.city] }));
  }

  function computeSCD2(evs) {
    const keys = [...new Set(evs.map(e => e.key))].sort((a,b)=>a-b);
    const rows = [];
    keys.forEach(key => {
      const es = evs.filter(e => e.key === key).sort((a,b) => a.seq - b.seq);
      const vers = [];
      es.forEach(e => {
        if (e.op === "DELETE") { if (vers.length && vers[vers.length-1].end == null) vers[vers.length-1].end = e.seq; }
        else { if (vers.length && vers[vers.length-1].end == null) vers[vers.length-1].end = e.seq; vers.push({ name:e.name, city:e.city, start:e.seq, end:null }); }
      });
      vers.forEach(v => rows.push({
        sig: `${key}|${v.city}|${v.start}|${v.end}`,
        open: v.end == null,
        cells: [key, v.name, v.city, tsOf(v.start), v.end == null ? "—" : tsOf(v.end)],
      }));
    });
    return rows;
  }

  function renderOut(flash) {
    const rows = mode === "scd1" ? computeSCD1(slice()) : computeSCD2(slice());
    outName.textContent = mode === "scd1" ? "Target — orders (SCD 1)" : "Target — orders (SCD 2)";
    outSub.textContent  = mode === "scd1" ? "current state · one row per key" : "full history · __START_AT / __END_AT";
    const head = mode === "scd1"
      ? `<tr><th>customer_id</th><th>name</th><th>city</th></tr>`
      : `<tr><th>customer_id</th><th>name</th><th>city</th><th>__START_AT</th><th>__END_AT</th></tr>`;
    if (!rows.length) {
      const ncol = mode === "scd1" ? 3 : 5;
      outEl.innerHTML = `<table class="cdc-out"><thead>${head}</thead><tbody><tr><td colspan="${ncol}" class="cdc-empty">No rows yet — send a change.</td></tr></tbody></table>`;
      prevSig = new Set(); return;
    }
    const body = rows.map(r => {
      const isNew = flash && !prevSig.has(r.sig);
      const cls = [ r.open === false && mode==="scd2" ? "closed" : "", isNew ? "flash" : "" ].filter(Boolean).join(" ");
      const tds = r.cells.map((c,ci) => {
        if (mode === "scd2" && ci === 4) {
          return c === "—" ? `<td class="open">current <span class="badge-cur">open</span></td>` : `<td class="seqcell">${c}</td>`;
        }
        if (mode === "scd2" && ci === 3) return `<td class="seqcell">${c}</td>`;
        return `<td>${c}</td>`;
      }).join("");
      return `<tr class="${cls}" data-flip-id="${mode}:${r.sig}">${tds}</tr>`;
    }).join("");
    const html = `<table class="cdc-out"><thead>${head}</thead><tbody>${body}</tbody></table>`;
    if (flash) renderTableAnimated(outEl, html);
    else outEl.innerHTML = html;
    prevSig = new Set(rows.map(r => r.sig));
  }

  function reconText(m) {
    return m === "scd1"
      ? "<b>Late event reconciled.</b> Ava's UPDATE→Vancouver carries timestamp <b>09:10</b>, but a DELETE at <b>09:15</b> is already applied. AUTO CDC orders by <code class='kw'>SEQUENCE BY</code> — 09:10 is older than 09:15, so it's stale and ignored. The row <b>stays deleted</b>; no resurrection."
      : "<b>Late event reconciled.</b> Ava's UPDATE→Vancouver (<b>09:10</b>) arrived after the DELETE (09:15). AUTO CDC slots it into history by timestamp: <b>Vancouver becomes the 09:10 → 09:15 version</b>, and Calgary's <code class='kw'>__END_AT</code> is corrected from 09:15 to 09:10.";
  }

  function updateBtn() {
    const done = applied >= EV.length;
    runBtn.disabled = done;
    runBtn.textContent = done ? `All ${EV.length} changes applied` : `▶ Send next change  (${applied} / ${EV.length})`;
    prevBtn.disabled = applied <= 0;
  }

  function describe(i) {
    const e = EV[i];
    if (e.late) return "A <b>late, out-of-order</b> event arrives — AUTO CDC reconciles it by timestamp, not arrival.";
    const verb = e.op === "INSERT" ? "inserted" : e.op === "UPDATE" ? "updated" : "deleted";
    return `${e.key} ${e.name} ${verb}${e.op==="DELETE"?"":" → "+e.city} <span style="color:var(--muted)">(${tsOf(e.seq)})</span>`;
  }

  function setMode(m) {
    mode = m;
    [...toggle.children].forEach(b => b.classList.toggle("active", b.dataset.mode === m));
    descEl.innerHTML = DESC[m];
    renderOut(false);
    if (applied >= EV.length) reconT.innerHTML = reconText(m);  // keep callout in sync with mode
  }

  function reset() {
    applied = 0; prevSig = new Set();
    recon.classList.remove("show");
    narr.innerHTML = "";
    renderFeed(-1); renderOut(false); updateBtn();
  }

  function step() {
    if (applied >= EV.length) return;
    const i = applied;
    applied = i + 1;
    renderFeed(i);
    const curEv = feedEl.children[i + 1];   // +1 skips the feed header
    if (curEv) gsap.from(curEv, { scale: .97, x: -8, duration: .35, ease: EASE.out });
    renderOut(true);
    recon.classList.toggle("show", applied >= EV.length);
    if (EV[i].late) reconT.innerHTML = reconText(mode);
    narr.innerHTML = describe(i);
    updateBtn();
  }

  function prev() {
    if (applied <= 0) return;
    applied -= 1;
    const cur = applied - 1;
    renderFeed(cur);
    renderOut(true);
    recon.classList.toggle("show", applied >= EV.length);
    narr.innerHTML = cur >= 0 ? describe(cur) : "";
    updateBtn();
  }

  toggle.addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]");
    if (b) setMode(b.dataset.mode);
  });
  runBtn.addEventListener("click", step);
  prevBtn.addEventListener("click", prev);
  resetBtn.addEventListener("click", reset);

  setMode("scd1");
  reset();
}

/* ---------- AUTO CDC FROM SNAPSHOT wiring ---------- */
function wireAutoCdcSnapshot() {
  const TIMES = ["2024-06-01", "2024-06-02", "2024-06-03", "2024-06-04"];
  // each snapshot is a COMPLETE table state
  const SNAPS = [
    { rows: [ {key:101,name:"Ava",city:"Toronto"}, {key:102,name:"Ben",city:"Ottawa"} ] },
    { rows: [ {key:101,name:"Ava",city:"Calgary"}, {key:102,name:"Ben",city:"Ottawa"}, {key:103,name:"Cara",city:"Halifax"} ] },
    { rows: [ {key:101,name:"Ava",city:"Calgary"}, {key:103,name:"Cara",city:"Halifax"} ] },
    { rows: [ {key:101,name:"Ava",city:"Vancouver"}, {key:103,name:"Cara",city:"Halifax"} ] },
  ];
  const RHEAD = `<tr><th>customer_id</th><th>name</th><th>city</th><th>__START_AT</th><th>__END_AT</th></tr>`;

  const snHead  = document.getElementById("snHead");
  const snLeft  = document.getElementById("snLeft");
  const snRight = document.getElementById("snRight");
  const recon   = document.getElementById("snRecon");
  const reconT  = document.getElementById("snReconText");
  const runBtn  = document.getElementById("snRun");
  const prevBtn = document.getElementById("snPrev");
  const resetBtn= document.getElementById("snReset");
  const narr    = document.getElementById("snNarr");

  let applied = 0;          // snapshots received
  let prevSig = new Set();

  // diff snapshot idx against idx-1 → tag each row new|changed|same, plus deleted ghosts
  function diffRows(idx) {
    const cur = SNAPS[idx].rows;
    const prev = idx > 0 ? SNAPS[idx-1].rows : null;
    const pm = {}; if (prev) prev.forEach(r => pm[r.key] = r);
    const out = cur.map(r => {
      let tag;
      if (!prev) tag = "base";
      else if (!(r.key in pm)) tag = "new";
      else if (pm[r.key].city !== r.city) tag = "changed";
      else tag = "same";
      return { ...r, tag };
    });
    if (prev) prev.forEach(r => { if (!cur.find(x => x.key === r.key)) out.push({ ...r, tag: "deleted" }); });
    out.sort((a,b) => a.key - b.key);
    return out;
  }

  // build SCD2 history from the first `n` snapshots by diffing consecutively
  function buildSCD2(n) {
    const state = {}; // key -> { name, versions:[{city,start,end}], openIdx }
    for (let si = 0; si < n; si++) {
      const t = TIMES[si];
      const present = new Set();
      SNAPS[si].rows.forEach(r => {
        present.add(r.key);
        const s = state[r.key] || (state[r.key] = { name:r.name, versions:[], openIdx:-1 });
        if (s.openIdx === -1) { s.versions.push({ city:r.city, start:t, end:null }); s.openIdx = s.versions.length-1; }
        else {
          const ov = s.versions[s.openIdx];
          if (ov.city !== r.city) { ov.end = t; s.versions.push({ city:r.city, start:t, end:null }); s.openIdx = s.versions.length-1; }
        }
      });
      Object.keys(state).forEach(k => {
        const s = state[k];
        if (s.openIdx !== -1 && !present.has(+k)) { s.versions[s.openIdx].end = t; s.openIdx = -1; }
      });
    }
    const rows = [];
    Object.keys(state).map(Number).sort((a,b)=>a-b).forEach(k => {
      const s = state[k];
      s.versions.forEach(v => rows.push({
        key:k, name:s.name, city:v.city, start:v.start, end:v.end, open:v.end==null,
        sig:`${k}|${v.city}|${v.start}|${v.end}`,
      }));
    });
    return rows;
  }

  function renderLeft(idx) {
    if (idx < 0) { snHead.textContent = "—"; snLeft.innerHTML = `<div class="cdc-empty">No snapshot yet — receive the first one.</div>`; return; }
    snHead.textContent = `Snapshot ${idx+1} of ${SNAPS.length} · ${TIMES[idx]} · complete table`;
    // plain full snapshot — just the table as received (a deleted key is simply absent)
    const body = SNAPS[idx].rows.slice().sort((a,b) => a.key - b.key)
      .map(r => `<tr><td>${r.key}</td><td>${r.name}</td><td>${r.city}</td></tr>`).join("");
    snLeft.innerHTML = `<table class="cdc-out"><thead><tr><th>customer_id</th><th>name</th><th>city</th></tr></thead><tbody>${body}</tbody></table>`;
    gsap.from(snLeft.querySelectorAll("tbody tr"), { opacity: 0, duration: .35, stagger: .05, ease: EASE.out });
  }

  function renderRight(flash) {
    const rows = buildSCD2(applied);
    if (!rows.length) { snRight.innerHTML = `<table class="cdc-out"><thead>${RHEAD}</thead><tbody><tr><td colspan="5" class="cdc-empty">No rows yet — receive a snapshot.</td></tr></tbody></table>`; prevSig = new Set(); return; }
    const body = rows.map(r => {
      const isNew = flash && !prevSig.has(r.sig);
      const cls = [ !r.open ? "closed" : "", isNew ? "flash snfresh" : "" ].filter(Boolean).join(" ");
      const endCell = r.open ? `<td class="open">current <span class="badge-cur">open</span></td>` : `<td class="seqcell">${r.end}</td>`;
      return `<tr class="${cls}" data-flip-id="${r.sig}"><td>${r.key}</td><td>${r.name}</td><td>${r.city}</td><td class="seqcell">${r.start}</td>${endCell}</tr>`;
    }).join("");
    const html = `<table class="cdc-out"><thead>${RHEAD}</thead><tbody>${body}</tbody></table>`;
    if (flash) renderTableAnimated(snRight, html);
    else snRight.innerHTML = html;
    prevSig = new Set(rows.map(r => r.sig));
  }

  // every snapshot's derived diff, in one consistent banner
  function showDiff(idx) {
    if (idx < 0) { recon.classList.remove("show"); return; }
    recon.classList.add("show");
    if (idx === 0) {
      reconT.innerHTML = `<b>Snapshot 1 — initial load.</b> ${SNAPS[0].rows.length} rows inserted as new SCD 2 records (start ${TIMES[0]}).`;
      return;
    }
    const d = diffRows(idx);
    const upd = d.filter(r => r.tag === "changed").map(r => r.name);
    const ins = d.filter(r => r.tag === "new").map(r => r.name);
    const del = d.filter(r => r.tag === "deleted");
    const parts = [];
    if (upd.length) parts.push(`<b>${upd.length} update</b> (${upd.join(", ")})`);
    if (ins.length) parts.push(`<b>${ins.length} insert</b> (${ins.join(", ")})`);
    if (del.length) parts.push(`<b>${del.length} delete</b> (${del.map(r => r.name).join(", ")})`);
    let txt = `<b>Snapshot ${idx+1} vs previous:</b> ${parts.join(" · ") || "no changes"}.`;
    if (del.length) {
      const names = del.map(r => `${r.key} ${r.name}`).join(", ");
      txt += ` ${names} ${del.length > 1 ? "are" : "is"} <b>absent</b>, so AUTO CDC infers a delete and closes the current version at ${TIMES[idx]} — no delete event needed.`;
    }
    reconT.innerHTML = txt;
  }

  function updateBtn() {
    const done = applied >= SNAPS.length;
    runBtn.disabled = done;
    runBtn.textContent = done ? `All ${SNAPS.length} snapshots received` : `▶ Receive next snapshot  (${applied} / ${SNAPS.length})`;
    prevBtn.disabled = applied <= 0;
  }

  function reset() {
    applied = 0; prevSig = new Set();
    recon.classList.remove("show");
    narr.innerHTML = "";
    renderLeft(-1); renderRight(false); updateBtn();
  }

  function step() {
    if (applied >= SNAPS.length) return;
    const idx = applied;
    applied = idx + 1;
    renderLeft(idx);
    renderRight(true);
    showDiff(idx);
    updateBtn();
  }

  function prev() {
    if (applied <= 0) return;
    applied -= 1;
    const idx = applied - 1;
    renderLeft(idx);
    renderRight(true);
    showDiff(idx);
    updateBtn();
  }

  runBtn.addEventListener("click", step);
  prevBtn.addEventListener("click", prev);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- AUTO CDC bitemporal wiring (replicates docs example exactly) ---------- */
function wireAutoCdcBitemporal() {
  // change feed: [data, business_time, system_time, op]  — all on 2025-07-18
  const FEED = [
    { data:"XFv1", biz:"10:01:00", sys:"10:05:00", op:"INSERT" },
    { data:"XFv2", biz:"12:15:43", sys:"12:20:00", op:"UPDATE" },
    { data:"XFv3", biz:"12:05:00", sys:"12:25:00", op:"UPDATE" }, // out-of-order: earlier biz, later sys
    { data:"XFv2", biz:"12:30:00", sys:"12:30:00", op:"DELETE" },
  ];
  // target state after each step — rows: [data, __START_AT, __END_AT, __SYSTEM_START_AT, __SYSTEM_END_AT] (null = NULL)
  const STATES = [
    [ ["XFv1","10:01:00",null,"10:05:00",null] ],
    [ ["XFv1","10:01:00",null,"10:05:00","12:20:00"],
      ["XFv1","10:01:00","12:15:43","12:20:00",null],
      ["XFv2","12:15:43",null,"12:20:00",null] ],
    [ ["XFv1","10:01:00",null,"10:05:00","12:20:00"],
      ["XFv1","10:01:00","12:15:43","12:20:00","12:25:00"],
      ["XFv1","10:01:00","12:05:00","12:25:00",null],
      ["XFv3","12:05:00","12:15:43","12:25:00",null],
      ["XFv2","12:15:43",null,"12:20:00",null] ],
    [ ["XFv1","10:01:00",null,"10:05:00","12:20:00"],
      ["XFv1","10:01:00","12:15:43","12:20:00","12:25:00"],
      ["XFv1","10:01:00","12:05:00","12:25:00",null],
      ["XFv3","12:05:00","12:15:43","12:25:00",null],
      ["XFv2","12:15:43",null,"12:20:00","12:30:00"],
      ["XFv2","12:15:43","12:30:00","12:30:00",null] ],
  ];
  const BANNERS = [
    `<b>INSERT.</b> XFv1 is valid from business time <b>10:01:00</b> with no known end, and the system learned of it at <b>10:05:00</b>. One row opens on both timelines.`,
    `<b>UPDATE (in order).</b> XFv2 takes over at business time <b>12:15:43</b>. The engine closes the old belief on the system axis (XFv1's open row gets <code class='kw'>__SYSTEM_END_AT</code> 12:20:00) and writes the corrected business history as known from 12:20:00 — XFv1 now ends 12:15:43, XFv2 opens.`,
    `<b>OUT-OF-ORDER UPDATE.</b> XFv3's business time (<b>12:05:00</b>) is earlier than XFv2's, but it arrived later (system <b>12:25:00</b>). Instead of appending, the engine corrects history in place — XFv1 now ends 12:05:00, XFv3 spans 12:05:00 → 12:15:43 — and closes the superseded belief at system 12:25:00.`,
    `<b>DELETE.</b> XFv2's business existence ends at <b>12:30:00</b>. No replacement row is created; XFv2 is kept in two rows — preserving both when it ceased to exist (business) and when the system learned of it (system 12:30:00).`,
  ];

  const THEAD = `<thead>
    <tr><th rowspan="2">company_id</th><th rowspan="2">data_point</th>
        <th colspan="2" class="grp bt-sep">business validity</th>
        <th colspan="2" class="grp bt-sep">system awareness</th></tr>
    <tr><th class="bt-sep">__START_AT</th><th>__END_AT</th>
        <th class="bt-sep">__SYSTEM_START_AT</th><th>__SYSTEM_END_AT</th></tr>
  </thead>`;

  const feedEl = document.getElementById("btFeed");
  const tblEl  = document.getElementById("btTable");
  const banner = document.getElementById("btBanner");
  const bannerT= document.getElementById("btBannerText");
  const runBtn = document.getElementById("btRun");
  const prevBtn= document.getElementById("btPrev");
  const resetBtn = document.getElementById("btReset");

  let applied = 0;        // changes applied (0..4)
  let prevSig = new Set();

  function renderFeed(cur) {
    const body = FEED.map((e,i) => {
      const opc = e.op === "INSERT" ? "ins" : e.op === "UPDATE" ? "upd" : "del";
      const rc = i === cur ? "btfeed-cur" : i < applied ? "" : "btfeed-pend";
      const late = e.op === "UPDATE" && i === 2 ? `<span class="late-tag">out of order</span>` : "";
      return `<tr class="${rc}"><td>A</td><td>${e.data}</td><td class="seqcell">${e.biz}</td><td class="seqcell">${e.sys}</td><td><span class="op ${opc}">${e.op}</span>${late}</td></tr>`;
    }).join("");
    feedEl.innerHTML = `<table class="cdc-out"><thead><tr><th>company_id</th><th>data_point</th><th>business_time</th><th>system_time</th><th>op</th></tr></thead><tbody>${body}</tbody></table>`;
  }

  function renderTable(stateIdx, flash) {
    if (stateIdx < 0) { tblEl.innerHTML = `<table class="cdc-out">${THEAD}<tbody><tr><td colspan="6" class="cdc-empty">No rows yet — apply the first change.</td></tr></tbody></table>`; prevSig = new Set(); return; }
    const state = STATES[stateIdx];
    const cell = v => v === null ? "—" : v;
    const body = state.map(r => {
      const [data,bS,bE,sS,sE] = r;
      const sig = r.join("|");
      const superseded = sE !== null;             // system-closed = a past belief
      const isNew = flash && !prevSig.has(sig);
      const cls = [ superseded ? "superseded" : "", isNew ? "flash" : "" ].filter(Boolean).join(" ");
      const sEnd = sE === null ? `<span class="bt-cur">current</span>` : cell(sE);
      return `<tr class="${cls}" data-flip-id="${sig}"><td>A</td><td>${data}</td>
        <td class="bt-sep seqcell">${cell(bS)}</td><td class="seqcell">${cell(bE)}</td>
        <td class="bt-sep seqcell">${cell(sS)}</td><td class="seqcell">${sEnd}</td></tr>`;
    }).join("");
    const html = `<table class="cdc-out">${THEAD}<tbody>${body}</tbody></table>`;
    if (flash) renderTableAnimated(tblEl, html);
    else tblEl.innerHTML = html;
    prevSig = new Set(state.map(r => r.join("|")));
  }

  function showBanner(idx) {
    if (idx < 0) { banner.classList.remove("show"); return; }
    banner.classList.add("show");
    bannerT.innerHTML = BANNERS[idx];
  }

  function updateBtn() {
    const done = applied >= FEED.length;
    runBtn.disabled = done;
    runBtn.textContent = done ? `All ${FEED.length} changes applied` : `▶ Apply next change  (${applied} / ${FEED.length})`;
    prevBtn.disabled = applied <= 0;
  }

  const qWrap = document.getElementById("btQs");
  const qOut  = document.getElementById("btAnswer");
  const Q_DEFAULT = `The first two are the <em>same real-world moment</em> — watch the answer change.`;

  function clearQuestions() {
    [...qWrap.children].forEach(b => b.classList.remove("active"));
    qOut.innerHTML = Q_DEFAULT;
  }

  function reset() {
    applied = 0; prevSig = new Set();
    renderFeed(-1); renderTable(-1, false); showBanner(-1); updateBtn();
    clearQuestions();
  }
  function step() {
    if (applied >= FEED.length) return;
    const idx = applied; applied = idx + 1;
    renderFeed(idx); renderTable(idx, true); showBanner(idx); updateBtn();
    clearQuestions();
  }
  function prev() {
    if (applied <= 0) return;
    applied -= 1; const idx = applied - 1;
    renderFeed(idx); renderTable(idx, true); showBanner(idx); updateBtn();
    clearQuestions();
  }

  // The payoff — curated as-of questions; each highlights the row in the
  // final table that answers it (row indices follow STATES[3] order).
  const QS = [
    { row: 3, a: `<b>XFv3.</b> Reading only the <b>current beliefs</b> (rows still open on the system axis), the version valid at business 12:10 is <b>XFv3</b> — the out-of-order correction rewrote that slice of history.` },
    { row: 1, a: `<b>XFv1.</b> At system time 12:22 the correction hadn't arrived yet (it landed at 12:25). The row that was open <em>then</em> says XFv1 covered 10:01 → 12:15:43. Same business moment as the first question, <b>different answer</b> — that's the audit trail.` },
    { row: 5, a: `<b>No — deleted at business 12:30.</b> The last row closes business validity at 12:30, and the system learned of it at 12:30. The row itself is kept, so even the deletion is auditable.` },
  ];
  qWrap.addEventListener("click", e => {
    const b = e.target.closest("button[data-q]");
    if (!b) return;
    // questions read the finished table — fast-forward if mid-stepping
    if (applied < FEED.length) {
      applied = FEED.length;
      renderFeed(FEED.length - 1); renderTable(FEED.length - 1, false); showBanner(FEED.length - 1); updateBtn();
    }
    [...qWrap.children].forEach(x => x.classList.toggle("active", x === b));
    const q = QS[+b.dataset.q];
    const trs = [...tblEl.querySelectorAll("tbody tr")];
    trs.forEach(tr => tr.classList.remove("bt-hit"));
    const hit = trs[q.row];
    if (hit) {
      hit.classList.add("bt-hit");
      gsap.fromTo(hit, { scale: 1 }, { scale: 1.012, duration: .22, yoyo: true, repeat: 1, ease: "sine.inOut" });
    }
    qOut.innerHTML = q.a;
  });

  runBtn.addEventListener("click", step);
  prevBtn.addEventListener("click", prev);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- ENZYME — incremental MV refresh animation ---------- */
function wireEnzyme() {
  const NAMES = {
    ON: "Ontario", QC: "Quebec", BC: "British Columbia", AB: "Alberta", MB: "Manitoba",
    SK: "Saskatchewan", NS: "Nova Scotia", NL: "Newfoundland",
  };
  // MV already has history — these 5 groups exist at the start with running totals
  const SEED = {
    ON: { orders: 1840, revenue: 412300 },
    QC: { orders: 1206, revenue: 271450 },
    BC: { orders:  974, revenue: 233800 },
    AB: { orders:  712, revenue: 168900 },
    MB: { orders:  388, revenue:  86120 },
  };
  const SEED_KEYS = Object.keys(SEED);
  const NEW_REGIONS = ["SK", "NS", "NL"];   // groups that don't exist yet — arrive mid-stream

  const streamEl = document.getElementById("enzStream");
  const mvEl     = document.getElementById("enzMv");
  const arrow    = document.getElementById("enzArrow");
  const playBtn  = document.getElementById("enzPlay");
  const resetBtn = document.getElementById("enzReset");
  const narr     = document.getElementById("enzNarr");
  const banner   = document.getElementById("enzBanner");
  const bannerTxt= document.getElementById("enzBannerTxt");
  const fullNum  = document.getElementById("enzFullNum");
  const incNum   = document.getElementById("enzIncNum");
  const incFill  = document.getElementById("enzFill");
  const saveEl   = document.getElementById("enzSave");

  const speedSel = document.getElementById("enzSpeed");

  let mv, groups, pool, nextNewAt, fullAt, fullDone, incoming, oid, batchNo, fullRecomputes, incRecomputes, costFull, costInc, running, timer, speedMul = 1;
  const REFRESH_COST = 5;   // assumed $ cost of one full refresh run
  const wait = ms => gsap.to({}, { duration: ms / 1000 });
  const w = ms => wait(ms * speedMul);   // speed-scaled pause
  const fmtMoney = v => "$" + v.toLocaleString();
  const usdCost = v => "$" + v.toFixed(2);

  function renderMv(touched = {}, isFull = false) {
    mvEl.innerHTML =
      `<thead><tr><th>region</th><th class="r">orders</th><th class="r">revenue</th><th class="r">refresh</th></tr></thead>` +
      `<tbody>` + groups.map(key => {
        const g = mv[key];
        const st = touched[key];
        const cls = st === "new" ? "new" : st === "re" ? "recompute" : st === "sk" ? "skipped" : "";
        const reLabel = isFull ? "full rebuild" : "recomputed";
        const stCell = st === "new" ? '<span class="enz-st nw">+ new group</span>'
                     : st === "re" ? `<span class="enz-st re">${reLabel}</span>`
                     : st === "sk" ? '<span class="enz-st sk">skipped</span>' : '';
        return `<tr class="${cls}">
          <td class="grp">${key} · ${NAMES[key]}</td>
          <td class="num r">${g.orders.toLocaleString()}</td>
          <td class="num r">${fmtMoney(g.revenue)}</td>
          <td class="r">${stCell}</td>
        </tr>`;
      }).join("") + `</tbody>`;
  }

  function renderStream(msg) {
    if (!incoming.length) {
      streamEl.innerHTML = `<div class="enz-empty">${msg || "Press Start to stream orders in."}</div>`;
      return;
    }
    streamEl.innerHTML = incoming.map(o =>
      `<div class="enz-row">
        <span class="oid">#${o.id}</span>
        <span class="enz-tag">${o.region}</span>
        <span class="amt">${fmtMoney(o.amt)}</span>
      </div>`).join("");
  }

  function reset() {
    stop();
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    mv = {}; SEED_KEYS.forEach(k => mv[k] = { ...SEED[k] });
    groups = [...SEED_KEYS];
    pool = [...NEW_REGIONS];
    nextNewAt = 6;            // first never-seen group key arrives on batch 6
    fullAt = 5; fullDone = false;   // batch 5 (still 5 groups): ~80% change → engine picks a full refresh
    incoming = []; oid = 10428; batchNo = 0; fullRecomputes = 0; incRecomputes = 0; costFull = 0; costInc = 0;
    renderStream(); renderMv();
    arrow.classList.remove("live");
    banner.classList.remove("show");
    narr.innerHTML = "An aggregate over <code class='kw'>orders</code>. New orders only ever change the regions they belong to.";
    fullNum.innerHTML = `<span class="vcost">$0.00</span>`;
    incNum.innerHTML  = `<span class="vcost">$0.00</span>`;
    incFill.style.width = "0"; saveEl.textContent = `${groups.length} groups in the MV · each batch touches only a few.`;
    playBtn.textContent = "▶ Start demo"; playBtn.disabled = false;
  }

  function stop() {
    running = false;
    if (timer) { clearTimeout(timer); timer = null; }
    if (playBtn) playBtn.textContent = "▶ Start demo";
    if (arrow) arrow.classList.remove("live");
  }

  async function tick() {
    if (!running) return;
    batchNo++;

    // Every few batches, a row for a never-seen region key arrives (a brand-new group).
    const isNewGroupBatch = batchNo === nextNewAt && pool.length > 0;
    // Once, a wide change hits nearly every group — Enzyme picks a full refresh instead.
    const isFullBatch = batchNo === fullAt && !fullDone && !isNewGroupBatch;
    let picks;
    if (isFullBatch) {
      const nAff = Math.round(groups.length * 0.8);   // ~80% of groups change — over the incremental break-even
      picks = groups.slice(0, nAff);
    } else if (isNewGroupBatch) {
      picks = [pool.shift()];               // single row for the new region
      nextNewAt = batchNo + 4;              // schedule the next new group
    } else {
      const size = (batchNo % 4 === 0) ? 2 : 1;   // 1–2 rows for existing groups
      picks = [];
      while (picks.length < size) {
        const r = groups[Math.floor(Math.random() * groups.length)];
        if (!picks.includes(r)) picks.push(r);
      }
    }
    const rows = picks.map(region => ({ id: oid++, region, amt: 40 + Math.floor(Math.random() * 460), fresh: true }));

    // this batch arrives in the source (only the current batch is shown)
    incoming = rows;
    renderStream();
    gsap.from(streamEl.querySelectorAll(".enz-row"), { opacity: 0, y: -14, duration: .4, stagger: .08, ease: EASE.out });
    arrow.classList.add("live");
    await w(1000);
    if (!running) return;

    // each order flies onto its group row in the MV (new-group rows appear on render below)
    const evEls = [...streamEl.querySelectorAll(".enz-row")];
    const trsOld = [...mvEl.querySelectorAll("tbody tr")];
    await Promise.all(rows.map(async (o, i) => {
      const gi = groups.indexOf(o.region);
      if (gi === -1 || !evEls[i] || !trsOld[gi]) return;
      await w(i * 130); if (!running) return;
      anim(evEls[i], { opacity: .35, duration: .3 });
      await flyRow(evEls[i], trsOld[gi], { hideTarget: false, fadeClone: true, duration: .5 * Math.max(speedMul, .6) });
    }));
    if (!running) return;

    // engine maps changed rows → affected groups; unseen keys become brand-new groups
    const before = {}; groups.forEach(k => before[k] = { ...mv[k] });
    const touchedSet = {};
    groups.forEach(k => touchedSet[k] = "sk");
    rows.forEach(o => {
      if (!mv[o.region]) {                  // new group key: insert a fresh row into the MV
        mv[o.region] = { orders: 0, revenue: 0 };
        groups.push(o.region);
        touchedSet[o.region] = "new";
      } else if (touchedSet[o.region] !== "new") {
        touchedSet[o.region] = "re";
      }
      mv[o.region].orders += 1;
      mv[o.region].revenue += o.amt;
    });
    // a full refresh rebuilds every group — even the ~20% this batch didn't touch
    if (isFullBatch) groups.forEach(k => { if (touchedSet[k] !== "new") touchedSet[k] = "re"; });
    renderMv(touchedSet, isFullBatch);
    // touched groups count up to their fresh totals
    const trs = [...mvEl.querySelectorAll("tbody tr")];
    groups.forEach((k, i) => {
      const st = touchedSet[k];
      if (st !== "re" && st !== "new") return;
      const from = before[k] ?? { orders: 0, revenue: 0 };
      if (from.orders === mv[k].orders && from.revenue === mv[k].revenue) return;
      const cells = trs[i].querySelectorAll("td.num");
      const o = { ...from };
      gsap.to(o, { orders: mv[k].orders, revenue: mv[k].revenue, duration: .6 * speedMul, ease: EASE.out,
        onUpdate: () => {
          cells[0].textContent = Math.round(o.orders).toLocaleString();
          cells[1].textContent = fmtMoney(Math.round(o.revenue));
        } });
    });

    const recThisBatch = isFullBatch ? groups.length : picks.length;   // groups recomputed this refresh
    fullRecomputes += groups.length;    // a full refresh would rebuild every group, every batch
    incRecomputes  += recThisBatch;     // full refresh recomputes all groups
    // each refresh costs $5 at full; incremental is charged pro rata for the groups it touches
    costFull += REFRESH_COST;
    costInc  += REFRESH_COST * recThisBatch / groups.length;
    fullNum.innerHTML = `<span class="vcost">${usdCost(costFull)}</span>`;
    incNum.innerHTML  = `<span class="vcost">${usdCost(costInc)}</span>`;
    incFill.style.width = (costInc / costFull * 100).toFixed(1) + "%";
    const saved = Math.round((1 - costInc / costFull) * 100);
    saveEl.textContent = `Enzyme spent ${usdCost(costInc)} vs ${usdCost(costFull)} for full refreshes — ${usdCost(costFull - costInc)} saved (${saved}%).`;

    if (isFullBatch) {
      fullDone = true;
      const pct = Math.round(picks.length / groups.length * 100);
      banner.className = "recon show";   // amber: the engine made a cost-based call
      bannerTxt.innerHTML = `Batch #${batchNo}: this batch changed <b>${picks.length} of ${groups.length} groups (${pct}%)</b>. At that fraction, Enzyme's cost model judged a <b>full rebuild cheaper</b> than ${picks.length} per-group incremental updates — so it ran a <b>full refresh</b>, recomputing all ${groups.length} groups (even the ${groups.length - picks.length} that didn't change). It re-evaluates this <em>every refresh</em>.`;
      narr.innerHTML = "~80% of groups changed → Enzyme's runtime cost check chose full over incremental.";
    } else if (isNewGroupBatch) {
      const k = picks[0];
      banner.className = "recon diff show";
      bannerTxt.innerHTML = `Batch #${batchNo}: 1 row → <b>${k} · ${NAMES[k]}</b> — a region with <b>no group yet</b>. Enzyme adds a brand-new group row and computes just it; the existing ${groups.length - 1} groups are untouched.`;
      narr.innerHTML = "A never-seen key arrives — Enzyme creates the group incrementally, it doesn't rescan the others.";
    } else {
      const list = picks.map(p => `<b>${p}</b>`).join(" + ");
      banner.className = "recon diff show";
      bannerTxt.innerHTML = `Batch #${batchNo}: ${rows.length} row${rows.length > 1 ? "s" : ""} → ${list}. Enzyme recomputed <b>${picks.length} of ${groups.length}</b> groups; the other ${groups.length - picks.length} were served unchanged.`;
      narr.innerHTML = "Only the touched groups light up and recompute — untouched groups are reused as-is.";
    }

    await w(1500);
    if (!running) return;

    // clear this batch out before the next one arrives, and settle the MV
    await gsap.to(streamEl.querySelectorAll(".enz-row"), { opacity: 0, x: 38, duration: .4 * speedMul, stagger: .06, ease: EASE.in });
    if (!running) return;
    incoming = [];
    renderStream("Batch applied — next batch incoming…");
    renderMv();
    arrow.classList.remove("live");
    timer = setTimeout(tick, 900 * speedMul);
  }

  function start() {
    if (running) { stop(); return; }
    if (fullRecomputes === 0) { banner.classList.remove("show"); }
    running = true;
    playBtn.textContent = "❚❚ Stop";
    tick();
  }

  speedSel.addEventListener("change", () => { speedMul = parseFloat(speedSel.value); });
  playBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", reset);
  speedMul = parseFloat(speedSel.value);
  reset();
}

/* ---------- STREAMING TABLE wiring ---------- */
function wireStreamingTable() {
  // append-only source; batches of 1-2 events land past the checkpoint each run
  const EV = [
    { id: "e-1001", label: "signup",   amt: 1 },
    { id: "e-1002", label: "purchase", amt: 49 },
    { id: "e-1003", label: "purchase", amt: 12 },
    { id: "e-1004", label: "signup",   amt: 1 },
    { id: "e-1005", label: "refund",   amt: -8 },
    { id: "e-1006", label: "purchase", amt: 33 },
    { id: "e-1007", label: "signup",   amt: 1 },
    { id: "e-1008", label: "purchase", amt: 21 },
  ];
  const BATCHES = [[0,1],[2,3],[4],[5,6],[7]];   // which source indices arrive per micro-batch

  const srcEl = document.getElementById("stSrc");
  const tgtEl = document.getElementById("stTgt");
  const arrow = document.getElementById("stArrow");
  const ckptEl = document.getElementById("stCkpt");
  const countEl = document.getElementById("stCount");
  const readEl = document.getElementById("stRead");
  const readBadge = document.getElementById("stReadBadge");
  const banner = document.getElementById("stBanner");
  const bannerTxt = document.getElementById("stBannerTxt");
  const nextBtn = document.getElementById("stNext");
  const restartBtn = document.getElementById("stRestart");
  const resetBtn = document.getElementById("stReset");
  const narr = document.getElementById("stNarr");

  let batch = 0;        // number of micro-batches run
  let committed = 0;    // checkpoint offset = source rows committed
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });

  function evRow(e, cls) {
    return `<div class="row ${cls}">
      <span class="part">${e.id}</span>
      <span class="label">${e.label}</span>
      <span class="amt">${e.amt < 0 ? "-$" + Math.abs(e.amt) : "$" + e.amt}</span>
    </div>`;
  }

  function renderSrc(newIdx) {
    const revealed = BATCHES.slice(0, batch).flat();
    let html = "";
    revealed.forEach((i, pos) => {
      const isNew = newIdx && newIdx.includes(i);
      const cls = isNew ? "src newev" : "src committed";
      if (pos === committed && committed < revealed.length && !isNew) {
        // checkpoint divider sits between committed and not-yet
      }
      html += evRow(EV[i], cls);
    });
    // checkpoint divider after committed rows
    const rows = html ? html : `<div class="enz-empty" style="padding:26px 10px;color:var(--muted);text-align:center;">Run a micro-batch to pull new rows from the source.</div>`;
    srcEl.innerHTML = rows;
  }

  function renderTgt(appendIdx) {
    const inTable = [];
    BATCHES.slice(0, batch).flat().forEach(i => { if (i < committed || (appendIdx && appendIdx.includes(i))) inTable.push(i); });
    if (!inTable.length) { tgtEl.innerHTML = `<div class="enz-empty" style="padding:26px 10px;color:var(--muted);text-align:center;">Empty — no rows appended yet.</div>`; return; }
    tgtEl.innerHTML = inTable.map(i => {
      const isNew = appendIdx && appendIdx.includes(i);
      return evRow(EV[i], isNew ? "keep appended" : "keep");
    }).join("");
  }

  function updateBadges() {
    ckptEl.textContent = committed;
    countEl.textContent = committed;
    readEl.textContent = "0";
    readBadge.classList.remove("ok");
  }

  let run = 0;
  const live = my => my === run;

  function reset() {
    run++;
    batch = 0; committed = 0;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    arrow.classList.remove("live");
    banner.classList.remove("show");
    renderSrc(); renderTgt(); updateBadges();
    nextBtn.disabled = false; nextBtn.textContent = "▶ Run next micro-batch";
    narr.innerHTML = "Checkpoint at offset <b>0</b>. Run a micro-batch — the streaming table reads only rows past the checkpoint.";
  }

  async function next() {
    if (batch >= BATCHES.length) return;
    const my = run;
    nextBtn.disabled = true;
    const idx = BATCHES[batch];
    batch++;
    // 1. new rows arrive in source — slide in
    renderSrc(idx);
    gsap.from(srcEl.querySelectorAll(".row.newev"), { opacity: 0, x: -34, duration: .45, stagger: .09, ease: EASE.out });
    arrow.classList.add("live");
    readEl.textContent = idx.length; readBadge.classList.add("ok");
    narr.innerHTML = `Micro-batch ${batch}: <b>${idx.length}</b> new row${idx.length>1?"s":""} arrived past the checkpoint. Reading only those.`;
    await wait(850); if (!live(my)) return;
    // 2. append to target — the read rows fly from source into the table
    renderTgt(idx);
    const flyFrom = [...srcEl.querySelectorAll(".row.newev")];
    const flyTo   = [...tgtEl.querySelectorAll(".row.appended")];
    await Promise.all(flyTo.map(async (el, i) => {
      await wait(i * 90); if (!live(my)) return;
      await flyRow(flyFrom[i], el); if (!live(my)) return;
      gsap.from(el, { scale: .96, duration: .3, ease: EASE.pop });
    }));
    if (!live(my)) return;
    await wait(250); if (!live(my)) return;
    // 3. advance checkpoint — settle classes in place so colors crossfade
    committed += idx.length;
    arrow.classList.remove("live");
    srcEl.querySelectorAll(".row.newev").forEach(el => { el.classList.remove("newev"); el.classList.add("committed"); });
    tgtEl.querySelectorAll(".row.appended").forEach(el => el.classList.remove("appended"));
    ckptEl.textContent = committed; countEl.textContent = committed;
    banner.classList.add("show");
    bannerTxt.innerHTML = `Appended <b>${idx.length}</b> row${idx.length>1?"s":""} · checkpoint advanced to offset <b>${committed}</b>. Rows above the line are committed and will never be re-read.`;
    if (batch >= BATCHES.length) {
      nextBtn.textContent = "All batches processed";
      narr.innerHTML = `Whole source consumed · <b>${committed}</b> rows, each processed <b>exactly once</b>. Try <b>Simulate restart</b>.`;
    } else {
      nextBtn.disabled = false;
      narr.innerHTML = `Checkpoint now at <b>${committed}</b>. Next run will read only rows after offset ${committed}.`;
    }
  }

  async function restart() {
    if (committed === 0) { narr.innerHTML = "Nothing committed yet — run a micro-batch first."; return; }
    const my = run;
    nextBtn.disabled = true; restartBtn.disabled = true;
    arrow.classList.add("live");
    readEl.textContent = "0"; readBadge.classList.remove("ok");
    narr.innerHTML = "<b>Pipeline restarting…</b> reading the checkpoint to find where to resume.";
    await wait(1100); if (!live(my)) { restartBtn.disabled = false; return; }
    arrow.classList.remove("live");
    banner.classList.add("show");
    bannerTxt.innerHTML = `Resumed at offset <b>${committed}</b> — <b>0</b> already-committed rows were re-read. A restart is free; work continues from the checkpoint, not from the start.`;
    narr.innerHTML = `Restart complete. Table still has <b>${committed}</b> rows — no duplicates, no reprocessing.`;
    restartBtn.disabled = false;
    if (batch < BATCHES.length) nextBtn.disabled = false;
  }

  nextBtn.addEventListener("click", next);
  restartBtn.addEventListener("click", restart);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- MATERIALIZED VIEW wiring ---------- */
function wireMaterializedView() {
  const CATS = ["Electronics", "Grocery", "Apparel", "Home", "Toys"];
  // seeded MV state (orders count, revenue) per category
  const SEED = { Electronics:[42,18400], Grocery:[128,9600], Apparel:[64,7200], Home:[38,11300], Toys:[27,4100] };
  // each batch: new orders arriving in the source
  const BATCHES = [
    [ { cat:"Grocery", amt:40 }, { cat:"Grocery", amt:26 } ],
    [ { cat:"Electronics", amt:520 }, { cat:"Toys", amt:35 } ],
    [ { cat:"Apparel", amt:88 } ],
    [ { cat:"Home", amt:240 }, { cat:"Grocery", amt:18 } ],
  ];

  const streamEl = document.getElementById("mvStream");
  const mvEl = document.getElementById("mvMv");
  const arrow = document.getElementById("mvArrow");
  const nextBtn = document.getElementById("mvNext");
  const resetBtn = document.getElementById("mvReset");
  const narr = document.getElementById("mvNarr");
  const banner = document.getElementById("mvBanner");
  const bannerTxt = document.getElementById("mvBannerTxt");

  let batch = 0;
  let state = {};                 // current MV values
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  let run2 = 0;
  const live = my => my === run2;

  function seed() { state = {}; CATS.forEach(c => state[c] = { orders: SEED[c][0], rev: SEED[c][1] }); }

  function renderStream(rows, msg) {
    if (!rows || !rows.length) { streamEl.innerHTML = `<div class="enz-empty">${msg || "Apply a change to send new orders in."}</div>`; return; }
    streamEl.innerHTML = rows.map(r => `<div class="enz-row">
      <span class="enz-tag">${r.cat}</span>
      <span class="oid">new order</span>
      <span class="amt">+$${r.amt}</span>
    </div>`).join("");
  }

  function renderMv(refreshed) {
    // refreshed = view was just brought up to date → every row reflects the refresh
    mvEl.innerHTML = `<thead><tr><th>category</th><th class="r">orders</th><th class="r">revenue</th><th>status</th></tr></thead><tbody>` +
      CATS.map(c => {
        const cls = refreshed ? "recompute" : "";
        const st  = refreshed ? `<span class="enz-st re">refreshed</span>` : "";
        return `<tr class="${cls}"><td class="grp">${c}</td><td class="num r">${state[c].orders}</td><td class="num r">$${state[c].rev.toLocaleString()}</td><td>${st}</td></tr>`;
      }).join("") + `</tbody>`;
  }

  function applyBatch(rows) {
    rows.forEach(r => { state[r.cat].orders += 1; state[r.cat].rev += r.amt; });
  }

  function reset() {
    run2++;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    batch = 0;
    seed();
    arrow.classList.remove("live");
    banner.classList.remove("show");
    renderStream(null); renderMv(false);
    nextBtn.disabled = false; nextBtn.textContent = "▶ Apply next change";
    narr.innerHTML = "The MV holds precomputed per-category totals. Apply a source change and watch it refresh to stay in sync.";
  }

  async function next() {
    if (batch >= BATCHES.length) return;
    const my = run2;
    nextBtn.disabled = true;
    const rows = BATCHES[batch];
    batch++;
    const touched = new Set(rows.map(r => r.cat));
    // 1. show incoming — orders drop in, then sit for a beat
    renderStream(rows);
    gsap.from(streamEl.querySelectorAll(".enz-row"), { opacity: 0, y: -16, duration: .45, stagger: .1, ease: EASE.out });
    arrow.classList.add("live");
    narr.innerHTML = `${rows.length} new order${rows.length>1?"s":""} landed in <code class='kw'>orders</code>, touching <b>${[...touched].join(", ")}</b>.`;
    await wait(950); if (!live(my)) return;
    // 2. each order flies onto its category row in the view
    const evEls = [...streamEl.querySelectorAll(".enz-row")];
    const trsOld = [...mvEl.querySelectorAll("tbody tr")];
    await Promise.all(rows.map(async (r, i) => {
      if (!evEls[i] || !trsOld[CATS.indexOf(r.cat)]) return;
      await wait(i * 130); if (!live(my)) return;
      anim(evEls[i], { opacity: .35, duration: .3 });
      await flyRow(evEls[i], trsOld[CATS.indexOf(r.cat)], { hideTarget: false, fadeClone: true, duration: .55 });
    }));
    if (!live(my)) return;
    // 3. refresh brings the stored result up to date — touched totals count up
    const before = {}; CATS.forEach(c => before[c] = { ...state[c] });
    applyBatch(rows);
    renderMv(true);
    const trs = [...mvEl.querySelectorAll("tbody tr")];
    CATS.forEach((c, i) => {
      if (!touched.has(c)) return;
      const cells = trs[i].querySelectorAll("td.num");
      const o = { ...before[c] };
      gsap.to(o, { orders: state[c].orders, rev: state[c].rev, duration: .8, ease: EASE.out,
        onUpdate: () => {
          cells[0].textContent = Math.round(o.orders);
          cells[1].textContent = "$" + Math.round(o.rev).toLocaleString();
        } });
    });
    arrow.classList.remove("live");
    banner.classList.add("show");
    bannerTxt.innerHTML = `Refresh ${batch}: the view is brought up to date — <b>${[...touched].join(", ")}</b> now reflect the new orders, and a read of <code class='kw'>revenue_by_category</code> returns the fresh totals instantly.`;
    await wait(400);
    renderStream(null, "Refreshed — apply the next change.");
    if (batch >= BATCHES.length) {
      nextBtn.textContent = "All changes applied";
      narr.innerHTML = `The view stayed in sync across every change. <b>How</b> it refreshes — incrementally on serverless — is the <a href="#enzyme">Enzyme</a> story.`;
    } else {
      nextBtn.disabled = false;
      narr.innerHTML = `Up to date. Apply the next change to refresh again.`;
    }
  }

  nextBtn.addEventListener("click", next);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- APPEND FLOW wiring ---------- */
function wireAppendFlow() {
  // three flows into one target. backfill is ONCE; us/eu are continuous.
  const SRC = {
    back: { name: "events_archive", kind: "ONCE", cls: "s-back", prov: "prov-back", tag: "backfill" },
    us:   { name: "kafka_us",       kind: "continuous", cls: "s-us", prov: "prov-us", tag: "us_stream" },
    eu:   { name: "kafka_eu",       kind: "continuous", cls: "s-eu", prov: "prov-eu", tag: "eu_stream" },
  };
  // records waiting in each source before an update. backfill is pre-loaded once;
  // the continuous streams receive a fresh (bounded) batch after every update.
  const INITIAL = { back: 3, us: 2, eu: 1 };   // queued before the first update
  const ARRIVALS = [                            // new records that land AFTER each update (streams only)
    { us: 2, eu: 2 },
    { us: 1, eu: 2 },
    { us: 2, eu: 1 },
  ];
  const MAX_UPDATES = ARRIVALS.length + 1;      // process the initial queue, then one per arrival batch

  const sourcesEl = document.getElementById("afSources");
  const tgtEl = document.getElementById("afTgt");
  const arrow = document.getElementById("afArrow");
  const banner = document.getElementById("afBanner");
  const bannerTxt = document.getElementById("afBannerTxt");
  const nextBtn = document.getElementById("afNext");
  const resetBtn = document.getElementById("afReset");
  const narr = document.getElementById("afNarr");

  let update = 0;
  let rows = [];                       // committed target rows
  let queue = { back: [], us: [], eu: [] };   // pending records per source
  let backfillDone = false;
  let seq = { back: 0, us: 0, eu: 0 };
  const CITIES = { us: ["Austin","Denver","Seattle","Boston"], eu: ["Paris","Berlin","Madrid","Milan"], back: ["Toronto","Ottawa","Calgary"] };
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  let run2 = 0;
  const live = my => my === run2;

  function enqueue(k, n) {
    const s = SRC[k], out = [];
    for (let i=0;i<n;i++) {
      seq[k]++;
      const city = CITIES[k][(seq[k]-1) % CITIES[k].length];
      const idPfx = k === "back" ? "arc" : k;
      const rec = { k, prov: s.prov, flow: s.tag, id: `${idPfx}-${String(seq[k]).padStart(3,"0")}`, city };
      queue[k].push(rec); out.push(rec);
    }
    return out;
  }

  function renderSources() {
    sourcesEl.innerHTML = Object.entries(SRC).map(([k,s]) => {
      const spent = k === "back" && backfillDone;
      const q = queue[k];
      const pill = s.kind === "ONCE"
        ? (spent ? `<span class="flow-pill" style="color:var(--muted);border-color:var(--line);">✓ complete · won't re-run</span>` : `<span class="flow-pill">INSERT INTO ONCE</span>`)
        : `<span class="flow-pill">continuous</span>`;
      const capLabel = k === "back" ? "history queued" : "queued · unprocessed";
      let body;
      if (spent) {
        body = `<div class="af-empty">Loaded once at first run — skipped on every update since.</div>`;
      } else if (!q.length) {
        body = `<div class="af-empty">Waiting for records…</div>`;
      } else {
        body = `<div class="qcap"><span>${capLabel}</span><b>${q.length}</b></div>
          <div class="af-q">${q.map(r => `<div class="af-qrow" data-qk="${k}" data-qid="${r.id}"><span class="qid">${r.id}</span><span class="qcity">${r.city}</span></div>`).join("")}</div>`;
      }
      return `<div class="src-mini ${s.cls} ${spent?"spent":""}">
        <div class="mh"><span class="nm">${s.name}</span>${pill}</div>
        <div class="mbody">${body}</div>
      </div>`;
    }).join("");
  }

  function renderTgt(enterProvs) {
    if (!rows.length) { tgtEl.innerHTML = `<div class="enz-empty" style="padding:30px 10px;color:var(--muted);text-align:center;">Empty — records are queued at left. Run the update.</div>`; return; }
    tgtEl.innerHTML = rows.map(r => {
      const entering = enterProvs && enterProvs.has(r.k) && r._new ? "appended" : "";
      return `<div class="row ${r.prov} ${entering}">
        <span class="part">${r.id}</span>
        <span class="label">${r.city} <span class="tag ${r.k==='us'?'src':r.k==='eu'?'target':'keep'}">${r.flow}</span></span>
      </div>`;
    }).join("");
  }

  function reset() {
    run2++;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    update = 0; rows = []; backfillDone = false; seq = { back:0, us:0, eu:0 };
    queue = { back: [], us: [], eu: [] };
    enqueue("back", INITIAL.back); enqueue("us", INITIAL.us); enqueue("eu", INITIAL.eu);
    arrow.classList.remove("live");
    banner.classList.remove("show");
    renderSources(); renderTgt();
    nextBtn.disabled = false; nextBtn.textContent = "▶ Next update";
    narr.innerHTML = "Records are <b>queued</b> in each source. Run the update — every flow drains its pending records into <code class='kw'>events</code>, and the <b>ONCE</b> backfill drains its history a single time.";
  }

  async function next() {
    if (update >= MAX_UPDATES) return;
    const my = run2;
    nextBtn.disabled = true;
    rows.forEach(r => r._new = false);

    // snapshot what each flow will drain this update, and grab the queued chip elements
    const draining = {};   // k -> [records]
    const fromEls = [];    // parallel to newRows
    const entered = new Set();
    Object.keys(SRC).forEach(k => { if (queue[k].length) { draining[k] = queue[k].slice(); entered.add(k); } });
    if (!entered.size) return;

    update++;
    arrow.classList.add("live");
    const fired = [];
    const newRows = [];
    Object.entries(draining).forEach(([k, items]) => {
      items.forEach(rec => {
        const chip = sourcesEl.querySelector(`.af-qrow[data-qk="${k}"][data-qid="${rec.id}"]`);
        fromEls.push(chip);
        const nr = { ...rec, _new: true };
        rows.push(nr); newRows.push(nr);
      });
      if (k === "back") { backfillDone = true; fired.push(`backfill drained <b>${items.length}</b> historical rows`); }
      else fired.push(`${SRC[k].tag} +${items.length}`);
    });

    // 1 — pulse the firing sources so the viewer sees the queued data about to move
    const keys = Object.keys(SRC), minis = [...sourcesEl.children];
    narr.innerHTML = `Update ${update}: draining <b>${[...entered].map(k => SRC[k].name).join(" + ")}</b>…`;
    entered.forEach(k => gsap.fromTo(minis[keys.indexOf(k)], { scale: 1 },
      { scale: 1.02, duration: .28, yoyo: true, repeat: 3, ease: "sine.inOut" }));
    await wait(650); if (!live(my)) return;

    // 2 — each queued record flies from its chip into the target, then leaves the queue
    renderTgt(entered);
    const newEls = [...tgtEl.querySelectorAll(".row.appended")];
    newEls.forEach(el => gsap.set(el, { opacity: 0 }));
    await Promise.all(newEls.map(async (el, i) => {
      await wait(i * 130); if (!live(my)) return;
      const from = fromEls[i] || minis[keys.indexOf(newRows[i].k)];
      if (fromEls[i]) gsap.to(fromEls[i], { opacity: .25, duration: .3 });
      await flyRow(from, el, { cloneOf: "to" }); if (!live(my)) return;
      gsap.from(el, { scale: .96, duration: .25, ease: EASE.pop });
    }));
    if (!live(my)) return;

    // queues are now drained
    Object.keys(draining).forEach(k => { queue[k] = []; });
    renderSources();

    banner.classList.add("show");
    if (update === 1) {
      bannerTxt.innerHTML = `First update: every queued record drained into <code class='kw'>events</code> — including the <b>ONCE</b> backfill's history. ${rows.length} rows committed. The backfill is now complete.`;
    } else {
      bannerTxt.innerHTML = `Update ${update}: only the <b>continuous</b> flows had queued records (${fired.join(", ")}). The <b>ONCE</b> backfill stayed complete — no duplicate history.`;
    }

    // 3 — new records arrive into the continuous queues for the NEXT update (bounded — queues never grow)
    if (update < MAX_UPDATES) {
      await wait(500); if (!live(my)) return;
      const a = ARRIVALS[update - 1];
      const arrivedKeys = [];
      Object.entries(a).forEach(([k, n]) => { if (n) { enqueue(k, n); arrivedKeys.push(k); } });
      renderSources();
      const minis2 = [...sourcesEl.children];
      arrivedKeys.forEach(k => {
        const mini = minis2[keys.indexOf(k)];
        const chips = [...mini.querySelectorAll(".af-qrow")];
        gsap.from(chips, { opacity: 0, x: -18, height: 0, paddingTop: 0, paddingBottom: 0, duration: .4, stagger: .08, ease: EASE.out });
      });
      narr.innerHTML = "Fresh records just <b>queued</b> on the continuous streams — the backfill stays idle. Run the next update to drain them.";
      arrow.classList.remove("live");
      nextBtn.disabled = false;
    } else {
      await wait(400); if (!live(my)) return;
      arrow.classList.remove("live");
      nextBtn.textContent = "Pipeline caught up";
      narr.innerHTML = `Done — <b>${rows.length}</b> rows unioned from 3 flows. Each stream drained its queue per update; the backfill ran exactly once.`;
    }
  }

  nextBtn.addEventListener("click", next);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- EXPECTATIONS wiring ---------- */
function wireExpectations() {
  // same batch every mode; two invalid rows (amount <= 0)
  const BATCH = [
    { id:"o-01", region:"ON", amt:120, ok:true },
    { id:"o-02", region:"BC", amt:0,   ok:false },
    { id:"o-03", region:"QC", amt:88,  ok:true },
    { id:"o-04", region:"AB", amt:-15, ok:false },
    { id:"o-05", region:"NS", amt:64,  ok:true },
  ];
  const DESC = {
    warn: "<b>WARN</b> (default) — violating rows are <b>kept</b> and flow into the table; each violation is counted in the event log.",
    drop: "<b>DROP ROW</b> — violating rows are <b>discarded</b> at the gate; the update still succeeds with the good rows.",
    fail: "<b>FAIL UPDATE</b> — the first violation <b>aborts the whole update</b>; nothing commits, even the good rows.",
  };

  const srcEl = document.getElementById("exSrc");
  const tgtEl = document.getElementById("exTgt");
  const gate = document.getElementById("exGate");
  const ring = document.getElementById("exRing");
  const gateLbl = document.getElementById("exGateLbl");
  const tgtSub = document.getElementById("exTgtSub");
  const descEl = document.getElementById("exDesc");
  const toggle = document.getElementById("exToggle");
  const chips = document.getElementById("exChips");
  const banner = document.getElementById("exBanner");
  const bannerTxt = document.getElementById("exBannerTxt");
  const runBtn = document.getElementById("exRun");
  const resetBtn = document.getElementById("exReset");
  const narr = document.getElementById("exNarr");

  let mode = "warn";
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  const money = v => v < 0 ? "-$" + Math.abs(v) : "$" + v;
  let run2 = 0;
  const live = my => my === run2;

  // fly the committed subset from source to target, in stream order
  async function flyCommit(list, my) {
    renderTgt(list);
    const destEls = [...tgtEl.children];
    destEls.forEach(el => gsap.set(el, { opacity: 0 }));
    await Promise.all(list.map(async (r, i) => {
      await wait(i * 120); if (!live(my)) return;
      const s = srcEl.querySelector(`[data-id="${r.id}"]`);
      anim(s, { opacity: .3, filter: "saturate(.4)", duration: .4 });
      await flyRow(s, destEls[i]); if (!live(my)) return;
      gsap.from(destEls[i], { scale: .96, duration: .3, ease: EASE.pop });
    }));
  }

  function srcRow(r, extra="") {
    return `<div class="row ${r.ok?"":"bad"} ${extra}" data-id="${r.id}">
      <span class="part">${r.id}</span>
      <span class="label">${r.region} ${r.ok?"":'<span class="badge-bad">amount ≤ 0</span>'}</span>
      <span class="amt">${money(r.amt)}</span>
    </div>`;
  }
  function renderSrc(cls="") { srcEl.innerHTML = BATCH.map(r => srcRow(r)).join(""); }
  function renderTgt(list) {
    if (!list.length) { tgtEl.innerHTML = `<div class="enz-empty" style="padding:30px 10px;color:var(--muted);text-align:center;">Nothing committed.</div>`; return; }
    tgtEl.innerHTML = list.map(r => {
      const warned = mode === "warn" && !r.ok;
      return `<div class="row ${warned?"warned":"keep"}">
        <span class="part">${r.id}</span>
        <span class="label">${r.region} ${warned?'<span class="badge-warn">kept · flagged</span>':""}</span>
        <span class="amt">${money(r.amt)}</span>
      </div>`;
    }).join("");
  }

  function setGate() {
    gate.className = "gate " + mode;
    ring.textContent = mode === "warn" ? "⚠" : mode === "drop" ? "⤵" : "✕";
    gateLbl.textContent = mode === "warn" ? "WARN" : mode === "drop" ? "DROP" : "FAIL";
  }

  function reset() {
    run2++;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    banner.className = "recon";
    chips.innerHTML = "";
    renderSrc(); renderTgt([]); setGate();
    tgtSub.textContent = "rows that made it in";
    descEl.innerHTML = DESC[mode];
    runBtn.disabled = false;
    narr.innerHTML = "Same 5-row batch (2 break <code class='kw'>amount &gt; 0</code>). Run it and watch this action's outcome.";
    [...toggle.children].forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  }

  async function run() {
    reset();
    const my = run2;
    runBtn.disabled = true;
    await wait(350); if (!live(my)) return;
    const good = BATCH.filter(r => r.ok);
    const bad = BATCH.filter(r => !r.ok);

    if (mode === "warn") {
      narr.innerHTML = "Everything passes the gate — violations are only counted…";
      await flyCommit(BATCH, my); if (!live(my)) return;
      chips.innerHTML = `<span class="chip ok">✓ ${good.length} valid</span><span class="chip warn">⚠ ${bad.length} flagged (kept)</span><span class="chip">${BATCH.length} rows committed</span>`;
      banner.className = "recon show";
      bannerTxt.innerHTML = `All <b>${BATCH.length}</b> rows committed — the <b>${bad.length}</b> violating rows passed through but are counted as violations in the event log.`;
      narr.innerHTML = "WARN keeps everything — good for observing quality without blocking.";
    } else if (mode === "drop") {
      // bad rows collapse out at the gate; the rest slide up, then good rows fly through
      const badEls = bad.map(r => srcEl.querySelector(`[data-id="${r.id}"]`));
      narr.innerHTML = "Violating rows filtered out at the gate…";
      await anim(badEls, {
        opacity: 0, x: 42, height: 0,
        paddingTop: 0, paddingBottom: 0, marginTop: 0, marginBottom: 0,
        borderTopWidth: 0, borderBottomWidth: 0,
        duration: .5, stagger: .1, ease: EASE.in,
      });
      if (!live(my)) return;
      badEls.forEach(el => el.remove());
      await flyCommit(good, my); if (!live(my)) return;
      chips.innerHTML = `<span class="chip ok">✓ ${good.length} committed</span><span class="chip warn">${bad.length} dropped</span>`;
      banner.className = "recon show";
      bannerTxt.innerHTML = `<b>${bad.length}</b> rows dropped; <b>${good.length}</b> good rows committed. The update succeeded — but the dropped rows are <b>gone</b> (see <a href="#quarantine">Quarantine</a> to keep them).`;
      narr.innerHTML = "DROP sheds bad rows and keeps the pipeline flowing.";
    } else { // fail — halts on first bad row in stream order
      const firstBadIdx = BATCH.findIndex(r => !r.ok);
      const before = BATCH.slice(0, firstBadIdx);      // good rows before the first violation
      // highlight the offending row: outline + shake
      const offender = BATCH[firstBadIdx];
      const el = srcEl.querySelector(`[data-id="${offender.id}"]`);
      if (el) {
        el.style.boxShadow = "0 0 0 2px var(--red)";
        gsap.fromTo(el, { x: 0 }, { x: 5, duration: .06, repeat: 7, yoyo: true, ease: "sine.inOut", onComplete: () => gsap.set(el, { x: 0 }) });
      }
      gate.classList.add("fail");
      narr.innerHTML = `Row <b>${offender.id}</b> violates the constraint…`;
      await wait(800); if (!live(my)) return;
      renderTgt([]);   // nothing commits
      tgtSub.textContent = "update aborted — nothing committed";
      chips.innerHTML = `<span class="chip warn">✕ update FAILED at ${offender.id}</span><span class="chip">0 rows committed</span>`;
      banner.className = "recon fail show";
      bannerTxt.innerHTML = `<b>Update aborted.</b> The first violation (<code class='kw'>${offender.id}</code>, amount ${offender.amt}) failed the flow — the transaction rolls back, so <b>none</b> of the ${BATCH.length} rows commit, not even the ${before.length} valid ones before it.`;
      narr.innerHTML = "FAIL is the strict gate: one bad row stops everything.";
    }
  }

  toggle.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode; reset();
  }));
  runBtn.addEventListener("click", run);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- QUARANTINE wiring ---------- */
function wireQuarantine() {
  const BATCH = [
    { id:"o-01", region:"ON",   amt:120, ok:true },
    { id:"o-02", region:null,   amt:88,  ok:false, why:"region IS NULL" },
    { id:"o-03", region:"QC",   amt:64,  ok:true },
    { id:"o-04", region:"AB",   amt:-15, ok:false, why:"amount ≤ 0" },
    { id:"o-05", region:"BC",   amt:210, ok:true },
    { id:"o-06", region:null,   amt:0,   ok:false, why:"amount ≤ 0, region NULL" },
  ];

  const srcEl = document.getElementById("qSrc");
  const cleanEl = document.getElementById("qClean");
  const quarEl = document.getElementById("qQuar");
  const fork = document.getElementById("qFork");
  const chips = document.getElementById("qChips");
  const banner = document.getElementById("qBanner");
  const bannerTxt = document.getElementById("qBannerTxt");
  const runBtn = document.getElementById("qRun");
  const resetBtn = document.getElementById("qReset");
  const narr = document.getElementById("qNarr");
  const wait = ms => gsap.to({}, { duration: ms * 1.7 / 1000 });
  const money = v => v < 0 ? "-$" + Math.abs(v) : "$" + v;

  function srcRow(r, extra="") {
    return `<div class="row ${r.ok?"":"bad"} ${extra}" data-id="${r.id}">
      <span class="part">${r.id}</span>
      <span class="label">${r.region ?? "∅"} ${r.ok?"":`<span class="badge-bad">${r.why}</span>`}</span>
      <span class="amt">${money(r.amt)}</span>
    </div>`;
  }
  function tgtRow(r, cls, enter="") {
    return `<div class="row ${cls} ${enter}">
      <span class="part">${r.id}</span>
      <span class="label">${r.region ?? "∅"}</span>
      <span class="amt">${money(r.amt)}</span>
    </div>`;
  }
  function renderSrc() { srcEl.innerHTML = BATCH.map(r => srcRow(r)).join(""); }
  function emptyPane(el, txt) { el.innerHTML = `<div class="enz-empty" style="padding:22px 10px;color:var(--muted);text-align:center;">${txt}</div>`; }

  let run2 = 0;
  const live = my => my === run2;

  function reset() {
    run2++;
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    banner.classList.remove("show");
    chips.innerHTML = "";
    renderSrc();
    emptyPane(cleanEl, "—"); emptyPane(quarEl, "—");
    runBtn.disabled = false;
    narr.innerHTML = "6 rows in; 3 break the validity rule. Run the batch — the stream forks, nothing is thrown away.";
  }

  async function run() {
    reset();
    const my = run2;
    runBtn.disabled = true;
    await wait(350); if (!live(my)) return;
    const good = BATCH.filter(r => r.ok);
    const bad = BATCH.filter(r => !r.ok);
    narr.innerHTML = "Evaluating <code class='kw'>is_valid</code> and forking the stream…";
    await wait(500); if (!live(my)) return;
    // fork: each row flies from the source to its side of the split, in stream order
    cleanEl.innerHTML = good.map(r => tgtRow(r, "keep")).join("");
    quarEl.innerHTML = bad.map(r => tgtRow(r, "bad")).join("");
    const cleanRows = [...cleanEl.children], quarRows = [...quarEl.children];
    let gi = 0, bi = 0;
    const flights = BATCH.map(r => ({ r, dest: r.ok ? cleanRows[gi++] : quarRows[bi++] }));
    flights.forEach(f => gsap.set(f.dest, { opacity: 0 }));
    await Promise.all(flights.map(async (f, i) => {
      await wait(i * 140); if (!live(my)) return;
      const srcRowEl = srcEl.querySelector(`[data-id="${f.r.id}"]`);
      anim(srcRowEl, { opacity: .3, filter: "saturate(.4)", duration: .4 });
      await flyRow(srcRowEl, f.dest); if (!live(my)) return;
      gsap.from(f.dest, { scale: .96, duration: .3, ease: EASE.pop });
    }));
    if (!live(my)) return;
    chips.innerHTML = `<span class="chip ok">✓ ${good.length} → orders_clean</span><span class="chip warn">⤵ ${bad.length} → orders_quarantine</span><span class="chip">0 rows lost</span>`;
    banner.classList.add("show");
    bannerTxt.innerHTML = `Stream forked: <b>${good.length}</b> valid rows flow to <code class='kw'>orders_clean</code>, <b>${bad.length}</b> invalid rows are <b>retained</b> in <code class='kw'>orders_quarantine</code> — inspectable and reprocessable, unlike a plain DROP.`;
    narr.innerHTML = "Good data keeps flowing; bad data is held, not lost.";
  }

  runBtn.addEventListener("click", run);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- CI/CD & BUNDLES wiring ---------- */
function wireCicdBundles() {
  const wait = ms => gsap.to({}, { duration: ms / 1000 });
  let run = 0;
  const live = my => my === run;

  // geometry: node centre = (offsetLeft, offsetTop) because nodes use translate(-50%,-50%)
  const cx = el => el.offsetLeft, cy = el => el.offsetTop;
  const rightOf  = el => ({ x: cx(el) + el.offsetWidth / 2, y: cy(el) });
  const leftOf   = el => ({ x: cx(el) - el.offsetWidth / 2, y: cy(el) });
  const topOf    = el => ({ x: cx(el), y: cy(el) - el.offsetHeight / 2 });
  const bottomOf = el => ({ x: cx(el), y: cy(el) + el.offsetHeight / 2 });
  const centreOf = el => ({ x: cx(el), y: cy(el) });

  function pathD(pts) {
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], dx = (b.x - a.x) * 0.5, dy = (b.y - a.y) * 0.5;
      // horizontal handles for mostly-horizontal hops, vertical for vertical ones
      const horiz = Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);
      const c1 = horiz ? { x: a.x + dx, y: a.y } : { x: a.x, y: a.y + dy };
      const c2 = horiz ? { x: b.x - dx, y: b.y } : { x: b.x, y: b.y - dy };
      d += ` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
    }
    return d;
  }

  // move token along a flow path while the flow line draws on
  async function travel(flow, token, my, dur) {
    const len = flow.getTotalLength();
    flow.style.display = "block";
    flow.setAttribute("stroke-dasharray", len);
    flow.style.strokeDashoffset = len;
    const p0 = flow.getPointAtLength(0);
    token.style.left = p0.x + "px"; token.style.top = p0.y + "px";
    gsap.set(token, { opacity: 1 });
    const o = { v: 0 };
    await gsap.to(o, { v: 1, duration: dur, ease: EASE.inOut, onUpdate: () => {
      const pt = flow.getPointAtLength(o.v * len);
      token.style.left = pt.x + "px"; token.style.top = pt.y + "px";
      flow.style.strokeDashoffset = len * (1 - o.v);
    }});
    return live(my);
  }

  /* ===== DEV SCENE (all three routes flow continuously) ===== */
  const devMap    = document.getElementById("ccDevMap");
  const devEdges  = document.getElementById("ccDevEdges");
  const devWs     = document.getElementById("ccDevWs");
  const wps       = [...devMap.querySelectorAll(".cc-wp")];
  const laptop    = devMap.querySelector(".cc-node");
  let devBuilt = false, devTweens = [];

  function buildDevEdges() {
    const wpById = {}; wps.forEach(w => wpById[w.dataset.path] = w);
    let svg = "";
    ["cli", "ui", "git"].forEach(p => {
      const pts = [rightOf(laptop), centreOf(wpById[p]), leftOf(devWs)];
      const d = pathD(pts);
      svg += `<path class="cc-edge route" id="ccd-base-${p}" d="${d}"></path>`;
    });
    devEdges.innerHTML = svg;
    devBuilt = true;
  }

  function stopDevFlows() {
    devTweens.forEach(t => t.kill());
    devTweens = [];
    devMap.querySelectorAll(".cc-dev-tok").forEach(t => t.remove());
  }

  // each route glides a bundle token laptop → dev workspace, looping forever, staggered
  function startDevFlows() {
    stopDevFlows();
    ["cli", "ui", "git"].forEach((p, i) => {
      const base = document.getElementById("ccd-base-" + p);
      if (!base) return;
      const len = base.getTotalLength();
      const tok = document.createElement("div");
      tok.className = "cc-token cc-dev-tok"; tok.textContent = "📦";
      devMap.appendChild(tok);
      const o = { v: 0 };
      const tw = gsap.to(o, {
        v: 1, duration: 2.6, ease: "none", repeat: -1, delay: i * 0.85,
        onRepeat: () => { gsap.fromTo(devWs, { scale: 1 }, { scale: 1.02, duration: .18, yoyo: true, repeat: 1, ease: EASE.out }); },
        onUpdate: () => {
          const pt = base.getPointAtLength(o.v * len);
          tok.style.left = pt.x + "px"; tok.style.top = pt.y + "px";
          tok.style.opacity = o.v < 0.06 ? o.v / 0.06 : o.v > 0.94 ? (1 - o.v) / 0.06 : 1;
        },
      });
      devTweens.push(tw);
    });
  }

  /* ===== FAN-OUT SCENE (write once, deploy many) ===== */
  const fanMap    = document.getElementById("ccFanMap");
  const fanEdges  = document.getElementById("ccFanEdges");
  const bundleN   = document.getElementById("ccBundle");
  const fanRun    = document.getElementById("ccFanRun");
  const fanReset  = document.getElementById("ccFanReset");
  const fanNarr   = document.getElementById("ccFanNarr");
  const fanInsight= document.getElementById("ccFanInsight");
  const fanTargets = [...fanMap.querySelectorAll(".cc-node[data-tgt]")];
  const FAN_TONE = { dev: "", stg: "", pc: "prod", pe: "prod" };
  let fanBuilt = false;

  function buildFanEdges() {
    let svg = "";
    fanTargets.forEach(n => {
      const d = pathD([rightOf(bundleN), leftOf(n)]);
      const k = n.dataset.tgt;
      svg += `<path class="cc-edge" id="ccf-base-${k}" d="${d}"></path>`;
      svg += `<path class="cc-flow ${FAN_TONE[k] === "prod" ? "prod" : ""}" id="ccf-flow-${k}" d="${d}" style="display:none"></path>`;
    });
    fanEdges.innerHTML = svg;
    fanBuilt = true;
  }

  function fanResetFn() {
    run++;
    fanMap.querySelectorAll(".cc-fan-tok").forEach(t => t.remove());
    fanTargets.forEach(n => { n.classList.remove("done", "lit"); });
    fanTargets.forEach(n => { const f = document.getElementById("ccf-flow-" + n.dataset.tgt); if (f) f.style.display = "none"; });
    fanRun.disabled = false;
    fanNarr.innerHTML = "The same bundle deploys to <b>4 targets</b>. Deploy it and watch the one artifact fan out.";
    fanInsight.innerHTML = "<b>One <code class='kw'>resources</code> block, four <code class='kw'>targets</code>.</b> The identical pipeline definition deploys everywhere — each target only overrides host, mode, catalog, and who it runs as. Change the pipeline once and every environment (both Canada prod regions included) gets it: no copy-paste, no drift.";
  }

  async function fanDeploy() {
    fanResetFn();
    const my = run;
    fanRun.disabled = true;
    fanNarr.innerHTML = "<code class='kw'>databricks bundle deploy -t &lt;target&gt;</code> — same artifact, resolved per target…";
    let landed = 0;
    await Promise.all(fanTargets.map(async (n, i) => {
      const k = n.dataset.tgt, tone = FAN_TONE[k];
      const flow = document.getElementById("ccf-flow-" + k);
      const tok = document.createElement("div");
      tok.className = "cc-token cc-fan-tok" + (tone ? " " + tone : "");
      tok.textContent = "📦";
      fanMap.appendChild(tok);
      await wait(i * 170); if (!live(my)) return;
      n.classList.add("lit");
      if (!await travel(flow, tok, my, 1.25)) return;
      n.classList.remove("lit"); n.classList.add("done");
      gsap.from(n, { scale: .95, duration: .3, ease: EASE.pop });
      await gsap.to(tok, { opacity: 0, duration: .25 });
      tok.remove();
      landed++;
      fanNarr.innerHTML = `Deployed to <b>${landed} of ${fanTargets.length}</b> targets — same code, per-target config.`;
    }));
    if (!live(my)) return;
    fanNarr.innerHTML = "<b>All 4 targets live from one bundle.</b> Same code, per-target config — write once, deploy many.";
  }

  fanRun.addEventListener("click", fanDeploy);
  fanReset.addEventListener("click", fanResetFn);

  /* ===== PROD SCENE ===== */
  const prodMap   = document.getElementById("ccProdMap");
  const prodEdges = document.getElementById("ccProdEdges");
  const nMain    = document.getElementById("ccMain");
  const nRelease = document.getElementById("ccRelease");
  const nPipe    = document.getElementById("ccPipe");
  const nProdWs  = document.getElementById("ccProdWs");
  const nLaptopX = document.getElementById("ccLaptopX");
  const prodVer  = document.getElementById("ccProdVer");
  const prodTok  = document.getElementById("ccProdTok");
  const prodRun  = document.getElementById("ccProdRun");
  const rollback = document.getElementById("ccRollback");
  const prodReset= document.getElementById("ccProdReset");
  const prodNarr = document.getElementById("ccProdNarr");
  const banner   = document.getElementById("ccProdBanner");
  const bannerTxt= document.getElementById("ccProdBannerTxt");
  const steps    = [document.getElementById("ccS1"), document.getElementById("ccS2"), document.getElementById("ccS3")];
  let prodBuilt = false;

  function buildProdEdges() {
    const eCut     = pathD([bottomOf(nMain), topOf(nRelease)]);
    const eTrigger = pathD([rightOf(nRelease), leftOf(nPipe)]);
    const eDeploy  = pathD([rightOf(nPipe), leftOf(nProdWs)]);
    const eBlocked = pathD([rightOf(nLaptopX), { x: leftOf(nProdWs).x, y: bottomOf(nProdWs).y }]);
    prodEdges.innerHTML =
      `<path class="cc-edge blocked" d="${eBlocked}"></path>` +
      `<path class="cc-edge" id="ccp-base-cut" d="${eCut}"></path>` +
      `<path class="cc-edge" id="ccp-base-trigger" d="${eTrigger}"></path>` +
      `<path class="cc-edge" id="ccp-base-deploy" d="${eDeploy}"></path>` +
      `<path class="cc-flow" id="ccp-flow-cut" d="${eCut}" style="display:none"></path>` +
      `<path class="cc-flow" id="ccp-flow-trigger" d="${eTrigger}" style="display:none"></path>` +
      `<path class="cc-flow" id="ccp-flow-deploy" d="${eDeploy}" style="display:none"></path>`;
    prodBuilt = true;
  }

  function setStep(i, cls) { steps[i].className = "step" + (cls ? " " + cls : ""); }

  function prodResetFn() {
    run++;
    gsap.set(prodTok, { opacity: 0 });
    ["cut", "trigger", "deploy"].forEach(k => { const f = document.getElementById("ccp-flow-" + k); if (f) f.style.display = "none"; });
    [nMain, nRelease, nPipe, nProdWs].forEach(n => n.classList.remove("lit", "done"));
    prodVer.className = "cc-vbadge prod"; prodVer.textContent = "v1.3.0";
    prodTok.className = "cc-token prod"; prodTok.textContent = "📦 v1.4.0";
    steps.forEach((s, i) => setStep(i, ""));
    banner.className = "recon";
    prodRun.disabled = false; rollback.disabled = true;
    prodNarr.innerHTML = "Prod runs <b>v1.3.0</b>. A human can't deploy prod directly (dashed path) — only the release pipeline can.";
  }

  async function runPipeline(my, tokenClass, tokenLabel, targetVer, targetBadge, fast) {
    // release → pipeline
    nPipe.classList.add("lit");
    const t = fast ? .7 : 1.1;
    if (!await travel(document.getElementById("ccp-flow-trigger"), prodTok, my, t)) return false;
    // pipeline stages
    const stepDwell = fast ? 360 : 620;
    for (let i = 0; i < 3; i++) {
      setStep(i, "active");
      await wait(stepDwell); if (!live(my)) return false;
      setStep(i, "done");
    }
    nPipe.classList.remove("lit"); nPipe.classList.add("done");
    // pipeline → prod
    prodTok.className = "cc-token " + tokenClass; prodTok.textContent = tokenLabel;
    if (!await travel(document.getElementById("ccp-flow-deploy"), prodTok, my, t)) return false;
    nProdWs.classList.add("lit");
    prodVer.className = "cc-vbadge " + targetBadge; prodVer.textContent = targetVer;
    gsap.from(nProdWs, { scale: .96, duration: .3, ease: EASE.pop });
    await wait(200); if (!live(my)) return false;
    nProdWs.classList.remove("lit"); nProdWs.classList.add("done");
    return true;
  }

  async function prodDeploy() {
    prodResetFn();
    const my = run;
    prodRun.disabled = true;
    prodNarr.innerHTML = "Cutting <code class='kw'>release/1.4.0</code> from main…";
    nMain.classList.add("done");
    if (!await travel(document.getElementById("ccp-flow-cut"), prodTok, my, .9)) return;
    nRelease.classList.add("done");
    prodNarr.innerHTML = "Release branch triggers the CI/CD pipeline…";
