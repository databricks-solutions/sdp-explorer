  <div class="crumb">SDP Explorer <span class="sep">›</span> Change data capture <span class="sep">›</span> <b>AUTO CDC bitemporal</b></div>
  <h1><span class="verb">AUTO</span> CDC bitemporal</h1>
  <p class="oneliner">SCD Type 2 keeps one timeline. Bitemporal keeps <b>two</b> — so late or out-of-order data can correct history <em>without erasing what you believed before</em>.</p>

  <section>
    <h2>Two timelines, two questions</h2>
    <div class="grid2">
      <div class="box">
        <h3>1 · When was it actually true?</h3>
        <p><b>Business time.</b> A stock price changes on <b>Jan 1</b> — that's when the fact was true in the real world, no matter when the data shows up. Columns: <code class="kw">__START_AT</code> / <code class="kw">__END_AT</code>.</p>
      </div>
      <div class="box">
        <h3>2 · When did we learn it?</h3>
        <p><b>System time.</b> That change only lands in the pipeline on <b>Jan 5</b>. A report run on <b>Jan 3</b> used the old value — system time lets you reproduce exactly what that report saw. Columns: <code class="kw">__SYSTEM_START_AT</code> / <code class="kw">__SYSTEM_END_AT</code>.</p>
      </div>
    </div>
    <div class="note" style="margin-top:14px;"><span class="ic">ⓘ</span><p>That's the whole feature: a normal SCD 2 table answers only question 1. Bitemporal answers both — which is what auditing, regulatory reporting, and "why did we make that decision?" need.</p></div>
  </section>

  <section>
    <h2>Try it — the example from the docs</h2>
    <div class="tbl">
      <div class="tbl-head"><div class="name">Change feed</div><div class="sub">company A · all times on 2025-07-18</div></div>
      <div class="tbl-body" id="btFeed"></div>
    </div>
    <div style="height:14px"></div>
    <div class="tbl">
      <div class="tbl-head"><div class="name">Target — prices (bitemporal)</div><div class="sub">business validity + system awareness · superseded beliefs greyed</div></div>
      <div class="tbl-body" id="btTable" style="overflow-x:auto;"></div>
    </div>

    <div class="recon diff" id="btBanner"><span class="ic">≢</span><p id="btBannerText"></p></div>

    <div class="controls">
      <button id="btPrev" class="ghost">◀ Previous</button>
      <button id="btRun">▶ Apply next change</button>
      <button id="btReset" class="ghost">Reset</button>
    </div>
  </section>

  <section>
    <h2>The payoff — ask it a question</h2>
    <p class="oneliner" style="font-size:16px;margin-bottom:16px;">Click a question — the row in the table above that answers it lights up.</p>
    <div class="btq" id="btQs">
      <button data-q="0">What was the value at 12:10 — as we know it <b>now</b>?</button>
      <button data-q="1">What did we <b>believe</b> it was at 12:10 — back at 12:22?</button>
      <button data-q="2">Does company A still exist?</button>
    </div>
    <div class="bt-answer" id="btAnswer">The first two are the <em>same real-world moment</em> — watch the answer change.</div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">prices</span>;

<span class="c-key">CREATE FLOW</span> prices_cdc <span class="c-key">AS AUTO CDC INTO</span> <span class="c-tbl">prices</span>
<span class="c-key">FROM STREAM</span>(<span class="c-tbl">price_changes</span>)
<span class="c-key">KEYS</span> (company_id)
<span class="c-key">APPLY AS DELETE WHEN</span> op = <span class="c-str">'DELETE'</span>
<span class="c-key">SEQUENCE BY</span> business_time           <span class="c-dim">-- business (valid) time</span>
<span class="c-key">SYSTEM SEQUENCE BY</span> system_time      <span class="c-dim">-- system (ingest) time</span>
<span class="c-key">STORED AS BITEMPORAL</span>;</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>Bitemporal AUTO CDC is in <b>Beta</b>. It generates four temporal columns: <code class="kw">__START_AT</code> / <code class="kw">__END_AT</code> for business validity, and <code class="kw">__SYSTEM_START_AT</code> / <code class="kw">__SYSTEM_END_AT</code> for system awareness.</p></div>
  </section>

  <section>
    <h2>How it works</h2>
    <div class="insight">
      <span class="ic">◔</span>
      <p>On every change the engine <b>closes the old belief on the system axis</b> and <b>writes the corrected history stamped with the new system time</b>. Nothing is overwritten — the greyed rows are past beliefs, kept so you can reconstruct what the system thought at any moment.</p>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>You must audit <em>what you believed and when</em> — finance, risk, regulatory reporting.</li>
          <li>Source data is frequently restated or backdated, and decisions were made on stale values.</li>
          <li>You need to reproduce a past system state exactly (as-of-knowledge queries).</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li><b>Beta</b> — validate before production use.</li>
          <li>Both sequencing columns must be sortable; <code class="kw">NULL</code> sequencing values aren't supported.</li>
          <li>History grows on two axes — a single key can fan out into many rows; plan retention.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- ENZYME (incremental materialized-view refresh) ---------- */
function enzymeDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Incremental refresh <span class="sep">›</span> <b>Enzyme</b></div>
  <h1>Enzyme</h1>
  <p class="oneliner"><b>Enzyme</b> makes materialized-view refresh <em>incremental</em>: when new rows land, it recomputes only the affected groups instead of the whole result. Automatic on serverless — no API, no flag.</p>

  <section>
    <h2>See what it does</h2>
    <p style="color:var(--ink-2);font-size:14px;margin:-8px 0 18px;max-width:74ch;">Hit <b>Start</b> — only the groups a batch touches recompute; the rest stay frozen. Two moments to watch: a <b>brand-new region</b> (added as its own group), and a <b>wide batch</b> where Enzyme judges a <b>full refresh</b> cheaper and runs one instead (amber banner).</p>
    <div class="flow">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">orders</div>
          <div class="sub">incoming rows · source of the MV</div>
        </div>
        <div class="tbl-body"><div class="enz-stream gsap-rows" id="enzStream"><div class="enz-empty">Press Start to stream orders in.</div></div></div>
      </div>
      <div class="arrow" id="enzArrow">
        <span class="flow-tag">flow</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">sales_by_region</div>
          <div class="sub">materialized view · GROUP BY region</div>
        </div>
        <div class="tbl-body"><table class="enz-mv" id="enzMv"></table></div>
      </div>
    </div>

    <div class="controls">
      <button id="enzPlay">▶ Start demo</button>
      <button id="enzReset" class="ghost">Reset</button>
      <label style="font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;">Speed
        <select id="enzSpeed" style="font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);">
          <option value="1" selected>Slow</option>
          <option value="0.62">Normal</option>
          <option value="0.36">Fast</option>
        </select>
      </label>
      <span class="narr" id="enzNarr">An aggregate over <code class="kw">orders</code>. New orders only ever change the regions they belong to.</span>
    </div>

    <div class="recon diff" id="enzBanner"><span class="ic">◔</span><p id="enzBannerTxt"></p></div>

    <div class="vmeter">
      <div class="vh">Group recomputes · Enzyme vs full refresh</div>
      <div class="vrow"><span class="vlabel">Full refresh</span><div class="vtrack"><div class="vfill full" style="width:100%"></div></div><span class="vnum" id="enzFullNum">0 recomputes</span></div>
      <div class="vrow"><span class="vlabel">Enzyme</span><div class="vtrack"><div class="vfill rewind" id="enzFill" style="width:0"></div></div><span class="vnum" id="enzIncNum">0 recomputes</span></div>
      <div class="vsave" id="enzSave">5 groups in the MV · each batch touches only a few.</div>
      <div class="vnote">Cost estimate assumes each full refresh run costs ~$5; an incremental refresh is charged pro rata for the share of groups it recomputes.</div>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH MATERIALIZED VIEW</span> <span class="c-tbl">sales_by_region</span>
<span class="c-key">AS SELECT</span>
  region,
  <span class="c-key">count</span>(*)      <span class="c-key">AS</span> orders,
  <span class="c-key">sum</span>(amount) <span class="c-key">AS</span> revenue
<span class="c-key">FROM</span> <span class="c-tbl">orders</span>
<span class="c-key">GROUP BY</span> region;</div>
    </div>
    <div class="note">
      <span class="ic">ⓘ</span>
      <p><b>Nothing here turns Enzyme on.</b> It's not a clause or a setting — it's the cost model the pipeline runs every time this MV refreshes on serverless. The engine inspects what changed in <code class="kw">orders</code>, decides whether an incremental recompute is cheaper than a full one, and if so recomputes only the affected groups. Plain <code class="kw">count</code>/<code class="kw">sum</code> aggregates like this are the sweet spot.</p>
    </div>
  </section>

  <section>
    <h2>Why not recompute the whole view?</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>Full recompute</h3>
        <p>Every refresh re-scans <b>all</b> of <code class="kw">orders</code> and rebuilds <b>all 5 groups</b> — even when the new data only touched one or two. Cost scales with the size of the whole table, not with what changed.</p>
      </div>
      <div class="box good">
        <h3>Enzyme (incremental)</h3>
        <p>Tracks the changed rows, maps them to their groups, and recomputes <b>only those groups</b>. A batch that touches 2 of 5 regions costs ~2/5 of a full refresh — the untouched groups are served straight from the existing result.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>You materialize aggregates or joins over a large source where each refresh only touches a slice of the groups.</li>
          <li>New data is mostly <em>appended</em> (recent activity), so most groups are unchanged between refreshes.</li>
          <li>You want the simplicity of a declarative MV with the cost profile of an incremental job — no hand-written merge logic.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li><b>Serverless only</b> — Enzyme's incremental refresh doesn't run on classic compute; those MVs fall back to full recompute.</li>
          <li>The engine decides <em>per refresh</em>. If a change touches every group, or the query isn't incrementally maintainable, it falls back to a full rebuild — by design.</li>
          <li>The event log's <code class="kw">num_output_rows</code> reports the MV's <b>total</b> row count, not the rows recomputed — don't read it as the incremental work done.</li>
        </ul>
      </div>
    </div>
    <div class="note">
      <span class="ic">ⓘ</span>
      <p>Enzyme was introduced with Delta Live Tables (now Lakeflow Spark Declarative Pipelines) — see the announcement: <a href="https://www.databricks.com/blog/2022/06/29/delta-live-tables-announces-new-capabilities-and-performance-optimizations.html" target="_blank" rel="noopener">Delta Live Tables announces new capabilities and performance optimizations</a>.</p>
    </div>
  </section>
  `;
}

/* ---------- STREAMING TABLE ---------- */
function streamingTableDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Datasets <span class="sep">›</span> <b>Streaming Table</b></div>
  <h1><span class="verb">Streaming</span> Table</h1>
  <p class="oneliner">A <b>streaming table</b> ingests an unbounded source <em>incrementally</em>: each pipeline run reads only the rows that arrived since the last run and <b>appends</b> them — every row processed exactly once. A <b>checkpoint</b> remembers how far it got, so a restart resumes where it left off instead of reprocessing history. Step through the micro-batches and watch the checkpoint advance.</p>

  <section>
    <h2>Try it — advance the stream</h2>

    <div class="ck-badges">
      <span class="ck-badge">Checkpoint offset <b id="stCkpt">0</b></span>
      <span class="ck-badge">Rows in table <b id="stCount">0</b></span>
      <span class="ck-badge" id="stReadBadge">Read this run <b id="stRead">0</b></span>
    </div>

    <div class="flow">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">raw_events</div>
          <div class="sub">unbounded append-only source · Kafka / Auto Loader</div>
        </div>
        <div class="tbl-body gsap-rows" id="stSrc" style="min-height:300px;"></div>
      </div>
      <div class="arrow" id="stArrow">
        <span class="flow-tag">flow</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">events</div>
          <div class="sub">streaming table · append-only</div>
        </div>
        <div class="tbl-body gsap-rows" id="stTgt" style="min-height:300px;"></div>
      </div>
    </div>

    <div class="recon diff" id="stBanner"><span class="ic">◔</span><p id="stBannerTxt"></p></div>

    <div class="controls">
      <button id="stNext">▶ Run next micro-batch</button>
      <button id="stRestart" class="ghost">⟲ Simulate restart</button>
      <button id="stReset" class="ghost">Reset</button>
      <span class="narr" id="stNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">events</span>
<span class="c-key">AS SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">raw_events</span>);</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p><code class="kw">STREAM(...)</code> is what makes this incremental: the table consumes its source as a <b>stream</b>, appending only new rows each run. Drop <code class="kw">STREAM()</code> and you'd get a materialized view that recomputes from the full source instead. The engine manages the checkpoint for you — you never track offsets by hand.</p></div>
  </section>

  <section>
    <h2>Why not just re-read the source each run?</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>Batch re-read</h3>
        <p>Re-scans the <b>entire</b> source every run and you hand-write dedup logic to avoid double-counting. Cost grows with total history; late or replayed files easily produce duplicates.</p>
      </div>
      <div class="box good">
        <h3>Streaming table</h3>
        <p>Reads <b>only new rows</b> past the checkpoint, appends them, advances the offset — <b>exactly-once</b>. A restart resumes from the checkpoint, reprocessing nothing already committed.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Ingesting append-heavy sources — Kafka, event streams, files landing in cloud storage (Auto Loader).</li>
          <li>You want exactly-once, incremental ingestion without writing offset/dedup bookkeeping.</li>
          <li>Building the bronze/raw layer of a medallion pipeline.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>A source row is read <b>once</b> — changing the source query or expecting historical rows to re-flow needs a <b>full refresh</b> (which reprocesses everything).</li>
          <li>Streaming sources should be append-only; updates/deletes upstream aren't seen as changes (use <code class="kw">AUTO CDC</code> for that).</li>
          <li>The checkpoint is tied to the table's storage — don't hand-edit the underlying files.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- MATERIALIZED VIEW ---------- */
function materializedViewDemo() {
  return `

  <h1><span class="verb">Materialized</span> View</h1>
  <p class="oneliner">A <b>materialized view</b> stores the <em>result</em> of a query — an aggregate or join — as a real table, and refreshes to keep it in sync as the source changes. Query it like any table and get precomputed results instantly, instead of re-running the aggregation on every read. Step through source changes and watch the view stay fresh.</p>

  <a class="xref" href="#enzyme">
    <span class="ic">⚡</span>

  </a>

  <section>
    <h2>See what it does</h2>
    <div class="flow">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">orders</div>
          <div class="sub">new rows this refresh · source of the MV</div>

      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">revenue_by_category</div>
          <div class="sub">materialized view · GROUP BY category</div>
        </div>
        <div class="tbl-body"><table class="enz-mv" id="mvMv"></table></div>
      </div>
    </div>

    <div class="controls">
      <button id="mvNext">▶ Apply next change</button>
      <button id="mvReset" class="ghost">Reset</button>
      <span class="narr" id="mvNarr"></span>
    </div>

    <div class="recon diff" id="mvBanner"><span class="ic">◔</span><p id="mvBannerTxt"></p></div>
  </section>

  <section>
    <h2>The flow</h2>

<span class="c-key">AS SELECT</span>
  category,
  <span class="c-key">count</span>(*)      <span class="c-key">AS</span> orders,

<span class="c-key">FROM</span> <span class="c-tbl">orders</span>

  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>You serve an aggregate or join result repeatedly and want it kept fresh declaratively.</li>
          <li>The result is expensive to compute on the fly but changes only incrementally.</li>
          <li>You want gold-layer tables (rollups, dashboards) without hand-written refresh jobs.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Incremental refresh is <b>serverless-only</b>; classic compute falls back to full rebuilds.</li>
          <li>Not every query is incrementally maintainable — complex ones full-recompute by design.</li>
          <li>An MV reflects its source <em>as of the last refresh</em>, not live — mind the schedule/SLA.</li>

function appendFlowDemo() {

  <div class="crumb">SDP Explorer <span class="sep">›</span> Flows <span class="sep">›</span> <b>Append flow</b></div>
  <h1><span class="verb">Append</span> flow</h1>
  <p class="oneliner">An <b>append flow</b> lets <em>several independent sources</em> feed one streaming table. Each flow is defined and checkpointed separately, but they all append into the same union target. Use <code class="kw">FLOW … INSERT INTO</code> for continuous streams, and <code class="kw">ONCE</code> for a one-time backfill that runs a single time and then never again. Step through and watch the two continuous flows keep streaming while the backfill fires just once.</p>

  <section>
    <h2>Try it — advance the pipeline</h2>

    <div class="flow-multi">
      <div class="src-stack" id="afSources"></div>
      <div class="arrow" id="afArrow">
        <span class="flow-tag">flow</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">events</div>
          <div class="sub">one streaming table · union of every flow</div>
        </div>
        <div class="tbl-body gsap-rows" id="afTgt" style="min-height:320px;"></div>
      </div>
    </div>

    <div class="recon diff" id="afBanner"><span class="ic">◔</span><p id="afBannerTxt"></p></div>

    <div class="controls">
      <button id="afNext">▶ Next update</button>
      <button id="afReset" class="ghost">Reset</button>
      <span class="narr" id="afNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">events</span>;   <span class="c-dim">-- shared target</span>

<span class="c-dim">-- continuous flows: append every run, each checkpointed on its own</span>
<span class="c-key">CREATE FLOW</span> us_stream <span class="c-key">AS INSERT INTO</span> <span class="c-tbl">events</span> <span class="c-key">BY NAME</span>
<span class="c-key">SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">kafka_us</span>);

<span class="c-key">CREATE FLOW</span> eu_stream <span class="c-key">AS INSERT INTO</span> <span class="c-tbl">events</span> <span class="c-key">BY NAME</span>
<span class="c-key">SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">kafka_eu</span>);

<span class="c-dim">-- one-time backfill: runs a single time, then never again</span>
<span class="c-key">CREATE FLOW</span> backfill <span class="hl"><span class="c-key">AS INSERT INTO ONCE</span></span> <span class="c-tbl">events</span> <span class="c-key">BY NAME</span>
<span class="c-key">SELECT</span> * <span class="c-key">FROM</span> <span class="c-tbl">events_archive</span>;   <span class="c-dim">-- historical, bounded</span></div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p><code class="kw">INSERT INTO ONCE</code> marks the flow <b>complete</b> after its first successful run — subsequent pipeline updates skip it, so a bounded historical source is loaded exactly once and never re-appended. The continuous flows keep going. All flows must produce compatible schemas; <code class="kw">BY NAME</code> aligns columns.</p></div>
  </section>

  <section>
    <h2>Why one table, many flows?</h2>
    <div class="grid2">
      <div class="box good">
        <h3>Independent flows</h3>
        <p>Each source is its own flow with its own checkpoint. Add, remove, or backfill a source <b>without touching the others</b> or rebuilding the target.</p>
      </div>
      <div class="box good">
        <h3>One union target</h3>
        <p>Downstream consumers read a <b>single</b> <code class="kw">events</code> table. No manual <code class="kw">UNION</code>, no coordinating multiple writers — the pipeline serializes appends safely.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Unioning multiple streams (regions, tenants, topics) into one table.</li>
          <li>Backfilling history into a live streaming table <b>once</b> alongside ongoing ingestion (<code class="kw">ONCE</code>).</li>
          <li>You want to add a new source later without a full refresh of the target.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Append flows only <b>insert</b> — no updates/deletes (use <code class="kw">AUTO CDC</code> for those).</li>
          <li>A <code class="kw">ONCE</code> flow re-runs only on a full refresh of the target — otherwise it stays complete.</li>
          <li>All flows into one table must have compatible schemas; reconcile columns with <code class="kw">BY NAME</code>.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- EXPECTATIONS ---------- */
function expectationsDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Data quality <span class="sep">›</span> <b>Expectations</b></div>
  <h1>Expectations</h1>
  <p class="oneliner"><b>Expectations</b> are data-quality constraints you attach to a flow: a boolean rule plus what to do when a row breaks it. The <em>same</em> rule behaves very differently depending on the action — <code class="kw">WARN</code> lets bad rows through but counts them, <code class="kw">DROP</code> filters them out, and <code class="kw">FAIL</code> stops the whole update. Pick an action and run the same batch through each.</p>

  <section>
    <h2>Try it — run a batch through the constraint</h2>

    <div class="cdc-toggle" id="exToggle">
      <button data-mode="warn">ON VIOLATION WARN</button>
      <button data-mode="drop">DROP ROW</button>
      <button data-mode="fail">FAIL UPDATE</button>
    </div>
    <div class="cdc-mode-desc" id="exDesc"></div>

    <div class="flow" style="grid-template-columns:1fr 90px 1fr;">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">incoming batch</div>
          <div class="sub">rule: <code class="kw">amount &gt; 0</code></div>
        </div>
        <div class="tbl-body gsap-rows" id="exSrc" style="min-height:300px;"></div>
      </div>
      <div class="gate" id="exGate">
        <div class="g-ring" id="exRing">✓</div>
        <div class="g-lbl" id="exGateLbl">EXPECT</div>
      </div>
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">orders</div>
          <div class="sub" id="exTgtSub">rows that made it in</div>
        </div>
        <div class="tbl-body gsap-rows" id="exTgt" style="min-height:300px;"></div>
      </div>
    </div>

    <div class="chips" id="exChips" style="margin-top:16px;"></div>
    <div class="recon" id="exBanner"><span class="ic">⚠</span><p id="exBannerTxt"></p></div>

    <div class="controls">
      <button id="exRun">▶ Run batch</button>
      <button id="exReset" class="ghost">Reset</button>
      <span class="narr" id="exNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders</span>(
  <span class="hl"><span class="c-key">CONSTRAINT</span> valid_amount <span class="c-key">EXPECT</span> (amount &gt; <span class="c-num">0</span>)
    <span class="c-key">ON VIOLATION</span> DROP ROW</span>          <span class="c-dim">-- or: (omit) = WARN · FAIL UPDATE</span>
)
<span class="c-key">AS SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">raw_orders</span>);</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>Three actions on one rule: <b>WARN</b> (default, no <code class="kw">ON VIOLATION</code> clause) keeps the row and records the violation in metrics; <b>DROP ROW</b> discards violating rows but the update succeeds; <b>FAIL UPDATE</b> aborts the whole run so nothing commits. Metrics for every expectation land in the pipeline event log regardless of action.</p></div>
    <div class="note"><span class="ic">＋</span><p><b>Grouped &amp; portable rules:</b> in Python, <code class="kw">@dlt.expect_all</code> / <code class="kw">expect_all_or_drop</code> / <code class="kw">expect_all_or_fail</code> take a dict of many constraints at once. And expectations can now be <b>stored in a Unity Catalog table</b> and referenced by name, so the same version-controlled rule set is shared across pipelines instead of copy-pasted.</p></div>
  </section>

  <section>
    <h2>Choosing an action</h2>
    <div class="grid2">
      <div class="box">
        <h3>WARN — observe</h3>
        <p>Nothing is blocked; you get counts to monitor quality trends. Good for discovering how dirty a new source really is before you enforce anything.</p>
      </div>
      <div class="box">
        <h3>DROP / FAIL — enforce</h3>
        <p><b>DROP</b> keeps the good rows flowing while shedding bad ones. <b>FAIL</b> is the strict gate — one bad row stops the update, so nothing downstream sees partial/bad data.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Enforcing schema/business rules inline instead of a separate validation job.</li>
          <li>You want quality metrics per rule tracked automatically in the event log.</li>
          <li>Different rules deserve different severity — warn on some, drop or fail on others.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li><code class="kw">DROP</code> silently discards data — pair it with <b>quarantine</b> if you need to inspect what was rejected.</li>
          <li><code class="kw">FAIL</code> halts the entire update; a single bad row blocks all good rows in that run.</li>
          <li>Expectations flag rows but don't <em>fix</em> them — cleansing is still your query's job.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- QUARANTINE ---------- */
function quarantineDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Data quality <span class="sep">›</span> <b>Quarantine</b></div>
  <h1>Quarantine</h1>
  <p class="oneliner">Dropping bad rows throws them away. <b>Quarantine</b> keeps them: tag each row valid or invalid with an expectation, then fork the stream — good rows flow to the clean table, bad rows land in a <b>quarantine table</b> for inspection and later reprocessing. Nothing is lost. Run the batch and watch the stream split.</p>

  <section>
    <h2>Try it — fork the stream</h2>

    <div class="flow" style="grid-template-columns:1fr 70px 1.15fr;">
      <div class="tbl src-panel">
        <div class="tbl-head">
          <div class="name">incoming batch</div>
          <div class="sub">flag: <code class="kw">is_valid = amount &gt; 0 AND region IS NOT NULL</code></div>
        </div>
        <div class="tbl-body gsap-rows" id="qSrc" style="min-height:320px;"></div>
      </div>
      <div class="fork" id="qFork">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a3 3 0 0 0 3 3h9M18 8l4 4-4 4M6 15v6"/></svg>
        <div class="g-lbl">split on is_valid</div>
      </div>
      <div class="q-split">
        <div class="tbl q-clean">
          <div class="tbl-head"><div class="name">orders_clean</div><div class="sub">is_valid = true · flows downstream</div></div>
          <div class="tbl-body gsap-rows" id="qClean" style="min-height:120px;"></div>
        </div>
        <div class="tbl q-quar">
          <div class="tbl-head"><div class="name">orders_quarantine</div><div class="sub">is_valid = false · held for inspection</div></div>
          <div class="tbl-body gsap-rows" id="qQuar" style="min-height:120px;"></div>
        </div>
      </div>
    </div>

    <div class="chips" id="qChips" style="margin-top:16px;"></div>
    <div class="recon diff" id="qBanner"><span class="ic">◔</span><p id="qBannerTxt"></p></div>

    <div class="controls">
      <button id="qRun">▶ Run batch</button>
      <button id="qReset" class="ghost">Reset</button>
      <span class="narr" id="qNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-dim">-- 1. tag validity without dropping anything (WARN keeps every row)</span>
<span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders_tagged</span>(
  <span class="c-key">CONSTRAINT</span> valid <span class="c-key">EXPECT</span> (amount &gt; <span class="c-num">0</span> <span class="c-key">AND</span> region <span class="c-key">IS NOT NULL</span>)
)
<span class="c-key">AS SELECT</span> *,
  (amount &gt; <span class="c-num">0</span> <span class="c-key">AND</span> region <span class="c-key">IS NOT NULL</span>) <span class="c-key">AS</span> is_valid
<span class="c-key">FROM STREAM</span>(<span class="c-tbl">raw_orders</span>);

<span class="c-dim">-- 2. fork on the flag into two downstream tables</span>
<span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders_clean</span> <span class="c-key">AS</span>
  <span class="c-key">SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">orders_tagged</span>) <span class="c-key">WHERE</span> <span class="hl">is_valid</span>;

<span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">orders_quarantine</span> <span class="c-key">AS</span>
  <span class="c-key">SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">orders_tagged</span>) <span class="c-key">WHERE</span> <span class="hl"><span class="c-key">NOT</span> is_valid</span>;</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>The trick: use a <code class="kw">WARN</code> expectation (keeps every row) to compute an <code class="kw">is_valid</code> flag, then two streaming tables read the tagged stream and filter opposite sides of it. Bad rows are <b>retained</b> in <code class="kw">orders_quarantine</code>, not discarded — you can inspect them, fix upstream, and reprocess.</p></div>
  </section>

  <section>
    <h2>Quarantine vs a plain DROP</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>DROP ROW</h3>
        <p>Bad rows vanish. You get a count, but the <b>data itself is gone</b> — you can't inspect why it failed or replay it after a fix.</p>
      </div>
      <div class="box good">
        <h3>Quarantine</h3>
        <p>Bad rows are <b>captured</b> in their own table. Clean data keeps flowing, and you can audit, correct the source, and re-ingest the held rows later.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Rejected records still have value — you need to inspect, report on, or reprocess them.</li>
          <li>You can't afford to block good data, but can't silently lose bad data either.</li>
          <li>Compliance/audit requires a record of what was rejected and why.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>The quarantine table <b>grows</b> — set retention or a drain/reprocess routine.</li>
          <li>The validity rule lives in two places (flag + filters); keep them in sync, ideally via a shared expression.</li>
          <li>It's a pattern, not a keyword — there's no single <code class="kw">QUARANTINE</code> clause.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

  <section>

    <span class="c-key">workspace</span>: { <span class="c-key">host</span>: <span class="c-str">"https://canadacentral.cloud.databricks.com"</span> }
    <span class="c-key">run_as</span>: { <span class="c-key">service_principal_name</span>: <span class="c-str">"sp-ci-deployer"</span> }
  <span class="c-tbl">prod_ca_east</span>:
    <span class="c-key">mode</span>: <span class="c-tbl">production</span>
    <span class="c-key">variables</span>: { <span class="c-key">catalog</span>: <span class="c-str">prod_ca</span> }
    <span class="c-key">workspace</span>: { <span class="c-key">host</span>: <span class="c-str">"https://canadaeast.cloud.databricks.com"</span> }
    <span class="c-key">run_as</span>: { <span class="c-key">service_principal_name</span>: <span class="c-str">"sp-ci-deployer"</span> }</div>
    </div>
    <div class="note">
      <span class="ic">ⓘ</span>
      <p><b>Set <code class="kw">mode</code> explicitly.</b> Omitting it is <em>not</em> the same as <code class="kw">development</code> — an unset target deploys with production semantics (no name prefix, schedules unpaused). <code class="kw">development</code> is what isolates each engineer in a shared dev workspace; <code class="kw">production</code> is what makes prod deterministic.</p>
    </div>
  </section>

  <section>
    <h2>The prod pipeline — deploy on release, off Git</h2>
    <div class="code-card">
      <div class="bar">.github/workflows/release.yml</div>
<div class="sql"><span class="c-key">on</span>:
  <span class="c-key">push</span>:
    <span class="c-key">branches</span>: [<span class="c-str">"release/**"</span>]      <span class="c-dim"># prod deploys are triggered by a release branch, never a laptop</span>

<span class="c-key">jobs</span>:
  <span class="c-tbl">deploy-prod</span>:
    <span class="c-key">runs-on</span>: ubuntu-latest
    <span class="c-key">steps</span>:
      - <span class="c-key">uses</span>: databricks/setup-cli@main
      - <span class="c-key">run</span>: databricks bundle validate <span class="c-key">-t</span> prod   <span class="c-dim"># ① gate: fail the run, not prod</span>
      - <span class="c-key">run</span>: databricks bundle deploy   <span class="c-key">-t</span> prod   <span class="c-dim"># ② deploy as sp-ci-deployer</span>
      - <span class="c-key">run</span>: databricks bundle run sales_etl <span class="c-key">-t</span> prod  <span class="c-dim"># ③ start the update</span>
    <span class="c-key">env</span>: { <span class="c-key">DATABRICKS_TOKEN</span>: <span class="c-str">"\${{ secrets.SP_TOKEN }}"</span> }</div>
    </div>
    <div class="note">
      <span class="ic">↺</span>
      <p><b>Rollback is a Git operation.</b> Prod state is exactly the bundle at the deployed commit. To roll back you <code class="kw">git revert</code> (or re-point the release branch at the last good tag) and let the <em>same</em> pipeline redeploy it — no manual surgery in prod, no drift, fully auditable.</p>
    </div>
  </section>

  <section>
    <h2>Why deploy this way</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>Click-ops in prod</h3>
        <p>Editing pipelines by hand in the prod UI leaves no history, drifts from source, and can't be reproduced. A bad change means a stressful manual undo — if you can even remember what changed.</p>
      </div>
      <div class="box good">
        <h3>Bundle + CI/CD</h3>
        <p>One artifact, deployed by an automated pipeline behind a validate gate. Every prod change is a reviewed commit; rollback is <code class="kw">git revert</code> + redeploy. Dev and prod share the same definition, so "works in dev" means it.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>More than one person touches the pipeline, or it runs anything that matters in prod.</li>
          <li>You want dev iteration to stay fast (deploy from CLI, workspace, or a branch) without risking prod.</li>
          <li>You need reproducible, auditable prod deploys and a rollback story that isn't "hope."</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Set <code class="kw">mode</code> on every target — an unset target inherits production semantics, not dev.</li>
          <li>Prod should deploy as a <b>service principal</b>, not a person; scope its token tightly.</li>
          <li>The validate gate only catches config errors — pair it with data-quality expectations for runtime safety.</li>
          <li>Bundle state is per-target; deploying the same bundle to a new workspace creates new resources, it doesn't adopt existing ones.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- REAL-TIME MODE ---------- */
function realTimeModeDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Streaming <span class="sep">›</span> <b>Real-time mode</b></div>
  <h1><span class="verb">Real-time</span> mode</h1>
  <p class="oneliner">A normal streaming flow commits in <em>micro-batches</em>: a record can't leave the pipeline until the next batch boundary, so its latency is however long it waited for that tick. <b>Real-time mode</b> removes the boundary — each record is processed and emitted as it arrives, taking end-to-end latency from <em>seconds</em> to <em>milliseconds</em>. Start the stream and watch the same events race down both lanes.</p>

  <section>
    <h2>See what it does — a latency race</h2>
    <div class="stage">
      <div class="rt-lanes">
        <div class="rt-lane mb">
          <div class="rt-lhead"><span class="rt-name">Micro-batch <span class="rt-sub">default · commits on the trigger tick</span></span><span class="rt-lat" id="rtMBLat">avg —</span></div>
          <div class="rt-track" id="rtMBTrack">
            <div class="rt-gate" id="rtGate"><span class="gl">batch tick</span></div>
            <div class="rt-zone" id="rtMBZone"><span class="zt">committed</span><span class="zn" id="rtMBN">0</span></div>
          </div>
        </div>
        <div class="rt-lane rt">
          <div class="rt-lhead"><span class="rt-name">Real-time mode <span class="rt-sub">pipelines.trigger = "RealTime"</span></span><span class="rt-lat" id="rtRTLat">avg —</span></div>
          <div class="rt-track" id="rtRTTrack">
            <div class="rt-zone" id="rtRTZone"><span class="zt">committed</span><span class="zn" id="rtRTN">0</span></div>
          </div>
        </div>
      </div>

      <div class="recon diff" id="rtVerdict"><span class="ic">◔</span><p id="rtVerdictTxt"></p></div>
    </div>

    <div class="controls">
      <button id="rtStart">▶ Start stream</button>
      <button id="rtReset" class="ghost">Reset</button>
      <label style="font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;">Speed
        <select id="rtSpeed" style="font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);">
          <option value="1.5" selected>Slow</option>
          <option value="0.95">Normal</option>
          <option value="0.55">Fast</option>
        </select>
      </label>
      <span class="narr" id="rtNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">Python</div>
<div class="sql"><span class="c-dim"># pipeline setting — turn the whole pipeline real-time</span>
<span class="c-tbl">pipelines.trigger</span> = <span class="c-str">"RealTime"</span>     <span class="c-dim"># requires continuous execution + a sink target</span>

<span class="c-key">import</span> dlt

<span class="c-key">@dlt.update_flow</span>(target=<span class="c-str">"live_metrics"</span>)   <span class="c-dim"># "update" output mode — no watermark needed</span>
<span class="c-key">def</span> <span class="c-fn">stream_orders</span>():
  <span class="c-key">return</span> (
    spark.readStream.table(<span class="c-str">"orders"</span>)
      .groupBy(<span class="c-str">"region"</span>)
      .agg(sum(<span class="c-str">"amount"</span>).alias(<span class="c-str">"revenue"</span>))
  )</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>Real-time mode runs on a <b>continuous</b> pipeline and writes to a <b>sink</b> (see the Sinks card). It uses <code class="kw">update</code> output mode, so stateful aggregations emit on every record <em>without</em> a watermark. It's a <b>Public Preview</b> on the preview channel — reach for it only when milliseconds actually matter.</p></div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Sub-second, per-record latency is a hard requirement — fraud scoring, live ops dashboards, alerting.</li>
          <li>You're already continuous and writing to a sink (Kafka, Event Hubs, Delta).</li>
          <li>Downstream consumers act on individual events, not batches.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Always-on compute costs more than triggered micro-batches — use it where latency earns its keep.</li>
          <li>Requires continuous mode + a sink; not every operator/source is supported.</li>
          <li>Public Preview on the preview channel — validate your workload before depending on it.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- SINKS ---------- */
function sinksDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Flows <span class="sep">›</span> <b>Sinks</b></div>
  <h1><span class="verb">Sink</span> — write out</h1>
  <p class="oneliner">Every other flow writes <em>into</em> a pipeline table. A <b>sink</b> is the one flow that writes <em>out</em> — pushing records from your pipeline to an external system like Apache Kafka, Azure Event Hubs, or a Delta table. Only an <code class="kw">append_flow</code> can target a sink, and it's append-only. Step the stream and watch records leave the lakehouse.</p>

  <section>
    <h2>See what it does</h2>
    <div class="cdc-toggle" id="skToggle" style="margin-bottom:14px;">
      <button data-fmt="kafka" class="active">Kafka</button>
      <button data-fmt="eventhubs">Event Hubs</button>
      <button data-fmt="delta">Delta</button>
    </div>

    <div class="flow">
      <div class="tbl">
        <div class="tbl-head">
          <div class="name">events</div>
          <div class="sub" id="skSrcSub">pipeline streaming table · offset 0</div>
        </div>
        <div class="tbl-body gsap-rows" id="skSrc" style="min-height:230px;"></div>
      </div>
      <div class="arrow" id="skArrow">
        <span class="flow-tag" id="skFlowTag">append_flow</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="sink-panel">
        <div class="sh"><span class="nm" id="skSinkName">orders_topic</span><span class="badge" id="skSinkBadge">kafka</span></div>
        <div class="sink-body gsap-rows" id="skSink" style="min-height:230px;"></div>
      </div>
    </div>

    <div class="recon" id="skBanner"><span class="ic">◆</span><p id="skBannerTxt"></p></div>

    <div class="controls">
      <button id="skNext">▶ Next micro-batch</button>
      <button id="skRefresh" class="ghost" disabled>⟲ Full refresh</button>
      <button id="skReset" class="ghost">Reset</button>
      <span class="narr" id="skNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">Python</div>
<div class="sql"><span class="c-key">import</span> dlt

dlt.<span class="c-fn">create_sink</span>(
  name = <span class="c-str">"orders_sink"</span>,
  <span class="hl">format = <span class="c-str" id="skFmtStr">"kafka"</span></span>,
  options = <span id="skOpts">{ <span class="c-str">"kafka.bootstrap.servers"</span>: <span class="c-str">"..."</span>, <span class="c-str">"topic"</span>: <span class="c-str">"orders"</span> }</span>,
)

<span class="c-key">@dlt.append_flow</span>(name = <span class="c-str">"to_sink"</span>, target = <span class="c-str">"orders_sink"</span>)
<span class="c-key">def</span> <span class="c-fn">publish</span>():
  <span class="c-key">return</span> spark.readStream.table(<span class="c-str">"events"</span>)   <span class="c-dim"># append-only into the sink</span></div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p><b>Append flow is the only flow type allowed into a sink</b> — a sink is write-only, so there's no merge, no CDC, no replace. Formats: <code class="kw">kafka</code>, <code class="kw">eventhubs</code>, or <code class="kw">delta</code> (by <code class="kw">path</code> or <code class="kw">tableName</code>). A custom Python data source is also supported.</p></div>
  </section>

  <section>
    <h2>The full-refresh gotcha</h2>
    <div class="grid2">
      <div class="box bad">
        <h3>Sinks aren't reset</h3>
        <p>A full refresh rebuilds the pipeline's tables and replays the append flow from the start — but the <b>external sink is never truncated</b>. Everything gets re-emitted on top of what's already there, so downstream sees <b>duplicates</b>.</p>
      </div>
      <div class="box good">
        <h3>Design for it</h3>
        <p>Make consumers idempotent (dedupe on a key), or truncate/rotate the sink target yourself before a full refresh. Treat the sink as an at-least-once outbound stream, not a managed table.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Downstream systems (Kafka topics, Event Hubs, external Delta) must be fed <em>from</em> the pipeline.</li>
          <li>You want one governed pipeline to both land data in UC and publish it out.</li>
          <li>Real-time mode needs a sink target for its low-latency output.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Append-only and at-least-once — the sink is not truncated on full refresh, so plan for duplicates.</li>
          <li>Only <code class="kw">append_flow</code> writes to a sink; no CDC/merge/replace semantics.</li>
          <li>Sink state lives outside UC — you own its retention, schema, and cleanup.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}
function rowFiltersMasksDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Governance <span class="sep">›</span> <b>Row filters &amp; masks</b></div>
  <h1><span class="verb">Row filters</span> &amp; column masks</h1>
  <p class="oneliner">There's only <em>one copy</em> of the data. Unity Catalog <b>row filters</b> and <b>column masks</b> are applied at query time, per viewer — so an analyst without the right grants sees masked PII and only the rows their policy allows, while an admin sees everything. The new part for pipelines: these policies are now <b>preserved across pipeline updates and schema evolution</b>. Switch the viewer and watch the same table change.</p>

  <section>
    <h2>See what it does</h2>
    <div class="cdc-toggle" id="rfToggle" style="margin-bottom:6px;">
      <button data-v="admin" class="active">Admin — full access</button>
      <button data-v="analyst">Analyst — region = CA, no UNMASK</button>
    </div>
    <div class="chips" id="rfChips"></div>

    <div class="rf-table">
      <div class="rf-head">
        <span class="c-cust">customer</span>
        <span>email <span class="rf-pol mask" id="rfPolEmail">MASK</span></span>
        <span>ssn <span class="rf-pol mask" id="rfPolSsn">MASK</span></span>
        <span>region <span class="rf-pol filter" id="rfPolRegion">ROW FILTER</span></span>
      </div>
      <div class="rf-rows gsap-rows" id="rfRows"></div>
    </div>

    <div class="insight"><span class="ic">◔</span><p id="rfInsight"></p></div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-dim">-- 1. define the policy functions once (Unity Catalog)</span>
<span class="c-key">CREATE FUNCTION</span> <span class="c-tbl">mask_email</span>(e STRING) <span class="c-key">RETURN</span>
  <span class="c-key">CASE WHEN</span> is_account_group_member(<span class="c-str">'pii_readers'</span>) <span class="c-key">THEN</span> e
       <span class="c-key">ELSE</span> concat(left(e,<span class="c-num">1</span>), <span class="c-str">'•••@•••••'</span>) <span class="c-key">END</span>;

<span class="c-key">CREATE FUNCTION</span> <span class="c-tbl">ca_only</span>(region STRING) <span class="c-key">RETURN</span>
  is_account_group_member(<span class="c-str">'admins'</span>) <span class="c-key">OR</span> region = <span class="c-str">'CA'</span>;

<span class="c-dim">-- 2. attach them to the pipeline's streaming table / materialized view</span>
<span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">customers</span> (
  <span class="hl">email STRING <span class="c-key">MASK</span> <span class="c-tbl">mask_email</span></span>,
  ssn STRING <span class="c-key">MASK</span> <span class="c-tbl">mask_ssn</span>,
  <span class="hl"><span class="c-key">ROW FILTER</span> <span class="c-tbl">ca_only</span> <span class="c-key">ON</span> (region)</span>
) <span class="c-key">AS SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">raw_customers</span>);</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>Historically DLT/pipeline tables <b>couldn't</b> carry row filters or column masks — that limitation was lifted. The policies survive pipeline updates and schema evolution, so governance doesn't break every time the pipeline re-runs. Requires Unity Catalog.</p></div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>One table serves many audiences and PII must be masked for most of them.</li>
          <li>Row-level tenancy — each team/region should see only its slice.</li>
          <li>You want governance defined once in UC, not re-implemented per consumer or per view.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Policies are enforced at query time — the underlying table still holds the full data (grant table access carefully).</li>
          <li>Filter/mask functions run on every read; keep them cheap.</li>
          <li>Requires Unity Catalog; test that the intended groups actually get the intended view.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}
function liquidClusteringDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Datasets <span class="sep">›</span> <b>Liquid clustering</b></div>
  <h1><span class="verb">Liquid</span> clustering</h1>
  <p class="oneliner">A table is stored as many data files. <b>Liquid clustering</b> co-locates rows with similar key values into the same files, so a filtered query can <em>skip</em> files that can't contain matches (using each file's min/max stats). <code class="kw">CLUSTER BY AUTO</code> lets Databricks pick and adapt the keys for you. Same query, same data — watch how many files it actually has to read.</p>

  <section>
    <h2>See what it does — run <code class="kw" style="font-size:.95em">WHERE region = 'CA'</code></h2>
    <div class="cdc-toggle" id="lcToggle" style="margin-bottom:12px;">
      <button data-mode="none" class="active">Unclustered</button>
      <button data-mode="by">CLUSTER BY (region)</button>
      <button data-mode="auto">CLUSTER BY AUTO</button>
    </div>

    <div class="lc-stats">
      <div class="lc-stat"><div class="v" id="lcScanned">—</div><div class="k">files scanned</div></div>
      <div class="lc-stat"><div class="v" id="lcSkipped">—</div><div class="k">data skipped</div></div>
      <div class="lc-stat"><div class="v" id="lcRows">—</div><div class="k">rows read</div></div>
    </div>

    <div class="lc-grid" id="lcGrid"></div>

    <div class="controls">
      <button id="lcRun">▶ Run query</button>
      <button id="lcReset" class="ghost">Reset</button>
      <span class="narr" id="lcNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">SQL</div>
<div class="sql"><span class="c-key">CREATE OR REFRESH STREAMING TABLE</span> <span class="c-tbl">sales</span>
<span class="hl"><span class="c-key">CLUSTER BY</span> (region)</span>          <span class="c-dim">-- or: CLUSTER BY AUTO  (Databricks chooses &amp; adapts the keys)</span>
<span class="c-key">AS SELECT</span> * <span class="c-key">FROM STREAM</span>(<span class="c-tbl">raw_sales</span>);</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p><code class="kw">CLUSTER BY</code> is mutually exclusive with <code class="kw">PARTITIONED BY</code> — and generally preferred: no rigid directory layout, no small-file blow-up on high-cardinality keys, and it's incremental. <code class="kw">CLUSTER BY AUTO</code> observes query patterns and re-clusters over time, so you don't have to pick keys up front. Works on streaming tables, materialized views, and AUTO CDC targets.</p></div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>Queries filter or join on a few columns and you want files pruned by those columns.</li>
          <li>Partitioning would create too many small files (high-cardinality keys).</li>
          <li>You'd rather not commit to a fixed layout — let <code class="kw">AUTO</code> adapt as access patterns change.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Skipping only helps queries that filter on the clustering keys — pick keys that match real access patterns.</li>
          <li>Clustering is best-effort layout, not partitioning — don't rely on it for isolation or retention boundaries.</li>
          <li>Newly written data is clustered incrementally; a big backfill may need <code class="kw">OPTIMIZE</code> to fully settle.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}
function privateDatasetsDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Datasets <span class="sep">›</span> <b>Private datasets</b></div>
  <h1><span class="verb">Private</span> datasets</h1>
  <p class="oneliner">Not every dataset in a pipeline should be a product. A <b>private</b> streaming table or a <b>temporary</b> view is an intermediate step in the DAG: it's computed and read <em>inside</em> the pipeline, but never published to Unity Catalog, so nothing outside can query it. Click each node and try to read it from the outside.</p>

  <section>
    <h2>See what it does — click a node, query it from outside</h2>
    <div class="pd-dag" id="pdDag">
      <div class="pd-node published" data-id="orders_raw" data-kind="pub"><div class="pd-kind">streaming table · published</div><div class="pd-nm">orders_raw</div></div>
      <div class="pd-edge">→</div>

<span class="c-key">AS SELECT</span> region, <span class="c-key">sum</span>(amount) <span class="c-key">FROM</span> <span class="c-tbl">orders_clean</span> <span class="c-key">GROUP BY</span> region;</div>

function watermarksDemo() {
  return `
  <div class="crumb">SDP Explorer <span class="sep">›</span> Streaming <span class="sep">›</span> <b>Watermarks</b></div>
  <h1><span class="verb">Watermarks</span></h1>
  <p class="oneliner">A windowed streaming aggregation has to keep each window's running state in memory. Without a bound, that state grows forever. A <b>watermark</b> says "I won't wait for data older than this" — it tracks the latest event time minus an allowed delay, <em>closes</em> windows once it passes them (freeing their state), and <em>drops</em> events that arrive too late. Step events in — some out of order — and watch state stay bounded.</p>

  <section>
    <h2>See what it does — 10-min windows, 5-min allowed lateness</h2>
    <div class="stage">
      <div class="wm-axis" id="wmAxis"></div>
      <div class="chips" id="wmChips"></div>
      <div class="insight"><span class="ic">◔</span><p id="wmInsight">Each event is stamped with its <b>event time</b>. Accepted events count into their window; the watermark advances with the latest event time seen.</p></div>
    </div>

    <div class="controls">
      <button id="wmNext">▶ Next event</button>
      <button id="wmReset" class="ghost">Reset</button>
      <span class="narr" id="wmNarr"></span>
    </div>
  </section>

  <section>
    <h2>The flow</h2>
    <div class="code-card">
      <div class="bar">Python</div>
<div class="sql">(spark.readStream.table(<span class="c-str">"events"</span>)
  <span class="hl">.withWatermark(<span class="c-str">"event_time"</span>, <span class="c-str">"5 minutes"</span>)</span>   <span class="c-dim"># allowed lateness</span>
  .groupBy(window(<span class="c-str">"event_time"</span>, <span class="c-str">"10 minutes"</span>), <span class="c-str">"region"</span>)
  .count())</div>
    </div>
    <div class="note"><span class="ic">ⓘ</span><p>The watermark = <b>max event time seen − allowed lateness</b>. Once it passes a window's end, that window is finalized and its state is dropped, so memory stays bounded no matter how long the stream runs. Events older than the watermark are <b>dropped</b> — a bigger delay tolerates more lateness but holds more state. Watermarks are required for stateful ops (windowed aggregates, stream-stream joins) to run safely in a pipeline.</p></div>
  </section>

  <section>
    <h2>When to leverage it</h2>
    <div class="grid2">
      <div>
        <div class="col-h">Reach for it when</div>
        <ul class="clean">
          <li>You do windowed aggregations or stream-stream joins on event time.</li>
          <li>Data can arrive out of order, and you need a principled cutoff for "too late".</li>
          <li>A long-running stream must keep memory/state bounded.</li>
        </ul>
      </div>
      <div>
        <div class="col-h">Watch out</div>
        <ul class="clean watch">
          <li>Events later than the watermark are silently dropped — size the delay to your real lateness, and monitor drops.</li>
          <li>Too large a delay defeats the purpose: state (and cost) grows.</li>
          <li>Real-time mode's stateful aggregations are the exception — they emit without waiting on a watermark.</li>
        </ul>
      </div>
    </div>
  </section>
  `;
}

/* ---------- REPLACE WHERE animation wiring (GSAP showcase) ---------- */
function wireReplaceWhere() {
  // contiguous daily partitions ending today; predicate date >= current_date() - 7 = last 7 days
  const today = new Date(); today.setHours(0,0,0,0);
  const pad2 = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const dayOff = o => { const d = new Date(today); d.setDate(d.getDate() + o); return d; };
  const regions = ["ON · web", "BC · web", "QC · store", "AB · store"];
  const OFFS = [-30, -14, -2, -1, 0];   // a couple of older partitions + the last few days
  const inWindow = o => o >= -7;        // matched by date >= current_date() - 7 (last 7 days)
  const tgtInitial = OFFS.map((o,i) => ({
    day: iso(dayOff(o)),
    label: regions[i % regions.length],
    amt: 1000 + ((i * 83) % 380),
    cls: inWindow(o) ? "target" : "keep",
  }));
  const srcRows = OFFS.filter(inWindow).map(o => {
    const i = OFFS.indexOf(o);
    return { day: iso(dayOff(o)), label: regions[i % regions.length], amt: 1000 + ((i * 83) % 380) + 75 };
  });
  const windowStart = iso(dayOff(-7));

  const srcBody = document.getElementById("srcBody");
  const tgtBody = document.getElementById("tgtBody");
  const narr = document.getElementById("narr");
  const arrow = document.getElementById("arrow");
  const playBtn = document.getElementById("play");
  const resetBtn = document.getElementById("reset");

  function rowEl(r, cls, tagTxt, tagCls) {
    const el = document.createElement("div");
    el.className = "row " + cls;
    el.innerHTML = `<span class="part">${r.day}</span>
      <span class="label">${r.label} <span class="tag ${tagCls}">${tagTxt}</span></span>
      <span class="amt">$${r.amt.toLocaleString()}</span>`;
    return el;
  }

  let run = 0;                       // bumped on every reset; stale plays bail out
  const live = my => my === run;
  const pause = s => gsap.to({}, { duration: s });

  function reset() {
    run++;
    gsap.killTweensOf([...srcBody.children, ...tgtBody.children]);
    document.querySelectorAll(".fly-clone").forEach(c => c.remove());
    document.getElementById("rwToday").textContent = `Streaming table · today = ${iso(today)}`;
    srcBody.replaceChildren(...srcRows.map(r => rowEl(r, "src", "recomputed", "src")));
    tgtBody.replaceChildren(...tgtInitial.map(r =>
      rowEl(r, r.cls, r.cls === "keep" ? "outside window" : "in last 7 days", r.cls)));
    arrow.classList.remove("live");
    narr.innerHTML = "Predicate <code class='kw'>date >= date_add(current_date(), -7)</code> covers the last 7 days. Run the refresh to restate only that slice.";
    playBtn.disabled = false;
  }

  async function play() {
    reset();
    const my = run;
    playBtn.disabled = true;

    // 1 — the engine selects the predicate-matched slice: matched rows pulse
    await pause(.35); if (!live(my)) return;
    arrow.classList.add("live");
    narr.innerHTML = "Engine applies the predicate to the target — the last-7-days rows are selected, older partitions stay frozen.";
    const matched = [...tgtBody.querySelectorAll(".row.target")];
    await gsap.fromTo(matched, { scale: 1 }, {
      scale: 1.025, duration: .3, yoyo: true, repeat: 3, stagger: .06, ease: "sine.inOut",
    });
    if (!live(my)) return;

    // 2 — matched rows are deleted: slide out + collapse, rows below glide up in the same tween
    narr.innerHTML = "Matched rows are deleted from <code class='kw'>orders_enriched</code>…";
    await anim(matched, {
      opacity: 0, x: 42, height: 0,
      paddingTop: 0, paddingBottom: 0, marginTop: 0, marginBottom: 0,
      borderTopWidth: 0, borderBottomWidth: 0,
      duration: .5, stagger: .09, ease: EASE.in,
    });
    if (!live(my)) return;
    matched.forEach(el => el.remove());

    // 3 — recomputed rows fly from the source panel into the target, staggered
    narr.innerHTML = "…the source query is recomputed for that range and the fresh rows fly in — <b>one atomic commit</b>.";
    const newEls = srcRows.map(r => rowEl(r, "src", "inserted", "src"));
    newEls.forEach(el => { gsap.set(el, { opacity: 0 }); tgtBody.appendChild(el); });
    const srcEls = [...srcBody.children];
    await Promise.all(newEls.map(async (el, i) => {
      await pause(i * .18); if (!live(my)) return;
      anim(srcEls[i], { opacity: .3, filter: "saturate(.4)", duration: .45 });
      await flyRow(srcEls[i], el); if (!live(my)) return;
      gsap.from(el, { scale: .96, duration: .3, ease: EASE.pop });
    }));
    if (!live(my)) return;

    await pause(1.1); if (!live(my)) return;
    arrow.classList.remove("live");
    narr.innerHTML = `Done — only the last-7-days slice changed. History before ${windowStart} was never rewritten.`;
    playBtn.disabled = false;
  }

  playBtn.addEventListener("click", play);
  resetBtn.addEventListener("click", reset);
  reset();
}

/* ---------- REWIND & REPLAY — interactive ---------- */
function wireRewindReplay() {
  const N = 15;            // 15 daily batches, indices 0..14
  const BUG = 12;          // bad commit landed between Jan 14 and Jan 15 → indices >=12 corrupted (Jan 15–17)
  const LABELW = 132;      // must match --lane-label
  const correct = [1240, 980, 1310, 1105, 1420, 1290, 1175, 1360, 1230, 1450, 1380, 1120, 1290, 1340, 1410];
  const bad = correct.map((v,i) => i >= BUG ? Math.round(v * 1.9) : v); // inflated where i>=BUG
  // source event volume — STEADY ~100/day, no spike even where target is corrupted
  const events = [104, 98, 110, 101, 107, 99, 112, 103, 108, 100, 106, 97, 111, 102, 109];
  // dates anchored on today: batch i = N-1 is today, earlier batches count back day by day
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2, "0");
  const dateAt = i => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (N - 1 - i)); return d; };
  const dnum  = i => pad(dateAt(i).getDate());                                   // day-of-month tick
  const isoAt = i => { const d = dateAt(i); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const shortAt = i => { const d = dateAt(i); return `${MON[d.getMonth()]} ${d.getDate()}`; };
  const fmt = v => "$" + (v/1000).toFixed(2) + "k";

  let speedMul = 1;

  const grid   = document.getElementById("rrGrid");
  const band   = document.getElementById("rrBand");
  const bug     = document.getElementById("rrBug");
  const ruler  = document.getElementById("rrRuler");
  const fill   = document.getElementById("rrFill");
  const handle = document.getElementById("rrHandle");
  const axis   = document.getElementById("rrAxis");
  const srcT   = document.getElementById("rrSrc");
  const tgtT   = document.getElementById("rrTgt");
  const ckpt   = document.getElementById("rrCkpt");
  const codeB  = document.getElementById("rrCode");
  const chips  = document.getElementById("rrChips");
  const steps  = [1,2,3].map(n => document.getElementById("rrStep"+n));
  const runBtn = document.getElementById("rrRun");
  const resetBtn = document.getElementById("rrReset");
  const narr   = document.getElementById("rrNarr");
  const rewindFill = document.getElementById("rrRewindFill");
  const rewindNum  = document.getElementById("rrRewindNum");
  const fullNum = document.getElementById("rrFullNum");
  const saveEl = document.getElementById("rrSave");
  const REFRESH_COST = 5;   // assumed $ cost of one full refresh run
  const usd = v => "$" + v.toFixed(2);
  fullNum.innerHTML = `<span class="vcost">${usd(REFRESH_COST)}</span>`;

  // build cells — x-axis shows dates
  axis.innerHTML = Array.from({length:N}, (_,i)=>`<div class="tick">${dnum(i)}</div>`).join("");
  srcT.innerHTML = Array.from({length:N}, (_,i)=>`<div class="cell src-cell consumed" id="rrS${i}">${events[i]}</div>`).join("");
  tgtT.innerHTML = Array.from({length:N}, (_,i)=>`<div class="cell tgt-cell" id="rrT${i}"></div>`).join("");

  const speedSel = document.getElementById("rrSpeed");
  speedMul = parseFloat(speedSel.value);
  speedSel.addEventListener("change", () => { speedMul = parseFloat(speedSel.value); });

  // bug marker fixed at fraction BUG/N
  const fbug = BUG / N;
  bug.style.left = `calc(${LABELW}px + ${fbug} * (100% - ${LABELW}px))`;
  bug.style.bottom = "6px";

  // dynamic, today-anchored labels
  document.getElementById("rrDateLabel").textContent = `Date · ${shortAt(0)} – ${shortAt(N-1)}`;
  document.getElementById("rrInsight").innerHTML =
    `<b>Source events held steady (~100/day)</b> through ${shortAt(N-1)} — but target revenue nearly <b>doubled</b> from ${shortAt(BUG)} on. The inputs didn't spike; the <b>code</b> did. That's the tell-tale of a bad commit — and exactly what replaying the same source through fixed code corrects.`;

  let k = 12;       // rewind point: rewound indices are i >= k (default captures all corruption)
  let busy = false, done = false;

  function setBand() {
    const f = k / N;
    band.style.left = `calc(${LABELW}px + ${f} * (100% - ${LABELW}px))`;
    handle.style.left = (f * 100) + "%";
    fill.style.width = (f * 100) + "%";
  }

  // target cell state. Corrupted = i>=BUG. Rewound region = i>=k.
  // After replay: rewound region corrected; corrupted rows BEFORE T are never touched → stay wrong.
  function renderTarget(replayed) {
    for (let i=0;i<N;i++){
      const el = document.getElementById("rrT"+i);
      let cls, val;
      if (i >= k) {
        if (replayed) { cls = "good replayed"; val = correct[i]; }
        else if (i >= BUG) { cls = "bad"; val = bad[i]; }
        else { cls = "kept"; val = correct[i]; }
      } else { // before T — untouched by rewind
        if (i >= BUG) { cls = "bad"; val = bad[i]; }   // leftover corruption
        else { cls = "kept"; val = correct[i]; }
      }
      el.className = "cell tgt-cell " + cls;
      el.innerHTML = `<span class="bn">${dnum(i)}</span>${fmt(val)}`;
    }
  }

  function renderChips() {
    const reproc = N - k;
    const remaining = Math.max(0, Math.min(k, N) - BUG); // corrupted indices < k that stay
    const statusOk = remaining === 0;
    chips.innerHTML = `
      <span class="chip">Rewind to <b>T = ${isoAt(k)}</b></span>
      <span class="chip">Reprocess <b>${reproc}</b> of ${N} batches</span>
      <span class="chip ${statusOk ? 'ok' : 'warn'}">${statusOk
        ? '✓ Captures all corrupted data'
        : '⚠ ' + remaining + ' corrupted batch' + (remaining>1?'es':'') + ' before T would remain — drag T earlier'}</span>`;
    // value meter
    const pct = Math.round(reproc / N * 100);
    const rewindCost = REFRESH_COST * reproc / N;
    const saved = REFRESH_COST - rewindCost;
    rewindFill.style.width = pct + "%";
    rewindNum.innerHTML = `<span class="vcost">${usd(rewindCost)}</span>`;
    saveEl.textContent = `↓ ${usd(saved)} saved vs a full refresh — ${Math.round((1 - reproc/N) * 100)}% less compute`;
  }

  function fullReset() {
    busy = false; done = false;
    runBtn.disabled = false; runBtn.textContent = "⟲ Rewind & Replay to T";
    ckpt.style.left = "100%";
    for (let i=0;i<N;i++) document.getElementById("rrS"+i).className = "cell src-cell consumed";
    steps.forEach(el => el.classList.remove("active","done"));
    codeB.className = "code-badge bad"; codeB.textContent = "code: buggy";
    bug.classList.remove("patched"); bug.querySelector(".bl").textContent = "✗ bad commit";
    setBand(); renderTarget(false); renderChips();
    narr.innerHTML = "";
  }

  function setK(nk) {
    if (busy) return;
    nk = Math.max(1, Math.min(N-1, nk));
    if (nk === k && !done) return;
    k = nk;
    if (done) { fullReset(); } else { setBand(); renderTarget(false); renderChips(); }
  }

  // pointer drag / click on ruler
  function pointerToK(clientX) {
    const r = ruler.getBoundingClientRect();
    const f = (clientX - r.left) / r.width;
    return Math.round(f * N);
  }
  let dragging = false;
  ruler.addEventListener("pointerdown", e => { dragging = true; ruler.setPointerCapture(e.pointerId); setK(pointerToK(e.clientX)); });
  ruler.addEventListener("pointermove", e => { if (dragging) setK(pointerToK(e.clientX)); });
  ruler.addEventListener("pointerup",   () => { dragging = false; });

  const wait = ms => gsap.to({}, { duration: ms * speedMul / 1000 });
  async function run() {
    if (busy) return;
    busy = true; done = false; runBtn.disabled = true;
    steps.forEach(el => el.classList.remove("active","done"));

    // ⓿ redeploy the fix — the deployed code flips buggy → fixed, commit marker patches
    codeB.className = "code-badge fixed"; codeB.textContent = "code: fixed ✓";
    bug.classList.add("patched"); bug.querySelector(".bl").textContent = "✓ patched commit";
    narr.innerHTML = "<b>Fix redeployed.</b> The pipeline now runs correct logic — but the target is still corrupted from the bad commit. Now recover the data:";
    await wait(1900);

    // ① checkpoint rollback
    steps[0].classList.add("active");
    ckpt.style.left = (k / N * 100) + "%";
    for (let i=k;i<N;i++) document.getElementById("rrS"+i).className = "cell src-cell available";
    for (let i=k;i<N;i++) document.getElementById("rrT"+i).classList.add("targeting");  // mark cells being operated on
    narr.innerHTML = "<b>① Checkpoint rolled back to T.</b> Source offsets & operator state reset — batches after T are no longer consumed.";
    await wait(2600);

    // ② erase target after T
    steps[0].classList.remove("active"); steps[0].classList.add("done");
    steps[1].classList.add("active");
    for (let i=k;i<N;i++){ const el=document.getElementById("rrT"+i); el.className="cell tgt-cell empty erasing"; el.innerHTML=`<span class="bn">${dnum(i)}</span>·`; }
    narr.innerHTML = "<b>② Target restored to its version at T.</b> The rewound rows are removed — non-destructive, old versions retained.";
    await wait(2600);

    // ③ replay
    steps[1].classList.remove("active"); steps[1].classList.add("done");
    steps[2].classList.add("active");
    for (let i=k;i<N;i++) document.getElementById("rrS"+i).className = "cell src-cell replaying";
    narr.innerHTML = "<b>③ Restart → Replay.</b> Batches after T re-ingest through the <b>fixed</b> code, rebuilding only the affected data.";
    await wait(1500);
    renderTarget(true);
    ckpt.style.left = "100%";
    await wait(1400);
    for (let i=k;i<N;i++) document.getElementById("rrS"+i).className = "cell src-cell consumed";
    steps[2].classList.remove("active"); steps[2].classList.add("done");

    const remaining = Math.max(0, Math.min(k, N) - BUG);
    narr.innerHTML = remaining === 0
      ? "Done — target is <b>correct</b> and only " + (N-k) + " batch(es) were reprocessed. No full refresh."
      : "Replayed — but <b>" + remaining + "</b> corrupted batch(es) before T were never rewound and remain wrong. Rewind earlier to fix them.";
    busy = false; done = true;
    runBtn.disabled = false; runBtn.textContent = "↺ Run again";
  }

  runBtn.addEventListener("click", () => { if (done) fullReset(); run(); });
  resetBtn.addEventListener("click", fullReset);

  // initial layout (after DOM settles so ruler has width)
  fullReset();
}

/* ---------- AUTO CDC wiring ---------- */
function wireAutoCdc() {
  // change feed in ARRIVAL order (≠ sequence order). seq_num drives reconciliation.
  const EV = [
    { key:101, name:"Ava", op:"INSERT", seq:1, city:"Toronto"   },
    { key:102, name:"Ben", op:"INSERT", seq:1, city:"Ottawa"    },
    { key:101, name:"Ava", op:"UPDATE", seq:2, city:"Calgary"   },
    { key:102, name:"Ben", op:"UPDATE", seq:2, city:"Halifax"   },
    { key:101, name:"Ava", op:"DELETE", seq:4, city:null        },
    { key:101, name:"Ava", op:"UPDATE", seq:3, city:"Vancouver", late:true },
  ];
  const DESC = {
    scd1: "<b>SCD Type 1</b> — one row per key, always the latest. Updates overwrite; a delete removes the row.",
    scd2: "<b>SCD Type 2</b> — full history per key with <code class='kw'>__START_AT</code> / <code class='kw'>__END_AT</code>. The open row is current; a delete closes it.",
  };

  const feedEl = document.getElementById("cdcFeed");
  const outEl  = document.getElementById("cdcOut");
  const outName= document.getElementById("cdcOutName");
  const outSub = document.getElementById("cdcOutSub");
  const descEl = document.getElementById("cdcDesc");
  const toggle = document.getElementById("cdcToggle");
  const recon  = document.getElementById("cdcRecon");
  const reconT = document.getElementById("cdcReconText");
  const runBtn = document.getElementById("cdcRun");
  const prevBtn = document.getElementById("cdcPrev");
  const resetBtn = document.getElementById("cdcReset");
