name: Release single-file build

# Pushing a version tag (e.g. v1.0.0) packs static/ into one offline HTML file
# and publishes it as a downloadable asset on a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to create the Release and upload the asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pack into a single offline HTML file
        run: python build_release.py -o dist/sdp-explorer.html

      - name: Name the artifact with the tag
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          cp dist/sdp-explorer.html "dist/sdp-explorer-${tag}.html"

      - name: Upload as workflow artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: sdp-explorer-html
          path: dist/sdp-explorer-*.html

      - name: Publish GitHub Release with the HTML attached
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sdp-explorer-*.html
          generate_release_notes: true
          body: |
            **SDP Explorer — single-file offline build.**

            Download `sdp-explorer-${{ github.ref_name }}.html` below and open it
            in any browser. No install, no server, no internet required: all
            scripts, images, and fonts are embedded.
